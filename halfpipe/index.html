<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3E8EDE">
<title>Halfpipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Same look as Skiing: full-screen pixel canvas scaled up crisp, pixel HUD on top, overlay cards for menu, turns and results. */
:root{
  --ink:#1B1F3B; --sky:#3E8EDE; --snow:#F4FAFF; --pop:#E83B3B; --gold:#FFD23F; --orange:#FF9A2E;
  --cpu:#A9D4F5; --white:#FFFFFF;
  --pix:"Press Start 2P",ui-monospace,monospace;
  --body:"Pixelify Sans","Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:11px;line-height:1;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.who{color:var(--white);text-shadow:1px 1px 0 var(--ink)}
.chip.sc{font-size:10px;padding:5px 6px;opacity:.75}
.chip.sc.on{background:var(--gold);opacity:1}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(27,31,59,.28)}
.card{box-sizing:border-box;width:min(350px,100%);max-height:100%;overflow-y:auto;background:var(--white);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px 18px 16px;text-align:center}
.card h1{font-family:var(--pix);font-size:30px;line-height:1.15;margin:4px 0 12px;color:var(--pop);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.card h1.good{color:var(--gold)}
.card h1.c-me{color:var(--me,var(--pop))} .card h1.c-cpu{color:var(--cpu)} .card h1.c-red{color:var(--pop)} .card h1.c-blue{color:#2F7FE0}
.card p{margin:6px 0;font-size:17px;line-height:1.3}
.card ul{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:15px;line-height:1.3;display:grid;gap:6px}
.card li{padding-left:18px;position:relative}
.card li::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.card li.g::before{background:var(--gold)} .card li.o::before{background:var(--orange)} .card li.r::before{background:var(--pop)} .card li.b::before{background:var(--cpu)}
.btn{font-family:var(--pix);font-size:15px;line-height:1.2;background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px;cursor:pointer;margin-top:10px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.lv button:focus-visible,.home:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.btn.alt{background:var(--white);font-size:12px;padding:9px 12px;box-shadow:3px 3px 0 var(--ink)}
.lv{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-height:min(46vh,300px);overflow-y:auto;padding:4px 6px 6px 4px;margin:4px 0 6px}
.lv button{font-family:var(--pix);font-size:13px;width:42px;height:38px;padding:0;background:var(--white);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--pop);color:var(--white)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
.modes button{font-family:var(--pix);font-size:11px;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 4px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold)}
.modes button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.card p.mode2{font-size:15px;margin:8px 0 0}
.picks{display:grid;gap:10px;margin:12px 0 4px}
.charBtn{box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;margin:0;text-align:left;font-family:var(--pix);font-size:11px;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 12px 5px 5px;cursor:pointer}
.charBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.charBtn:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.charBtn .mini{width:40px;height:40px;background:linear-gradient(var(--sky) 0 72%,var(--snow) 72%);border:2px solid var(--ink);display:grid;place-items:center}
.charBtn canvas{width:32px;height:32px;image-rendering:pixelated;image-rendering:crisp-edges}
.charBtn i{font-style:normal;color:var(--pop);margin-left:auto}
.charBtn .num{font-size:15px;color:var(--ink);background:var(--gold)}
body.two .charBtn{display:none}
.charPrev{width:120px;height:120px;margin:4px auto 14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:linear-gradient(var(--sky) 0 72%,var(--snow) 72%);display:grid;place-items:center}
.charPrev canvas{width:96px;height:96px;image-rendering:pixelated;image-rendering:crisp-edges}
.charRows{display:grid;gap:10px;text-align:left}
.charRow b{display:block;font-family:var(--pix);font-size:9px;font-weight:400;margin-bottom:5px}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:30px;height:30px;padding:0;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.sw button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px;box-shadow:none}
.sw button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.stats{font-family:var(--pix);font-size:11px;line-height:1.9;margin:10px 0 4px}
.stats .best{display:block;font-family:var(--body);font-size:15px;line-height:1.3;margin-top:6px}
.trophy{display:block;width:64px;height:56px;margin:0 auto 2px;image-rendering:pixelated;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.trophy{animation:none}}
.board{width:100%;border-collapse:collapse;font-family:var(--pix);font-size:10px;margin:6px 0 4px}
.board th{font-weight:400;font-size:8px;padding:2px 3px;text-align:right}
.board td{padding:6px 3px;text-align:right;border-top:2px solid var(--ink)}
.board td:first-child,.board th:first-child{text-align:left}
.board td i{display:inline-block;width:8px;height:8px;border:2px solid var(--ink);margin-right:5px;vertical-align:-2px}
.board tr.win td{background:var(--gold)}
.board b{font-size:13px}
.home{display:table;margin:14px auto 0;font-family:var(--pix);font-size:10px;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--pop);padding-bottom:2px}
.ffBtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--pix);font-size:11px;line-height:1.2;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;cursor:pointer}
.ffBtn b{font-weight:400}
.ffBtn[aria-pressed="true"]{background:var(--gold);animation:blink2 .5s steps(2) infinite}
@keyframes blink2{50%{background:var(--orange)}}
.ffBtn:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--pix);font-size:10px;line-height:1.4;text-align:center;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 8px;pointer-events:none;width:max-content;max-width:calc(100% - 40px)}
</style>
</head>
<body>
<canvas id="c" aria-label="Halfpipe"></canvas>
<div class="hud" id="hud" hidden>
  <div class="row">
    <div class="chip who" id="whoChip">DU</div>
    <div class="chip" id="hitChip">1/6</div>
    <div class="chip" id="rndChip">1/2</div>
  </div>
  <div class="row"><div class="chip sc" id="sc0">DU 0</div><div class="chip sc" id="sc1">CPU 0</div></div>
</div>
<div class="hint" id="hint" hidden></div>
<button type="button" class="ffBtn" id="ffBtn" hidden aria-pressed="false"><span aria-hidden="true">▶▶</span> <b data-i18n="fwd">VORSPULEN</b></button>

<div class="overlay" id="startOv">
  <div class="card">
    <h1 class="good" data-i18n="title">HALFPIPE!</h1>
    <p data-i18n="intro"></p>
    <div class="picks">
      <button type="button" class="charBtn" id="charBtn" aria-haspopup="dialog"><span class="mini"><canvas id="charMini" width="16" height="16"></canvas></span><span data-i18n="you2">DEIN SNOWBOARDER</span><i aria-hidden="true">▶</i></button>
      <button type="button" class="charBtn" id="lvlBtn" aria-haspopup="dialog" hidden><span class="mini num" id="lvlNum">1</span><span data-i18n="from">LEVEL</span><i aria-hidden="true">▶</i></button>
    </div>
    <ul id="rules"></ul>
    <div class="modes" id="modes" role="group"><button type="button" data-m="1" data-i18n="p1">1 SPIELER</button><button type="button" data-m="2" data-i18n="p2">2 SPIELER</button></div>
    <p class="mode2" id="mode2" hidden data-i18n="rule2"></p>
    <button class="btn" id="startBtn" data-i18n="start">LOS!</button>
    <a class="home" href="../" data-i18n="home">← ALLE SPIELE</a>
  </div>
</div>
<div class="overlay" id="charOv" hidden>
  <div class="card" role="dialog" aria-labelledby="charTitle">
    <h1 class="good" id="charTitle" data-i18n="you2">DEIN SNOWBOARDER</h1>
    <div class="charPrev"><canvas id="charCv" width="16" height="16"></canvas></div>
    <div class="charRows" id="charRows"></div>
    <button class="btn" id="charDone" data-i18n="done">FERTIG</button>
  </div>
</div>
<div class="overlay" id="lvlOv" hidden>
  <div class="card" role="dialog" aria-labelledby="lvlTitle">
    <h1 class="good" id="lvlTitle" data-i18n="from">LEVEL</h1>
    <div class="lv" id="lvRow" role="group" aria-labelledby="lvlTitle"></div>
    <button class="btn" id="lvlDone" data-i18n="done">FERTIG</button>
  </div>
</div>
<div class="overlay" id="turnOv" hidden>
  <div class="card">
    <h1 id="turnTitle">DU BIST DRAN!</h1>
    <p id="turnText"></p>
    <div class="stats" id="turnStats"></div>
    <button class="btn" id="goBtn">LOS!</button><br>
    <button class="btn alt" id="quitBtn" data-i18n="menu">MENÜ</button>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="card">
    <svg id="trophy" class="trophy" viewBox="0 0 16 14" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1B1F3B" d="M3 0h10v1h2v4h-1v1h-2v1h-1v2h-1v1h2v1h1v3H3v-3h1V10h2V9H5V7H4V6H2V5H1V1h2Z"/><path fill="#FFD23F" d="M4 1h8v5h-1v1h-1v2H6V7H5V6H4ZM2 2h1v2H2ZM13 2h1v2h-1ZM5 11h6v2H5Z"/><path fill="#FFF0A8" d="M5 2h1v3H5Z"/><path fill="#FF9A2E" d="M10 2h1v4h-1Z"/></svg>
    <h1 id="endTitle">GEWONNEN!</h1>
    <p id="endText"></p>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">NOCHMAL</button><br>
    <button class="btn alt" id="menuBtn" data-i18n="menu">MENÜ</button>
  </div>
</div>

  if(!r.plan)r.plan={f:Math.min(0.99,Math.max(0.2,SK.f+(Math.random()*2-1)*SK.spread))};

function riderPose(r){

/* ---------- game flow ---------- */

function planRound(){const r=Math.floor(turn/2);if(turn%2)return;
  if(r===0){order[0]=first;order[1]=1-first}
  else{const[a,b]=players,lead=a.total>b.total?0:b.total>a.total?1:order[0];order[turn]=lead;order[turn+1]=1-lead}}

  const row=$('#lvRow');row.innerHTML='';$('#lvlBtn').hidden=reached<2;$('#lvlNum').textContent=pick;
  for(let i=1;i<=reached;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.setAttribute('aria-pressed',i===pick);
    b.onclick=()=>{pick=i;row.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed',j+1===i));$('#lvlNum').textContent=i;theme=THEMES[(i-1)%THEMES.length];beep('tick')};row.append(b)}
}
function newGame(lv){
  level=two?pick:lv;if(!two)try{localStorage.setItem('halfpipe.level',lv)}catch(_){}
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  if(AC&&AC.state==='suspended')AC.resume();
  theme=THEMES[(level-1)%THEMES.length];

  players=(two?['red','blue']:['me','cpu']).map(k=>({key:k,ai:k==='cpu',total:0,runs:[],best:null}));
  first=1-first;try{localStorage.setItem('halfpipe.first',first)}catch(_){}

}

let finT=0,conf=[],fworks=[],finWhy='tie',finWin=null;

  if(two)return a.total>b.total?['redWin',a]:b.total>a.total?['blueWin',b]:['tie',null];

/* After the last run: the winner rides a victory run with big tricks, confetti and fireworks, then the score card. */
function startFinale(){

function finFx(dt){

  if(finWhy!=='lose'||Math.random()<0.3)for(let i=0;i<(conf.length<160?3:0);i++)conf.push({x:Math.random()*W,y:-4-Math.random()*20,vx:(Math.random()-0.5)*20,vy:20+Math.random()*30,c:['#E83B3B','#FFD23F','#2F7FE0','#6CC24A','#FF6FB5','#FF9A2E','#FFFFFF'][Math.floor(Math.random()*7)],ph:Math.random()*6});
  conf.forEach(c=>{c.x+=(c.vx+Math.sin(clock*3+c.ph)*12)*dt;c.y+=c.vy*dt});conf=conf.filter(c=>c.y<H+4);
  if(finWhy!=='lose'&&Math.random()<dt*1.6){const x=W*(0.15+Math.random()*0.7),y=TOPM+10+Math.random()*H*0.25,col=['#FFD23F','#FF6FB5','#6CC24A','#7FC8F0','#FF9A2E'][Math.floor(Math.random()*5)];
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2,v=30+Math.random()*25;fworks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0.9+Math.random()*0.4,col})}beep('flip')}
  fworks.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=25*dt;f.t-=dt});fworks=fworks.filter(f=>f.t>0);
}
function drawFinale(){
  fworks.forEach(f=>rect(f.t>0.3||Math.floor(clock*20)%2?f.col:'#FFFFFF',f.x,f.y,1,1));
  conf.forEach(c=>rect(c.c,c.x,c.y,Math.sin(clock*6+c.ph)>0?2:1,2));
  if(state==='finale'){const sc=Math.min(1,finT*3),y=TOPM+Math.round(H*0.12),len=T[finWhy].length,sz=len*24<=W*0.92&&finT<0.4?24:len*16<=W*0.92?16:8;
    txt(T[finWhy],W/2,y+Math.round(Math.sin(clock*5)*3),finWhy==='lose'?'#E83B3B':'#FFD23F',sc<1?8:sz)}
}
function showEnd(refresh){
  state='end';$('#endOv').hidden=false;$('#hud').hidden=true;$('#hint').hidden=true;
  const[a,b]=players,why=outcome()[0],win=outcome()[1];
  $('#endTitle').textContent=T[why];$('#endTitle').className=why==='lose'?'':'good';
  $('#endText').textContent=T[why+'P'];
  const bestP=[a,b].filter(p=>p.best).sort((x,y)=>y.best.pts-x.best.pts)[0];
  $('#trophy').hidden=why==='lose';
  // score board: one row per player, runs and total; the total counts up
  let h=`<table class="board"><tr><th></th>${Array.from({length:ROUNDS},(_,i)=>`<th>${T.run} ${i+1}</th>`).join('')}<th>${T.tot}</th></tr>`;
  players.forEach(p=>{h+=`<tr class="${p===win?'win':''}"><td><i style="background:${PL[p.key].col()}"></i>${pname(p)}</td>${p.runs.map(v=>`<td>${v}</td>`).join('')}<td><b data-to="${p.total}">${refresh?p.total:0}</b></td></tr>`});
  h+='</table>';
  $('#endStats').innerHTML=h+(bestP?`<span class="best">${T.best}: ${pname(bestP)} – ${bestP.best.name} (${bestP.best.pts})</span>`:'');
  if(!refresh){const els=[...document.querySelectorAll('#endStats b[data-to]')],t0=performance.now();
    (function count(now){const k=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-k,3);els.forEach(el=>el.textContent=Math.round(+el.dataset.to*e));if(k<1&&state==='end')requestAnimationFrame(count);else if(k>=1)beep('super')})(t0)}
  $('#againBtn').textContent=!two&&why==='win'?T.next:T.retry;
  if(!refresh){
    if(!two&&why==='win'){if(level+1>reached){reached=level+1;try{localStorage.setItem('halfpipe.reach',reached)}catch(_){}}pick=level+1}else if(!two)pick=level;
    fitTitles();$('#againBtn').focus();
  }else fitTitles();
}
function toMenu(){state='menu';$('#endOv').hidden=true;$('#turnOv').hidden=true;$('#hud').hidden=true;$('#hint').hidden=true;$('#startOv').hidden=false;res=null;paintLevels();demo();fitTitles()}
let hudCache='';
function updHud(){
  if(state!=='run'&&state!=='after')return;
  const p=cur(),r=rider,live=i=>players[i].total+(players[i]===p&&r&&!r.done?r.run:0);
  const key=[p.key,r?r.hits:0,turn,live(0),live(1),lang].join('|');if(key===hudCache)return;hudCache=key;
  const w=$('#whoChip');w.textContent=pname(p);w.style.background=PL[p.key].col();
  $('#hitChip').textContent=`${T.hit} ${Math.min(HITS,Math.max(1,r?r.hits+(r.air||r.done?0:1):1))}/${HITS}`;
  $('#rndChip').textContent=`${T.round} ${Math.floor(turn/2)+1}/${ROUNDS}`;
  [0,1].forEach(i=>{const c=$('#sc'+i);c.textContent=`${pname(players[i])} ${live(i)}`;c.classList.toggle('on',players[i]===p)});
}

/* ---------- skier & level pickers ---------- */
function paintChar(){
  const rows=$('#charRows');rows.innerHTML='';
  [['g','cGear'],['j','cTop'],['p','cPants'],['s','cSkin']].forEach(([k,lbl])=>{
    const row=document.createElement('div');row.className='charRow';
    const b=document.createElement('b');b.textContent=T[lbl];row.append(b);
    const sw=document.createElement('div');sw.className='sw';sw.setAttribute('role','group');sw.setAttribute('aria-label',T[lbl]);
    OUTFIT[k].forEach((c,i)=>{const btn=document.createElement('button');btn.type='button';btn.style.background=c;btn.setAttribute('aria-label',T[lbl]+' '+(i+1));btn.setAttribute('aria-pressed',look[k]===i);
      btn.onclick=()=>{look[k]=i;try{localStorage.setItem('skiing.char',JSON.stringify(look))}catch(_){}
        sw.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));SPR_ME=makeMe();drawPrev();beep('tick')};sw.append(btn)});
    row.append(sw);rows.append(row)});
  drawPrev();
}
function drawPrev(){['#charCv','#charMini'].forEach(id=>{const g=$(id).getContext('2d');g.clearRect(0,0,16,16);g.drawImage(SPR_ME.side,0,0)})}
const DIALOGS=[['#charOv','#charBtn','#charDone','#charRows'],['#lvlOv','#lvlBtn','#lvlDone','#lvRow']];
function openDlg(ov,btn,done,rows){$('#startOv').hidden=true;$(ov).hidden=false;fitTitles();const on=$(rows+' button[aria-pressed="true"]');
  if(on){on.scrollIntoView({block:'nearest'});on.focus()}else $(done).focus()}
function closeDlg(ov,btn){$(ov).hidden=true;$('#startOv').hidden=false;fitTitles();$(btn).focus()}
DIALOGS.forEach(([ov,btn,done,rows])=>{$(btn).onclick=()=>openDlg(ov,btn,done,rows);$(done).onclick=()=>closeDlg(ov,btn);
  $(ov).addEventListener('click',e=>{if(e.target===e.currentTarget)closeDlg(ov,btn)})});
addEventListener('keydown',e=>{if(e.code==='Escape')DIALOGS.forEach(([ov,btn])=>{if(!$(ov).hidden)closeDlg(ov,btn)})});
try{two=localStorage.getItem('halfpipe.mode')==='2'}catch(_){}
function paintModes(){document.body.classList.toggle('two',two);document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.m==='2')===two));$('#mode2').hidden=!two;$('#lvlBtn').hidden=two||reached<2;if(state==='menu')demo();fitTitles()}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{two=b.dataset.m==='2';try{localStorage.setItem('halfpipe.mode',two?'2':'1')}catch(_){}paintModes()});
$('#startBtn').onclick=()=>newGame(two?1:pick);
$('#goBtn').onclick=startRun;
$('#quitBtn').onclick=toMenu;
$('#againBtn').onclick=()=>newGame(two?1:pick);
$('#menuBtn').onclick=toMenu;
$('#ffBtn').onclick=()=>{ffOn=!ffOn;$('#ffBtn').setAttribute('aria-pressed',String(ffOn));beep('tick')};

/* ---------- input: tap = jump, swipe = trick ---------- */
const human=()=>state==='run'&&rider&&!rider.ai;
let anchor=null;
cv.addEventListener('pointerdown',e=>{if(e.cancelable)e.preventDefault();if(state==='finale'&&finT>0.8){showEnd();return}if(!human())return;anchor={id:e.pointerId,x:e.clientX,y:e.clientY};press(rider)});
addEventListener('pointermove',e=>{if(!anchor||e.pointerId!==anchor.id||!human())return;
  const dx=e.clientX-anchor.x,dy=e.clientY-anchor.y;if(Math.hypot(dx,dy)<30)return;
  // one swipe = one trick, however long it is: the same direction counts again only after lifting the finger
  const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d');
  if(k!==anchor.last){trick(rider,k);anchor.last=k}
  anchor.x=e.clientX;anchor.y=e.clientY});
const lift=e=>{if(anchor&&e.pointerId===anchor.id)anchor=null};
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);
const KEYS={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d'};
addEventListener('keydown',e=>{if(e.repeat)return;
  if(human()){if(KEYS[e.code]){e.preventDefault();trick(rider,KEYS[e.code])}else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();press(rider)}return}
  if((e.code==='Enter'||e.code==='Space')&&document.activeElement===document.body){const b=!$('#startOv').hidden?$('#startBtn'):!$('#turnOv').hidden?$('#goBtn'):!$('#endOv').hidden?$('#againBtn'):null;if(b){e.preventDefault();b.click()}}});

/* ---------- main loop ---------- */
let ffOn=false;
let last=0,slow=1,slowOn=false,megaT=9;
/* very high jumps (about 5 m and more, only with a tap right at the edge) go into slow motion around the top */
function slowTarget(r){if(!r||!r.air||r.crashed)return 1;const nat=r.tAir/r.Tair;return r.hmax*METERS>=4.9&&nat>0.16&&nat<0.84?0.35:1}
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;clock+=dt;
  if(state==='turn'&&autoT>0){autoT-=dt;if(autoT<=0)startRun()}
  const st=slowTarget(rider);slow+=(st-slow)*Math.min(1,dt*(st<slow?7:5));
  if(st<1&&!slowOn){slowOn=true;megaT=0;whoosh()}else if(st>=1)slowOn=false;if(megaT<9)megaT+=dt;
  // fast forward during the computer's run
  const cpuTurn=(state==='run'||state==='after')&&players.length&&cur().ai,fwd=cpuTurn&&ffOn?4:1;
  $('#ffBtn').hidden=!cpuTurn;if(!cpuTurn&&ffOn){ffOn=false;$('#ffBtn').setAttribute('aria-pressed','false')}
  const sdt=dt*slow*fwd,n=3*fwd;
  if(rider&&(state==='run'||state==='after'||state==='menu'||state==='finale'||state==='end')){for(let i=0;i<n;i++)step(rider,sdt/n)}
  if(state==='finale'){finT+=dt;finFx(dt);if(finT>3.4)showEnd()}else if(state==='end')finFx(dt);
  if(state==='after'){afterT-=dt*fwd;if(afterT<=0){turn++;if(turn>=ROUNDS*2)startFinale();else showTurn()}}
  if(hintT>0){hintT-=dt;$('#hint').hidden=hintT<=0||state!=='run'}
  updFx(sdt);
  // camera: lift the view when the rider flies high
  let want=0;if(rider&&rider.air){const top=SY(HC+rider.ay)-camUp-(rider.tricks.length?44:28);want=Math.max(0,TOPM+6-top)}
  camUp+=(want-camUp)*Math.min(1,dt*(want>camUp?8:3));
  drawSky();drawBg();drawDeck();drawPipe();
  if(rider)drawRider(rider);
  drawMeter(rider);drawFx();
  if(state==='finale'||state==='end')drawFinale();
  if(slow<0.97){const k=(1-slow)/0.65,bh=Math.round(H*0.07*k);rect('#1B1F3B',0,0,W,bh);rect('#1B1F3B',0,H-bh,W,bh);
    ctx.save();ctx.globalAlpha=0.18*k;rect('#7FC8F0',0,0,W,H);ctx.restore()}
  if(megaT<1.6&&state!=='menu'){const l=T.mega.length,sz=l*16<=W*0.9?16:8;ctx.save();ctx.globalAlpha=megaT<1.2?1:1-(megaT-1.2)/0.4;txt(T.mega,W/2+(Math.floor(clock*14)%2),TOPM+26,Math.floor(clock*8)%2?'#FF9A2E':'#FFD23F',megaT<0.15?8:sz);ctx.restore()}
  updHud();
  requestAnimationFrame(frame);
}
(function init(){
  let want='de';try{const s=localStorage.getItem('irrgarten.lang');if(LANG[s])want=s;else{const n=(navigator.language||'de').slice(0,2);if(LANG[n])want=n}}catch(_){}
  setLang(want,false);paintLevels();paintModes();demo();
  if(document.fonts)document.fonts.ready.then(fitTitles);
  requestAnimationFrame(frame);
})();
window.__hp={get rider(){return rider},get state(){return state},get players(){return players},press:()=>rider&&press(rider),trick:k=>rider&&trick(rider,k),startRun,newGame,wallF};
</script>
