<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1B1F3B">
<title>Leben</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Conway's Game of Life, pixel look of Skiing/Halfpipe. Full-screen grid; touch to bring cells to life. */
:root{
  --ink:#1B1F3B; --night:#141731; --pop:#E83B3B; --gold:#FFD23F; --orange:#FF9A2E; --lila:#8E5BD9; --cpu:#A9D4F5; --white:#FFFFFF;
  --pix:"Press Start 2P",ui-monospace,monospace;
  --body:"Pixelify Sans","Press Start 2P",ui-monospace,monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
body.bw{background:#000}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;pointer-events:none}
.chip{font-family:var(--pix);font-size:11px;line-height:1;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 7px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
a.chip{pointer-events:auto}
a.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.dead{background:var(--pop);color:var(--white)}
.title{margin-left:auto;font-family:var(--pix);font-size:13px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
.zoom{display:flex;gap:8px;pointer-events:auto}
.zoom .chip{font-size:16px;width:36px;height:32px;padding:0;cursor:pointer}
.zoom .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.zoom .chip:disabled{opacity:.4;cursor:default;transform:none;box-shadow:3px 3px 0 var(--ink)}
.zoom .chip:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
@media (max-width:440px){.title{display:none}.zoom{margin-left:auto}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:8px;pointer-events:none}
.bar button{pointer-events:auto;flex:0 1 52px;height:50px;min-width:40px;padding:0;display:grid;place-items:center;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-family:var(--pix);font-size:11px}
.bar button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.bar button.on{background:var(--gold)}
.bar button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.bar svg{width:26px;height:26px;display:block}
#toolBtn{flex-basis:64px;background:var(--gold)}
#toolBtn canvas{width:30px;height:30px;image-rendering:pixelated;image-rendering:crisp-edges}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));font-family:var(--pix);font-size:10px;line-height:1.5;text-align:center;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 9px;pointer-events:none;width:max-content;max-width:calc(100% - 40px);transition:opacity .3s}
.hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="c" aria-label="Game of Life"></canvas>
<div class="top">
  <a class="chip" href="../" aria-label="Alle Spiele" id="home">←</a>
  <div class="chip" id="genChip">GEN 0</div>
  <div class="chip" id="popChip">0</div>
  <div class="title" id="title">LEBEN</div>
  <div class="zoom"><button type="button" class="chip" id="lessBtn" aria-label="−">−</button><button type="button" class="chip" id="moreBtn" aria-label="+">+</button></div>
</div>
<div class="hint" id="hint"></div>
<div class="bar">
  <button type="button" id="playBtn" aria-label="Play/Pause"></button>
  <button type="button" id="stepBtn" aria-label="Step">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M2 2h2v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-2Z" fill="#1B1F3B"/><rect x="8" y="2" width="2" height="8" fill="#1B1F3B"/></svg>
  </button>
  <button type="button" id="toolBtn" aria-label="Tool"><canvas id="toolCv" width="7" height="7"></canvas></button>
  <button type="button" id="speedBtn" aria-label="Speed">1×</button>
  <button type="button" id="bwBtn" aria-label="S/W" aria-pressed="false">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="1" width="10" height="10" fill="#1B1F3B"/><rect x="2" y="2" width="4" height="8" fill="#fff"/><rect x="6" y="2" width="4" height="8" fill="#000"/></svg>
  </button>
  <button type="button" id="clrBtn" aria-label="Clear">
    <svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M2 2h2v1h1v1h2v-1h1v-1h2v2h-1v1h-1v2h1v1h1v2h-2v-1h-1v-1h-2v1h-1v1h-2v-2h1v-1h1v-2h-1v-1h-1Z" fill="#1B1F3B"/></svg>
  </button>
</div>

<script>
'use strict';
/* =========================================================================
   LEBEN — Conway's Game of Life for Jonas.
   Touch the grid: drag to draw living cells (start on a living cell to
   erase instead). The yellow button switches the touch tool: pen, glider,
   spaceship, boom — those drop a pattern where you tap. Several fingers
   work at once. The edges wrap around.
   ========================================================================= */

// ---------- Texts (shared language key with the other games) ----------
const L={
  de:{title:'LEBEN',doc:'Leben',home:'Alle Spiele',hint:'TIPP & ZIEH = ZELLEN MALEN',tools:['STIFT','GLEITER','RAUMSCHIFF','BUMM'],dead:'ALLES TOT'},
  en:{title:'LIFE',doc:'Life',home:'All games',hint:'TAP & DRAG = DRAW CELLS',tools:['PEN','GLIDER','SPACESHIP','BOOM'],dead:'ALL DEAD'},
  fr:{title:'VIE',doc:'Vie',home:'Tous les jeux',hint:'TOUCHE & GLISSE = DESSINE',tools:['CRAYON','PLANEUR','VAISSEAU','BOUM'],dead:'TOUT EST MORT'},
  es:{title:'VIDA',doc:'Vida',home:'Todos los juegos',hint:'TOCA Y ARRASTRA = DIBUJA',tools:['LÁPIZ','PLANEADOR','NAVE','BUM'],dead:'TODO MUERTO'},
  it:{title:'VITA',doc:'Vita',home:'Tutti i giochi',hint:'TOCCA E TRASCINA = DISEGNA',tools:['MATITA','ALIANTE','ASTRONAVE','BUM'],dead:'TUTTO MORTO'},
  pt:{title:'VIDA',doc:'Vida',home:'Todos os jogos',hint:'TOQUE E ARRASTE = DESENHE',tools:['LÁPIS','PLANADOR','NAVE','BUM'],dead:'TUDO MORTO'}
};
let lang='de';
try{const s=localStorage.getItem('irrgarten.lang');if(L[s])lang=s;else{const n=(navigator.language||'de').slice(0,2);if(L[n])lang=n}}catch(_){}
const T=L[lang];
document.documentElement.lang=lang;
document.title=T.doc;
document.getElementById('title').textContent=T.title;
document.getElementById('home').setAttribute('aria-label',T.home);

// ---------- Canvas & grid ----------
const cv=document.getElementById('c'), g=cv.getContext('2d');
const COL={bg:'#141731',line:'#1E2246',ghost:['#2A2F5C','#262A54','#22264C','#1E2246']};
// age → colour: newborn white, then gold, orange, red, lila; long-lived (still) cells calm blue
const AGE=['#FFFFFF','#FFD23F','#FFD23F','#FF9A2E','#FF9A2E','#E83B3B','#E83B3B','#E83B3B','#C04BC9','#8E5BD9'];
const OLD='#A9D4F5';
// zoom: + doubles the number of cells, − halves it
const CS_MIN=3,ZMIN=-2,ZMAX=8;
let zoom=0;
function updateZoomBtns(base){
  document.getElementById('lessBtn').disabled=zoom<=ZMIN;
  document.getElementById('moreBtn').disabled=zoom>=ZMAX||Math.round(base/Math.pow(Math.SQRT2,zoom+1))<CS_MIN;
}
let W=0,H=0,dpr=1,cs=12,cols=0,rows=0,ox=0,oy=0;
let grid=new Uint8Array(0),next=new Uint8Array(0),age=new Uint16Array(0),ghost=new Uint8Array(0);

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  // grid fits between the chips on top and the buttons at the bottom
  const y0=document.querySelector('.top').getBoundingClientRect().bottom+8;
  const y1=document.querySelector('.bar').getBoundingClientRect().top-8;
  const base=Math.max(11,Math.round(Math.min(W,H)/28));
  zoom=Math.max(ZMIN,Math.min(zoom,ZMAX));
  cs=Math.max(CS_MIN,Math.round(base/Math.pow(Math.SQRT2,zoom)));
  updateZoomBtns(base);
  const c2=Math.max(8,Math.floor((W-12)/cs)),r2=Math.max(8,Math.floor((y1-y0)/cs));
  // keep whatever was alive, centred
  const old=grid,oc=cols,or=rows,oa=age;
  const ng=new Uint8Array(c2*r2),na=new Uint16Array(c2*r2);
  if(old.length){const dx=((c2-oc)/2)|0,dy=((r2-or)/2)|0;
    for(let y=0;y<or;y++)for(let x=0;x<oc;x++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=c2||ny>=r2)continue;ng[ny*c2+nx]=old[y*oc+x];na[ny*c2+nx]=oa[y*oc+x]}}
  cols=c2;rows=r2;grid=ng;age=na;next=new Uint8Array(cols*rows);ghost=new Uint8Array(cols*rows);
  ox=Math.floor((W-cols*cs)/2);oy=Math.floor(y0+(y1-y0-rows*cs)/2);
  dirty=true;
}

// ---------- Life ----------
let gen=0,pop=0;
function step(){
  for(let y=0;y<rows;y++){
    const ym=((y-1+rows)%rows)*cols,y0=y*cols,yp=((y+1)%rows)*cols;
    for(let x=0;x<cols;x++){
      const xm=(x-1+cols)%cols,xp=(x+1)%cols;
      const n=grid[ym+xm]+grid[ym+x]+grid[ym+xp]+grid[y0+xm]+grid[y0+xp]+grid[yp+xm]+grid[yp+x]+grid[yp+xp];
      const i=y0+x,a=grid[i],l=a?(n===2||n===3):n===3;
      next[i]=l?1:0;
      if(l)age[i]=a?Math.min(age[i]+1,9999):0;
      else{if(a)ghost[i]=4;else if(ghost[i])ghost[i]--;age[i]=0}
    }
  }
  [grid,next]=[next,grid];
  gen++;dirty=true;
}
function count(){let p=0;for(let i=0;i<grid.length;i++)p+=grid[i];return p}
function randomize(){
  for(let i=0;i<grid.length;i++){grid[i]=Math.random()<.22?1:0;age[i]=0;ghost[i]=0}
  gen=0;dirty=true;
}
function clearAll(){grid.fill(0);age.fill(0);ghost.fill(0);gen=0;dirty=true}
const wrap=(x,y)=>((y%rows+rows)%rows)*cols+((x%cols+cols)%cols);
function setCell(x,y,v){const i=wrap(x,y);if(grid[i]===v)return;grid[i]=v;age[i]=0;ghost[i]=v?0:4;dirty=true}

// ---------- Tools ----------
const PATTERNS=[
  null,                                                         // pen
  [[1,0],[2,1],[0,2],[1,2],[2,2]],                              // glider
  [[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],      // lightweight spaceship
  'boom'                                                        // random burst
];
let tool=0;
function stamp(cx,cy){
  let p=PATTERNS[tool];
  if(p==='boom'){p=[];for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(x*x+y*y<=10&&Math.random()<.5)p.push([x,y])}
  else{
    // random direction, so gliders and ships fly off every which way
    const r=Math.floor(Math.random()*4),f=Math.random()<.5;
    p=p.map(([x,y])=>{if(f)x=-x;for(let k=0;k<r;k++)[x,y]=[-y,x];return[x,y]});
    const mx=Math.round(p.reduce((s,q)=>s+q[0],0)/p.length),my=Math.round(p.reduce((s,q)=>s+q[1],0)/p.length);
    p=p.map(([x,y])=>[x-mx,y-my]);
  }
  for(const[x,y]of p)setCell(cx+x,cy+y,1);
  flashes.push({x:cx,y:cy,t:0});
}
// little preview of the current tool on the yellow button
const tcv=document.getElementById('toolCv'),tg=tcv.getContext('2d');
const PREV=[[[3,3]],[[3,1],[4,2],[2,3],[3,3],[4,3]],[[2,1],[5,1],[1,2],[1,3],[5,3],[1,4],[2,4],[3,4],[4,4]],[[1,1],[3,1],[5,1],[2,3],[4,3],[1,5],[3,5],[5,5],[3,0],[0,3],[6,3],[3,6]]];
function drawTool(){
  tg.clearRect(0,0,7,7);tg.fillStyle='#1B1F3B';
  for(const[x,y]of PREV[tool])tg.fillRect(x,y,1,1);
  document.getElementById('toolBtn').setAttribute('aria-label',T.tools[tool]);
}

// ---------- Touch: every finger draws ----------
const ptrs=new Map();
function cellOf(e){return{x:Math.floor((e.clientX-ox)/cs),y:Math.floor((e.clientY-oy)/cs)}}
function inside(c){return c.x>=0&&c.y>=0&&c.x<cols&&c.y<rows}
function line(a,b,v){const n=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y),1);
  for(let s=0;s<=n;s++)setCell(Math.round(a.x+(b.x-a.x)*s/n),Math.round(a.y+(b.y-a.y)*s/n),v)}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const c=cellOf(e);if(!inside(c))return;
  hideHint();
  if(tool!==0){stamp(c.x,c.y);return}
  const v=grid[c.y*cols+c.x]?0:1;   // start on a living cell = eraser
  ptrs.set(e.pointerId,{v,last:c});
  setCell(c.x,c.y,v);
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const c=cellOf(e);if(!inside(c))return;
  if(c.x!==p.last.x||c.y!==p.last.y){line(p.last,c,p.v);p.last=c}
});
const up=e=>ptrs.delete(e.pointerId);
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---------- Buttons ----------
let running=true,speedI=0;
const SPEEDS=[6,12,24],SPEED_L=['1×','2×','4×'];
const playBtn=document.getElementById('playBtn');
function drawPlay(){
  playBtn.innerHTML=running
    ?'<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="2" width="3" height="8" fill="#1B1F3B"/><rect x="7" y="2" width="3" height="8" fill="#1B1F3B"/></svg>'
    :'<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M3 1h2v1h1v1h1v1h1v1h1v2h-1v1h-1v1h-1v1h-1v1h-2Z" fill="#1B1F3B"/></svg>';
  playBtn.classList.toggle('on',!running);
}
playBtn.onclick=()=>{running=!running;drawPlay()};
document.getElementById('stepBtn').onclick=()=>{running=false;drawPlay();step()};
document.getElementById('toolBtn').onclick=()=>{tool=(tool+1)%PATTERNS.length;drawTool();showHint(T.tools[tool],1200)};
const speedBtn=document.getElementById('speedBtn');
speedBtn.onclick=()=>{speedI=(speedI+1)%SPEEDS.length;speedBtn.textContent=SPEED_L[speedI]};
// black & white (default): white cells on black, no age colours, no shadows (remembered on the phone)
let bw=true;
try{bw=localStorage.getItem('life.color')!=='1'}catch(_){}
const bwBtn=document.getElementById('bwBtn');
function drawBw(){bwBtn.classList.toggle('on',bw);bwBtn.setAttribute('aria-pressed',bw);document.body.classList.toggle('bw',bw);dirty=true}
bwBtn.onclick=()=>{bw=!bw;try{localStorage.setItem('life.color',bw?'0':'1')}catch(_){}drawBw()};
document.getElementById('clrBtn').onclick=()=>{clearAll();running=true;drawPlay()};
document.getElementById('moreBtn').onclick=()=>{zoom++;resize()};
document.getElementById('lessBtn').onclick=()=>{zoom--;resize()};
addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='=')document.getElementById('moreBtn').onclick();
  else if(e.key==='-')document.getElementById('lessBtn').onclick();
  if(e.code==='Space'){e.preventDefault();playBtn.onclick()}
  else if(e.code==='ArrowRight')document.getElementById('stepBtn').onclick();
  else if(e.key==='b')bwBtn.onclick();
  else if(e.key==='t')document.getElementById('toolBtn').onclick();
});

// ---------- Hint ----------
const hint=document.getElementById('hint');let hintT=0;
function showHint(s,ms){hint.textContent=s;hint.classList.remove('off');clearTimeout(hintT);if(ms)hintT=setTimeout(hideHint,ms)}
function hideHint(){hint.classList.add('off')}
showHint(T.hint,6000);

// ---------- Draw ----------
let dirty=true;const flashes=[];
const genChip=document.getElementById('genChip'),popChip=document.getElementById('popChip');
function draw(dt){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=bw?'#000':COL.bg;g.fillRect(0,0,W,H);
  // faint grid dots
  g.fillStyle=bw?'#1A1A1A':COL.line;
  if(cs>=8)for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++)g.fillRect(ox+x*cs-1,oy+y*cs-1,2,2);
  const pad=cs>=6?Math.max(1,Math.round(cs/10)):0,s=cs-pad*2;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const i=y*cols+x,px=ox+x*cs+pad,py=oy+y*cs+pad;
    if(grid[i]){
      const a=age[i];
      g.fillStyle=bw?'#fff':a<AGE.length?AGE[a]:OLD;
      g.fillRect(px,py,s,s);
      // pixel shine on the top-left like the other games' blocks
      if(cs>=8&&!bw){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(px,py,Math.max(1,s>>2),Math.max(1,s>>2))}
    }else if(ghost[i]&&!bw){g.fillStyle=COL.ghost[4-ghost[i]];g.fillRect(px,py,s,s)}
  }
  // stamp flash: a square ring that grows and fades
  for(let k=flashes.length-1;k>=0;k--){const f=flashes[k];f.t+=dt;
    if(f.t>.4){flashes.splice(k,1);continue}
    const r=(1.5+f.t*12)*cs;g.strokeStyle=`rgba(255,210,63,${1-f.t/.4})`;g.lineWidth=3;
    g.strokeRect(ox+(f.x+.5)*cs-r,oy+(f.y+.5)*cs-r,r*2,r*2)}
  pop=count();
  genChip.textContent='GEN '+gen;
  popChip.textContent=pop?String(pop):T.dead;
  popChip.classList.toggle('dead',!pop&&gen>0);
}

// ---------- Loop ----------
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(running){acc+=dt;const st=1/SPEEDS[speedI];while(acc>=st){step();acc-=st}}else acc=0;
  draw(dt);
  requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();randomize();drawPlay();drawTool();drawBw();
requestAnimationFrame(loop);
</script>
</body>
</html>
