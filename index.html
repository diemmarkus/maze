<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFD93B">
<title>Irrgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-screen comic panel — inked HUD strip on top, the hedge maze on a lawn fills the rest. */
:root{
  --paper:#FFD93B;      /* comic yellow */
  --dot:#F2A81D;        /* halftone dots */
  --ink:#16120F;        /* outlines */
  --lawn:#6CC24A;       /* lawn around the maze */
  --hedge:#2E9A4B;      /* bushes */
  --leaf:#8FDB6A;       /* bush highlights / grass */
  --path:#F4D9A0;       /* gravel paths */
  --pop:#E8322E;        /* ball / flag / danger */
  --soda:#7FE3F0;
  --white:#FFFDF6;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --hand:"Kalam","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
html{background:linear-gradient(to bottom,var(--paper) 50%,var(--lawn) 50%)}
body{background:var(--paper);color:var(--ink);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.hud{display:flex;align-items:center;gap:12px;font-family:var(--display);letter-spacing:.04em}
.chip{background:var(--white);border:3px solid var(--ink);border-radius:6px;padding:2px 10px;font-size:20px;box-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvlbtn{font-family:var(--display);letter-spacing:.04em;color:var(--ink);cursor:pointer;line-height:inherit}
.lvlbtn .caret{font-size:14px;vertical-align:2px}
.lvlbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lvlbtn:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.btn.alt{background:var(--white);font-size:20px;padding:6px 18px;box-shadow:3px 3px 0 var(--ink);margin-top:10px}
.restart{flex:none;width:40px;height:34px;display:grid;place-items:center;background:var(--leaf);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:0;cursor:pointer}
.restart svg{width:22px;height:22px;display:block}
.restart:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.restart:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meter span{font-size:13px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;background:var(--white);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.fill{height:100%;width:0;background:var(--hedge);background-image:radial-gradient(rgba(0,0,0,.2) 1.5px,transparent 2px);background-size:6px 6px}
.fill.danger{background-color:var(--pop);animation:blink .3s steps(2) infinite}
@keyframes blink{50%{background-color:var(--paper)}}
.stage{position:relative;flex:1;min-height:0;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));touch-action:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card{box-sizing:border-box;width:min(340px,100%);background:var(--white);border:4px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:18px 20px;text-align:center;transform:rotate(-1.5deg);max-height:100%;overflow-y:auto}
.card h1{font-family:var(--display);font-size:56px;line-height:.9;margin:0 0 6px;letter-spacing:.03em;color:var(--hedge);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
#overOv h1{color:var(--pop)}
.card p{margin:6px 0;font-size:16px;line-height:1.35}
.card ul{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:14px;line-height:1.25;display:grid;gap:3px}
.card li::before{content:"★ ";color:var(--pop)}
.btn{font-family:var(--display);font-size:28px;letter-spacing:.06em;background:var(--leaf);color:var(--ink);border:4px solid var(--ink);border-radius:10px;padding:8px 26px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;margin-top:8px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed var(--pop);outline-offset:4px}
.big{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--white);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:2px 10px;font-family:var(--display);letter-spacing:.05em;font-size:14px;white-space:nowrap;pointer-events:none}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.diffs button{font-family:var(--display);font-size:17px;letter-spacing:.02em;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:5px 2px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diffs button[aria-pressed="true"]{background:var(--paper);transform:translate(-1px,-1px) rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
.diffs button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.lvls{margin:6px 0 2px}
.lvls>span{display:block;font-family:var(--display);letter-spacing:.05em;font-size:14px;margin-bottom:4px}
.lvlrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-height:84px;overflow-y:auto;padding:2px 4px 4px 2px}
.lvlrow button{font-family:var(--display);font-size:17px;width:36px;height:32px;padding:0;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.lvlrow button[aria-pressed="true"]{background:var(--pop);color:var(--white)}
.lvlrow button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.langs button{font-family:var(--display);font-size:15px;letter-spacing:.06em;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--paper)}
.langs button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fill.danger{animation:none}}
</style>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{font-size:14px}</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <button type="button" class="chip lvlbtn" id="lvlBtn" aria-haspopup="dialog"><span id="lvl">LVL 1</span> <span aria-hidden="true" class="caret">▾</span></button>
    <div class="chip" id="score">0 PTS</div>
    <div class="meter"><span data-i18n="grow">OVERGROWN</span><div class="bar"><div class="fill" id="fill"></div></div></div>
    <button type="button" class="restart" id="restartBtn" aria-label="Restart" title="Restart" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M20.5 3.5v5.5H15z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hint" id="hint" hidden data-i18n="tilt">DRAG TO TILT</div>
    <div class="overlay" id="startOv">
      <div class="card">
        <h1 data-i18n="title">HEDGE MAZE!</h1>
        <p data-i18n="intro">The hedges are growing. Fast.</p>
        <ul id="rules"></ul>
        <div class="diffs" role="group" aria-label="Difficulty"></div>
        <div class="lvls" hidden><span data-i18n="from">START AT LEVEL</span><div class="lvlrow" role="group"></div></div>
        <button class="btn" id="startBtn" data-i18n="start">ROLL!</button>
        <div class="langs" id="langs" role="group" aria-label="Language"></div>
      </div>
    </div>
    <div class="overlay" id="lvlOv" hidden role="dialog" aria-modal="true" aria-labelledby="pickTitle">
      <div class="card">
        <h1 id="pickTitle" data-i18n="pick">PICK A LEVEL</h1>
        <div class="diffs" role="group" aria-label="Difficulty"></div>
        <div class="lvls always" hidden><span data-i18n="from">START AT LEVEL</span><div class="lvlrow" role="group"></div></div>
        <button class="btn" id="goBtn" data-i18n="go">GO!</button><br>
        <button class="btn alt" id="resumeBtn" data-i18n="resume">BACK TO GAME</button>
      </div>
    </div>
    <div class="overlay" id="overOv" hidden>
      <div class="card">
        <h1 id="overTitle" data-i18n="over">OVERGROWN!</h1>
        <p id="overText" data-i18n="stuck">The paths are shut.</p>
        <p class="big" id="final">0 PTS · LEVEL 1</p>
        <p id="best">Best: 0</p>
        <div class="diffs" role="group" aria-label="Difficulty"></div>
        <div class="lvls" hidden><span data-i18n="from">START AT LEVEL</span><div class="lvlrow" role="group"></div></div>
        <button class="btn" id="againBtn" data-i18n="again">AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement);
const V=n=>css.getPropertyValue(n).trim();
const C={paper:V('--paper'),dot:V('--dot'),ink:V('--ink'),lawn:V('--lawn'),hedge:V('--hedge'),leaf:V('--leaf'),path:V('--path'),pop:V('--pop'),white:V('--white'),soda:V('--soda')};

// All game geometry is in maze-cell units (1 = one corridor cell), so a resize only changes the pixel scale S.
const BALL_R=.2;            // ball radius
const HOLE_R=.3;            // hole radius
const T0=.14;               // hedge thickness at level start
const T_END=1-2*BALL_R;     // thickness at which corridors are exactly as wide as the ball: shut
const ACC=34;               // cells/s² at full tilt
const MAX_V=8.5;
const WASP_V=[1.8,2.2,2.6],WASP_WAKE=.6,WASP_CHASE=2.8,WASP_LEASH=2.0;   // wasp speed per difficulty (cells/s), take-off delay and chase time (s), how far from the nest they fly              // cells/s
const PAD=14;               // px around the maze

// ---------- i18n ----------
const NB=' ';
const I18N={
  en:{name:'EN',pick:'PICK A LEVEL',go:'GO!',resume:'BACK TO GAME',wasp:'Watch out for wasp nests: roll in and the wasps chase you for a bit. Get stung and the level is lost.',stungT:'STUNG!',stungP:'The wasps got you.',tele:'Roll into a teleporter and you pop out of its twin.',zap:'ZAP!',cater:'Caterpillars munch the hedges: roll over one and the bushes grow slower.',munch:'MUNCH!',from:'START AT LEVEL',title:'HEDGE MAZE!',intro:'The hedges are growing. Fast.',
    rules:['Tilt your phone to roll the ball.','Find the hole before the hedges close the paths.','The longer you take, the thicker the bushes get.','Hold the phone comfortably when you start: that counts as level.'],
    start:'ROLL!',over:'OVERGROWN!',stuck:'The paths are shut.',again:'AGAIN',restart:'Restart',grow:'OVERGROWN',tilt:'DRAG TO TILT (NO MOTION SENSOR)',
    pts:n=>n+' PTS',lvl:n=>'LVL '+n,final:(p,l)=>p+' · LEVEL '+l,best:n=>'Best: '+n+' pts',
    level:n=>'LEVEL '+n+'!',find:'FIND THE HOLE!',sink:['PLOP!','IN!','HOLE!'],diff:['EASY','MEDIUM','HARD'],shears:'Roll over the hedge shears to cut the bushes back.',snip:'SNIP!',hurry:'HURRY!',rustle:['RUSTLE!','SWISH!']},
  de:{name:'DE',pick:'LEVEL WÄHLEN',go:'LOS!',resume:'WEITERSPIELEN',wasp:'Vorsicht, Wespennest: fährst du hinein, jagen dich die Wespen ein Stück. Erwischen sie dich, ist das Level verloren.',stungT:'GESTOCHEN!',stungP:'Die Wespen haben dich erwischt.',tele:'Fällst du in einen Teleporter, kommst du beim anderen wieder heraus.',zap:'WUSCH!',cater:'Raupen fressen an den Hecken: fahr über eine, dann wächst alles langsamer.',munch:'MAMPF!',from:'STARTEN BEI LEVEL',title:'IRRGARTEN!',intro:'Die Hecken wachsen. Schnell.',
    rules:['Kipp das Handy, um die Kugel zu rollen.','Finde das Loch, bevor die Hecken die Wege zumachen.','Je länger du brauchst, desto dicker werden die Büsche.','Halt das Handy beim Start bequem – so gilt es als waagrecht.'],
    start:'LOSROLLEN!',over:'ZUGEWACHSEN!',stuck:'Die Wege sind zu.',again:'NOCHMAL',restart:'Neu starten',grow:'ZUGEWACHSEN',tilt:'ZIEHEN ZUM KIPPEN (KEIN SENSOR)',
    pts:n=>n+' PKT',lvl:n=>'LVL '+n,final:(p,l)=>p+' · LEVEL '+l,best:n=>'Rekord: '+n+' Punkte',
    level:n=>'LEVEL '+n+'!',find:'FINDE DAS LOCH!',sink:['PLOPP!','DRIN!','LOCH!'],diff:['LEICHT','MITTEL','SCHWER'],shears:'Fahr über die Heckenschere – dann werden die Büsche zurückgeschnitten.',snip:'SCHNIPP!',hurry:'SCHNELL!',rustle:['RASCHEL!','KNISTER!']},
  fr:{name:'FR',pick:'CHOISIS UN NIVEAU',go:'ALLEZ'+NB+'!',resume:'REPRENDRE',wasp:'Attention aux nids de guêpes'+NB+': elles te poursuivent un moment. Piqué, le niveau est perdu.',stungT:'PIQUÉ'+NB+'!',stungP:'Les guêpes t\u2019ont eu.',tele:'Entre dans un téléporteur et tu ressors par son jumeau.',zap:'ZIOU'+NB+'!',cater:'Les chenilles grignotent les haies'+NB+': passe sur l\u2019une d\u2019elles et les buissons poussent moins vite.',munch:'MIAM'+NB+'!',from:'COMMENCER AU NIVEAU',title:'LABYRINTHE'+NB+'!',intro:'Les haies poussent. Vite.',
    rules:['Incline le téléphone pour faire rouler la bille.','Trouve le trou avant que les haies ne bouchent les chemins.','Plus tu traînes, plus les buissons grossissent.','Tiens le téléphone confortablement au départ'+NB+': ce sera l’horizontale.'],
    start:'ROULE'+NB+'!',over:'ENVAHI'+NB+'!',stuck:'Les chemins sont bouchés.',again:'ENCORE',restart:'Recommencer',grow:'ENVAHI',tilt:'GLISSE POUR INCLINER (PAS DE CAPTEUR)',
    pts:n=>n+' PTS',lvl:n=>'NIV. '+n,final:(p,l)=>p+' · NIVEAU '+l,best:n=>'Record'+NB+': '+n+' pts',
    level:n=>'NIVEAU '+n+NB+'!',find:'TROUVE LE TROU'+NB+'!',sink:['PLOP'+NB+'!','DEDANS'+NB+'!'],diff:['FACILE','MOYEN','DIFFICILE'],shears:'Passe sur le taille-haie pour tailler les buissons.',snip:'CLAC'+NB+'!',hurry:'VITE'+NB+'!',rustle:['FROUFROU'+NB+'!','FRRR'+NB+'!']},
  es:{name:'ES',pick:'ELIGE NIVEL',go:'¡VAMOS!',resume:'SEGUIR',wasp:'Cuidado con los avisperos: las avispas te persiguen un rato. Si te pican, pierdes el nivel.',stungT:'¡PICADO!',stungP:'Las avispas te pillaron.',tele:'Entra en un teletransportador y saldrás por el otro.',zap:'¡ZAS!',cater:'Las orugas se comen los setos: pasa por una y los arbustos crecen más despacio.',munch:'¡ÑAM!',from:'EMPEZAR EN EL NIVEL',title:'¡LABERINTO!',intro:'Los setos crecen. Rápido.',
    rules:['Inclina el móvil para rodar la bola.','Encuentra el hoyo antes de que los setos cierren los caminos.','Cuanto más tardes, más crecen los arbustos.','Sujeta el móvil cómodo al empezar: esa será la posición recta.'],
    start:'¡RUEDA!',over:'¡INVADIDO!',stuck:'Los caminos están cerrados.',again:'OTRA VEZ',restart:'Reiniciar',grow:'INVADIDO',tilt:'ARRASTRA PARA INCLINAR (SIN SENSOR)',
    pts:n=>n+' PTS',lvl:n=>'NIV. '+n,final:(p,l)=>p+' · NIVEL '+l,best:n=>'Récord: '+n+' pts',
    level:n=>'¡NIVEL '+n+'!',find:'¡ENCUENTRA EL HOYO!',sink:['¡PLOP!','¡DENTRO!'],diff:['FÁCIL','MEDIO','DIFÍCIL'],shears:'Pasa por las tijeras de podar para recortar los setos.',snip:'¡CHAS!',hurry:'¡RÁPIDO!',rustle:['¡FRUFRÚ!','¡SHHH!']},
  it:{name:'IT',pick:'SCEGLI IL LIVELLO',go:'VIA!',resume:'RIPRENDI',wasp:'Attento ai nidi di vespe: ti inseguono per un tratto. Se ti pungono, perdi il livello.',stungT:'PUNTO!',stungP:'Le vespe ti hanno preso.',tele:'Entra in un teletrasporto e riesci dall\u2019altro.',zap:'ZAP!',cater:'I bruchi mangiano le siepi: passaci sopra e i cespugli crescono più piano.',munch:'GNAM!',from:'INIZIA DAL LIVELLO',title:'LABIRINTO!',intro:'Le siepi crescono. Svelto.',
    rules:['Inclina il telefono per far rotolare la pallina.','Trova la buca prima che le siepi chiudano i sentieri.','Più ci metti, più i cespugli si ingrossano.','Tieni il telefono comodo alla partenza: quello conta come dritto.'],
    start:'ROTOLA!',over:'INVASO!',stuck:'I sentieri sono chiusi.',again:'ANCORA',restart:'Ricomincia',grow:'INVASO',tilt:'TRASCINA PER INCLINARE (NESSUN SENSORE)',
    pts:n=>n+' PT',lvl:n=>'LIV. '+n,final:(p,l)=>p+' · LIVELLO '+l,best:n=>'Record: '+n+' pt',
    level:n=>'LIVELLO '+n+'!',find:'TROVA LA BUCA!',sink:['PLOP!','DENTRO!'],diff:['FACILE','MEDIO','DIFFICILE'],shears:'Passa sulle cesoie per potare i cespugli.',snip:'ZAC!',hurry:'SVELTO!',rustle:['FRUSC!','SHHH!']},
  pt:{name:'PT',pick:'ESCOLHA O NÍVEL',go:'VAI!',resume:'CONTINUAR',wasp:'Cuidado com os vespeiros: as vespas te perseguem um pouco. Se te picarem, perde o nível.',stungT:'PICADO!',stungP:'As vespas te pegaram.',tele:'Entre num teletransporte e saia pelo outro.',zap:'ZÁS!',cater:'As lagartas comem as sebes: passe por uma e os arbustos crescem mais devagar.',munch:'NHAC!',from:'COMEÇAR NO NÍVEL',title:'LABIRINTO!',intro:'As sebes estão crescendo. Rápido.',
    rules:['Incline o celular para rolar a bola.','Ache o buraco antes que as sebes fechem os caminhos.','Quanto mais demorar, mais grossos ficam os arbustos.','Segure o celular confortável ao começar: isso conta como reto.'],
    start:'ROLA!',over:'TOMADO!',stuck:'Os caminhos fecharam.',again:'DE NOVO',restart:'Reiniciar',grow:'TOMADO',tilt:'ARRASTE PARA INCLINAR (SEM SENSOR)',
    pts:n=>n+' PTS',lvl:n=>'NÍV. '+n,final:(p,l)=>p+' · NÍVEL '+l,best:n=>'Recorde: '+n+' pts',
    level:n=>'NÍVEL '+n+'!',find:'ACHE O BURACO!',sink:['PLOP!','DENTRO!'],diff:['FÁCIL','MÉDIO','DIFÍCIL'],shears:'Passe pela tesoura de poda para aparar as sebes.',snip:'TEC!',hurry:'RÁPIDO!',rustle:['FRUFRU!','SHHH!']},
};
function pickLang(){
  const want=[];
  try{const q=new URLSearchParams(location.search).get('lang');if(q)want.push(q)}catch(_){}
  try{const s=localStorage.getItem('irrgarten.lang');if(s)want.push(s)}catch(_){}
  want.push(...(navigator.languages||[navigator.language||'']));
  for(const w of want){const k=String(w).toLowerCase().slice(0,2);if(I18N[k])return k}
  return 'en';
}
let lang=pickLang(),T=I18N[lang],lastResult=null;
function applyLang(k,save){
  lang=k;T=I18N[k];document.documentElement.lang=k;
  if(save)try{localStorage.setItem('irrgarten.lang',k)}catch(_){}
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T[el.dataset.i18n]});
  $('restartBtn').setAttribute('aria-label',T.restart);$('restartBtn').title=T.restart;
  $('rules').replaceChildren(...[...T.rules.slice(0,3),T.shears,T.cater,T.tele,T.wasp,...T.rules.slice(3)].map(r=>{const li=document.createElement('li');li.textContent=r;return li}));
  $('langs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===k));
  paintDiffs();
  if(lastResult)showResult();
  hudCache='';fitTitles();
}
function fitTitles(){
  document.querySelectorAll('.card h1').forEach(h=>{
    h.style.fontSize='';const ov=h.closest('.overlay');const hid=ov.hidden;ov.hidden=false;
    let fs=parseFloat(getComputedStyle(h).fontSize);
    while(h.scrollWidth>h.clientWidth+1&&fs>24){fs-=2;h.style.fontSize=fs+'px'}
    ov.hidden=hid;
  });
}
addEventListener('resize',()=>fitTitles());
document.fonts&&document.fonts.ready.then(()=>{fitTitles();hedgeDirty=true});
for(const k of Object.keys(I18N)){
  const b=document.createElement('button');b.type='button';b.dataset.lang=k;b.textContent=I18N[k].name;b.lang=k;
  b.addEventListener('click',()=>applyLang(k,true));$('langs').append(b);
}

// ---------- difficulty ----------
// How much longer the hedges take to close, relative to "hard" (the original speed).
const DIFFS=[{k:'easy',mul:2.2},{k:'medium',mul:1.5},{k:'hard',mul:1}];
let diff=1;
try{const d=+localStorage.getItem('irrgarten.diff');if(d>=0&&d<3)diff=d}catch(_){}
function paintDiffs(){
  document.querySelectorAll('.diffs').forEach(g=>{
    if(!g.children.length)DIFFS.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.dataset.i=i;

// ---------- maze ----------
// Recursive backtracker: a perfect maze (exactly one route between any two cells).
// h[r*cols+c] = wall on top of cell (c,r), r in 0..rows; v[r*(cols+1)+c] = wall left of cell (c,r), c in 0..cols.
function genMaze(cols,rows){
  const h=new Uint8Array((rows+1)*cols).fill(1),v=new Uint8Array(rows*(cols+1)).fill(1),seen=new Uint8Array(cols*rows);
  const stack=[[0,0]];seen[0]=1;
  while(stack.length){
    const[c,r]=stack[stack.length-1],nb=[];
    if(r>0&&!seen[(r-1)*cols+c])nb.push([c,r-1,0]);
    if(r<rows-1&&!seen[(r+1)*cols+c])nb.push([c,r+1,1]);
    if(c>0&&!seen[r*cols+c-1])nb.push([c-1,r,2]);
    if(c<cols-1&&!seen[r*cols+c+1])nb.push([c+1,r,3]);
    if(!nb.length){stack.pop();continue}
    const[nc,nr,d]=nb[Math.random()*nb.length|0];
    if(d===0)h[r*cols+c]=0;else if(d===1)h[(r+1)*cols+c]=0;else if(d===2)v[r*(cols+1)+c]=0;else v[r*(cols+1)+c+1]=0;
    seen[nr*cols+nc]=1;stack.push([nc,nr]);
  }
  // merge wall runs into long segments: fewer capsules to collide with and to draw
  const segs=[];
  for(let r=0;r<=rows;r++){let s=-1;for(let c=0;c<=cols;c++){const on=c<cols&&h[r*cols+c];if(on&&s<0)s=c;if(!on&&s>=0){segs.push({x1:s,y1:r,x2:c,y2:r});s=-1}}}
  for(let c=0;c<=cols;c++){let s=-1;for(let r=0;r<=rows;r++){const on=r<rows&&v[r*(cols+1)+c];if(on&&s<0)s=r;if(!on&&s>=0){segs.push({x1:c,y1:s,x2:c,y2:r});s=-1}}}
  // bushes: round blobs strung along every wall, each with its own size, highlight, flower or grass tuft
  const blobs=[],FL=[C.pop,C.white,C.paper,'#F59AC2'];
  for(const s of segs){
    const L=Math.hypot(s.x2-s.x1,s.y2-s.y1),n=Math.max(1,Math.round(L*4.5)),nx=(s.y2-s.y1)/L,ny=-(s.x2-s.x1)/L;
    for(let i=0;i<=n;i++){
      const t=i/n;
      blobs.push({x:s.x1+(s.x2-s.x1)*t,y:s.y1+(s.y2-s.y1)*t,nx,ny,o:(Math.random()-.5)*.45,k:.92+Math.random()*.32,
        hl:Math.random()<.7,fl:Math.random()<.13?FL[Math.random()*FL.length|0]:null,fa:Math.random()*7,
        gr:Math.random()<.4?(Math.random()<.5?1:-1):0,ga:(Math.random()-.5)*.9});
    }
  }
  return{cols,rows,h,v,segs,blobs};
}
function open(m,c,r,d){ // can you walk from cell (c,r) in direction d?
  if(d===0)return r>0&&!m.h[r*m.cols+c];
  if(d===1)return r<m.rows-1&&!m.h[(r+1)*m.cols+c];
  if(d===2)return c>0&&!m.v[r*(m.cols+1)+c];
  return c<m.cols-1&&!m.v[r*(m.cols+1)+c+1];
}
function bfs(m,sc,sr){
  const dist=new Int16Array(m.cols*m.rows).fill(-1),q=[[sc,sr]];dist[sr*m.cols+sc]=0;
  const D=[[0,-1],[0,1],[-1,0],[1,0]];
  while(q.length){const[c,r]=q.shift();for(let d=0;d<4;d++)if(open(m,c,r,d)){const nc=c+D[d][0],nr=r+D[d][1],i=nr*m.cols+nc;if(dist[i]<0){dist[i]=dist[r*m.cols+c]+1;q.push([nc,nr])}}}
  return dist;
}

// ---------- state ----------
let menuOpen=false,st=null,sensor=false,last=performance.now(),paused=false;
let gdev={x:0,y:0},cal=null,needCal=true;
const joy={on:false,x:0,y:0,ox:0,oy:0,px:0,py:0},keys={};
const colsFor=l=>Math.min(12,4+l);
const secPerStep=l=>Math.max(.42,.95-.05*(l-1));
function fresh(){return{mode:'play',level:1,score:0,parts:[],banner:null,diff}}
let bag=[],tbag=[],wbag=[];
function newLevel(l){
  st.level=l;if(st.mode!=='start')setReached(l);
  const cols=colsFor(l),aspect=W>0?(H-2*PAD)/(W-2*PAD):1.6;
  const rows=Math.max(cols,Math.min(20,Math.round(cols*aspect)));
  const m=genMaze(cols,rows);
  // start in a random corner, hole in the cell farthest away along the paths
  const corners=[[0,0],[cols-1,0],[0,rows-1],[cols-1,rows-1]],[sc,sr]=corners[Math.random()*4|0];
  const dist=bfs(m,sc,sr);let best=0;for(let i=1;i<dist.length;i++)if(dist[i]>dist[best])best=i;
  st.maze=m;st.hole={x:best%cols+.5,y:(best/cols|0)+.5};
  st.ball={x:sc+.5,y:sr+.5,vx:0,vy:0,ru:0,rv:0,scale:1};
  // power-ups always sit in a dead end (a detour you have to choose), preferably in the middle part of the route
  const maxd=dist[best],deadEnds=[];

    if(i===best||dist[i]===0)continue;
    const c=i%cols,r=i/cols|0;let exits=0;for(let d=0;d<4;d++)if(open(m,c,r,d))exits++;
    if(exits===1)deadEnds.push({x:c+.5,y:r+.5,w:dist[i]>=maxd*.25&&dist[i]<=maxd*.8?4:1});
  }
  const cand=deadEnds;
  const take=n=>{const out=[];for(;n>0&&cand.length;n--){
    let tot=cand.reduce((a,c)=>a+c.w,0),pick=Math.random()*tot,i=0;
    while(i<cand.length-1&&pick>cand[i].w){pick-=cand[i].w;i++}
    out.push({x:cand[i].x,y:cand[i].y,taken:false,ph:Math.random()*7});cand.splice(i,1);
  }return out};
  // power-ups take turns: each run of three levels has one with shears, one with a caterpillar and one with nothing, shuffled
  if(!bag.length)bag=['shears','cater','none'].sort(()=>Math.random()-.5);
  const kind=bag.pop(),many=1;
  st.shears=take(kind==='shears'?many:0);
  st.caters=take(kind==='cater'?many:0);
  st.munchers=[];st.rate=1;
  // wasp nest, every other level from level 3 (shuffled), somewhere along the middle of the maze
  st.nest=null;st.wasps=[];
  if(l>=3){
    if(!wbag.length)wbag=[true,false].sort(()=>Math.random()-.5);
    if(wbag.pop()){
      const used=new Set([...st.shears,...st.caters].map(o=>(o.x|0)+','+(o.y|0)));
      const C2=[];for(let i=0;i<dist.length;i++){if(i===best||dist[i]<Math.max(3,maxd*.25)||dist[i]>maxd*.85)continue;if(!used.has((i%cols)+','+(i/cols|0)))C2.push(i)}
      if(C2.length){const i=C2[Math.random()*C2.length|0];st.nest={x:i%cols+.5,y:(i/cols|0)+.5,cool:0}}
    }
  }
  // teleporter pair, every other level from level 2 (shuffled): one end in the first half of the route, the other far away from it
  st.tele=null;st.tpLock=-1;
  // at most 2 extras per level (power-up, wasp nest, teleporter)
  const extras=st.shears.length+st.caters.length+(st.nest?1:0);
  if(l>=2&&extras<2){
    if(!tbag.length)tbag=[true,false].sort(()=>Math.random()-.5);
    if(tbag.pop()){
      const used=new Set([...st.shears,...st.caters,...(st.nest?[st.nest]:[])].map(o=>(o.x|0)+','+(o.y|0)));used.add(sc+','+sr);used.add((best%cols)+','+(best/cols|0));
      const free=i=>!used.has((i%cols)+','+(i/cols|0));
      const A=[];for(let i=0;i<dist.length;i++)if(free(i)&&dist[i]>=maxd*.15&&dist[i]<=maxd*.5)A.push(i);
      if(A.length){
        const a=A[Math.random()*A.length|0],da=bfs(m,a%cols,a/cols|0);let far=0;for(const v of da)far=Math.max(far,v);
        const B=[];for(let i=0;i<da.length;i++)if(free(i)&&i!==a&&da[i]>=far*.45)B.push(i);
        if(B.length){const b2=B[Math.random()*B.length|0];
          st.tele=[{x:a%cols+.5,y:(a/cols|0)+.5},{x:b2%cols+.5,y:(b2/cols|0)+.5}]}
      }
    }
  }
  st.levelT=0;st.dur=(6+dist[best]*secPerStep(l))*DIFFS[st.diff].mul;st.cutPending=0;st.p=0;st.t=T0;st.hurried=false;st.sunk=false;st.rustleCD=0;
  st.banner={text:T.level(l),sub:T.find,t:1.8,max:1.8};
  layout();hedgeDirty=true;
}

// ---------- input ----------
// Gravity in the screen plane, calibrated to how the phone was held when the round started,
// then rotated by the screen orientation.
function onOri(e){
  if(e.gamma==null||e.beta==null)return;
  if(!sensor){sensor=true;$('hint').hidden=true;layout();hedgeDirty=true}
  const R=Math.PI/180,b=e.beta*R,g=e.gamma*R;
  // gravity in device coordinates (x right, y toward the top edge, z out of the screen)
  let v=[Math.cos(b)*Math.sin(g),-Math.sin(b),-Math.cos(b)*Math.cos(g)];
  // calibration: the rotation that turns the start pose into "flat". Rotating the full 3D vector
  // (instead of subtracting) keeps all four tilt directions equally strong, whatever angle you hold the phone at.
  if(needCal||!cal){cal=v;needCal=false}
  const a=cal,c=-a[2];                       // a·(0,0,-1)
  if(c>-.95){
    const w=[-a[1],a[0],0],k=1/(1+c);        // w = a × (0,0,-1)
    const cr=[w[1]*v[2]-w[2]*v[1],w[2]*v[0]-w[0]*v[2],w[0]*v[1]-w[1]*v[0]];
    const cc=[w[1]*cr[2]-w[2]*cr[1],w[2]*cr[0]-w[0]*cr[2],w[0]*cr[1]-w[1]*cr[0]];
    v=[v[0]+cr[0]+cc[0]*k,v[1]+cr[1]+cc[1]*k,v[2]+cr[2]+cc[2]*k];
  }
  const dx=v[0],dy=-v[1];                    // screen: y points down
  const o=((screen.orientation&&screen.orientation.angle)??window.orientation??0)*R;
  gdev={x:dx*Math.cos(o)+dy*Math.sin(o),y:-dx*Math.sin(o)+dy*Math.cos(o)};
}
addEventListener('deviceorientation',onOri);
function gravity(){
  let x,y;
  if(sensor){x=gdev.x;y=gdev.y}
  else{
    const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
    x=joy.x*.5+kx*.4;y=joy.y*.5+ky*.4;
  }
  const L=Math.hypot(x,y);
  if(L<.03)return{x:0,y:0};
  if(L>.6){x*=.6/L;y*=.6/L}
  return{x,y};
}
const stage=$('stage');
function local(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
stage.addEventListener('pointerdown',e=>{
  if(sensor||!st||st.mode!=='play'||menuOpen||e.target.closest('.overlay'))return;
  const[x,y]=local(e);joy.on=true;joy.ox=joy.px=x;joy.oy=joy.py=y;joy.x=joy.y=0;
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
  if(!joy.on)return;const[x,y]=local(e);
  let dx=(x-joy.ox)/60,dy=(y-joy.oy)/60;const L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}
  joy.x=dx;joy.y=dy;joy.px=joy.ox+dx*60;joy.py=joy.oy+dy*60;
});
const joyOff=()=>{joy.on=false;joy.x=joy.y=0};
stage.addEventListener('pointerup',joyOff);stage.addEventListener('pointercancel',joyOff);
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(/^Arrow|^[wasd]$/.test(k)){keys[k]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joyOff()});

// ---------- update ----------
function popText(x,y,text,col){st.parts.push({type:'pop',x,y,t:0,life:.7,rot:(Math.random()-.5)*.5,text,col})}
function leaves(x,y,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*7,v=(.6+Math.random())*spd;
    st.parts.push({type:'leaf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.6,rot:Math.random()*7,vr:(Math.random()-.5)*12,t:0,life:.6+Math.random()*.4})}
}
function collide(b){
  const hr=st.t/2,R=BALL_R+hr;
  for(let it=0;it<3;it++){
    for(const s of st.maze.segs){
      if(b.x<Math.min(s.x1,s.x2)-R||b.x>Math.max(s.x1,s.x2)+R||b.y<Math.min(s.y1,s.y2)-R||b.y>Math.max(s.y1,s.y2)+R)continue;
      const sx=s.x2-s.x1,sy=s.y2-s.y1,L2=sx*sx+sy*sy;
      const u=Math.max(0,Math.min(1,((b.x-s.x1)*sx+(b.y-s.y1)*sy)/L2));
      const qx=s.x1+sx*u,qy=s.y1+sy*u,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
      if(d2>=R*R||d2<1e-10)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=qx+nx*R;b.y=qy+ny*R;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){
        if(-vn>2.2&&st.rustleCD<=0){
          st.rustleCD=.35;leaves(qx+nx*hr,qy+ny*hr,4,1.4);
          if(-vn>4)popText(qx+nx*hr,qy+ny*hr,T.rustle[Math.random()*T.rustle.length|0],C.leaf);
        }
        b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny;     // a soft bounce off the leaves
      }
    }

}
function update(dt){
  if(!st)return;
  for(const p of st.parts){p.t+=dt;if(p.type==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt}if(p.type==='leaf'){p.vy+=3*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  st.parts=st.parts.filter(p=>p.t<p.life);
  if(st.banner){st.banner.t-=dt;if(st.banner.t<=0)st.banner=null}
  if(!st.maze)return;
  const b=st.ball;
  if(st.mode==='play'){
    st.levelT+=dt*st.rate;
    if(st.cutPending>0){const c=Math.min(st.cutPending,dt*Math.max(3,st.cutPending*4));st.levelT=Math.max(0,st.levelT-c);st.cutPending-=c}
    st.p=Math.min(1,st.levelT/st.dur);
    if(st.p<.7)st.hurried=false;
    st.t=T0+(T_END-T0)*Math.pow(st.p,1.25);
    if(st.p>=.8&&!st.hurried){st.hurried=true;st.banner={text:T.hurry,t:1.1,max:1.1}}
    st.rustleCD-=dt;
    const g=gravity();
    let ax=g.x*ACC,ay=g.y*ACC;
    const hx=st.hole.x-b.x,hy=st.hole.y-b.y,hd=Math.hypot(hx,hy);
    if(hd<HOLE_R){ax+=hx*60;ay+=hy*60}   // the rim pulls the ball in
    b.vx+=ax*dt;b.vy+=ay*dt;
    const fr=Math.exp(-.9*dt);b.vx*=fr;b.vy*=fr;
    const sp=Math.hypot(b.vx,b.vy);if(sp>MAX_V){b.vx*=MAX_V/sp;b.vy*=MAX_V/sp}
    const n=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/.05));
    for(let i=0;i<n;i++){b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;collide(b)}
    b.ru+=b.vx*dt/BALL_R;b.rv+=b.vy*dt/BALL_R;
    for(const sh of st.shears){
      if(sh.taken||Math.hypot(sh.x-b.x,sh.y-b.y)>BALL_R+.25)continue;
      sh.taken=true;st.cutPending+=st.levelT*.6;   // cut the growth back by 60 %
      popText(sh.x,sh.y,T.snip,C.white);
      const bl=st.maze.blobs;for(let i=0;i<24;i++){const q=bl[Math.random()*bl.length|0];leaves(q.x,q.y,1,2)}
      leaves(sh.x,sh.y,10,2.2);
    }
    for(const ca of st.caters){
      if(ca.taken||Math.hypot(ca.x-b.x,ca.y-b.y)>BALL_R+.25)continue;
      ca.taken=true;st.rate=Math.max(.35,st.rate*.65);   // every caterpillar: hedges grow 35 % slower from now on
      popText(ca.x,ca.y,T.munch,C.white);
      // it bursts into a swarm of tiny caterpillars that crawl off into the hedges all over the maze and munch there
      const bl=st.maze.blobs,n=Math.min(28,Math.max(16,bl.length/8|0)),step=bl.length/n;
      for(let k=0;k<n;k++){const q=bl[(k*step+Math.random()*step)|0]||bl[0];
        const jx=(Math.random()-.5)*st.t*.6,jy=(Math.random()-.5)*st.t*.6;
        st.munchers.push({x:ca.x,y:ca.y,tx:q.x+jx,ty:q.y+jy,ph:Math.random()*7,delay:k*.03,spd:1.5+Math.random()*1.5,sz:.3+Math.random()*.12})}
    }
    if(st.tele){
      if(st.tpLock>=0&&Math.hypot(st.tele[st.tpLock].x-b.x,st.tele[st.tpLock].y-b.y)>.42)st.tpLock=-1;   // left the exit: armed again

        if(Math.hypot(a.x-b.x,a.y-b.y)<.2){
          popText(a.x,a.y,T.zap,C.white);b.x=o.x;b.y=o.y;st.tpLock=1-i;st.tpFlash=.35;
          for(const q of[a,o])for(let k=0;k<8;k++){const an=k/8*7;st.parts.push({type:'spark',x:q.x,y:q.y,vx:Math.cos(an)*2.4,vy:Math.sin(an)*2.4,t:0,life:.35})}
          break;
        }
      }
    }
    if(st.tpFlash>0)st.tpFlash-=dt;
    // wasps: roll into the nest and three of them chase you, but only for a while and not far from home
    const ne=st.nest;
    if(ne){
      if(ne.cool>0)ne.cool-=dt;
      const nd=Math.hypot(ne.x-b.x,ne.y-b.y);
      // rolling over the nest only stirs it up; the wasps come out once the ball has rolled off it
      if(!st.wasps.length&&ne.cool<=0&&nd<BALL_R+.22)ne.stirred=true;
      if(ne.stirred&&nd>BALL_R+.45){
        ne.stirred=false;popText(ne.x,ne.y,'BZZZ!',C.paper);
        for(let k=0;k<3;k++)st.wasps.push({x:ne.x,y:ne.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,t:0,ph:Math.random()*7,home:false});
      }
      for(const w of st.wasps){
        w.t+=dt;w.ph+=dt;
        if(w.t>WASP_CHASE)w.home=true;
        const tx=w.home?ne.x:b.x+Math.cos(w.ph*2.3)*.25,ty=w.home?ne.y:b.y+Math.sin(w.ph*2.9)*.25;
        let dx=tx-w.x,dy=ty-w.y;const d=Math.hypot(dx,dy)||1,spd=w.home?3:w.t<WASP_WAKE?.6:WASP_V[st.diff];
        w.vx+=(dx/d*spd-w.vx)*Math.min(1,dt*4);w.vy+=(dy/d*spd-w.vy)*Math.min(1,dt*4);
        w.x+=w.vx*dt;w.y+=w.vy*dt;
        const hx=w.x-ne.x,hy=w.y-ne.y,hd=Math.hypot(hx,hy);
        if(hd>WASP_LEASH){w.x=ne.x+hx/hd*WASP_LEASH;w.y=ne.y+hy/hd*WASP_LEASH}
        if(w.home&&hd<.15)w.gone=true;
        if(!w.home&&w.t>WASP_WAKE&&Math.hypot(w.x-b.x,w.y-b.y)<BALL_R+.1){
          popText(b.x,b.y,'AUA!',C.white);gameOver(true);return;
        }
      }
      if(st.wasps.length&&st.wasps.every(w=>w.gone)){st.wasps=[];ne.cool=1.5}
    }
    for(const mu of st.munchers){if(mu.delay>0){mu.delay-=dt;continue}mu.x+=(mu.tx-mu.x)*Math.min(1,dt*mu.spd);mu.y+=(mu.ty-mu.y)*Math.min(1,dt*mu.spd)}
    if(Math.hypot(st.hole.x-b.x,st.hole.y-b.y)<HOLE_R*.75){st.mode='sink';st.sinkT=0}
    else if(st.p>=1)gameOver();
  }else if(st.mode==='sink'){
    st.sinkT+=dt;const k=Math.min(1,st.sinkT/.35);
    b.x+=(st.hole.x-b.x)*Math.min(1,dt*16);b.y+=(st.hole.y-b.y)*Math.min(1,dt*16);b.scale=1-.7*k;
    if(k>=1&&!st.sunk){
      st.sunk=true;const left=Math.max(0,st.dur-st.levelT),gain=100*st.level+Math.round(left)*10;st.score+=gain;
      popText(st.hole.x,st.hole.y,T.sink[Math.random()*T.sink.length|0],C.white);
      st.parts.push({type:'gain',x:st.hole.x,y:st.hole.y,t:0,life:1.1,text:'+'+gain});
    }
    if(st.sinkT>1.3){newLevel(st.level+1);st.mode='play'}
  }else if(st.mode==='over'){
    if(!st.stung)st.t=Math.min(T_END+.12,st.t+dt*.15);   // keep closing in on the ball
  }
}

// ---------- draw ----------
function star(x,y,R,r,n){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2-Math.PI/2,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
function inkText(txt,x,y,size,fill,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px ${V('--display')}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.16;ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.fillText(txt,size*.06,size*.06);ctx.strokeText(txt,0,0);ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore();
}
// The hedges are drawn into an offscreen canvas and only redrawn when they have grown visibly.
function renderHedges(){
  const m=st.maze;hcv.width=cv.width;hcv.height=cv.height;
  const h=hctx;h.setTransform(dpr,0,0,dpr,0,0);h.clearRect(0,0,W,H);
  const R=st.t*S/2,ink=Math.max(2,Math.min(4,S*.06)),sh=Math.max(2,S*.07);
  const bx=b=>X(b.x)+b.nx*R*b.o,by=b=>Y(b.y)+b.ny*R*b.o;
  const body=(extra,fill,dx,dy)=>{
    h.lineCap='round';h.lineWidth=2*(R+extra);h.strokeStyle=fill;h.beginPath();
    for(const s of m.segs){h.moveTo(X(s.x1)+dx,Y(s.y1)+dy);h.lineTo(X(s.x2)+dx,Y(s.y2)+dy)}h.stroke();
    h.fillStyle=fill;h.beginPath();
    for(const b of m.blobs){const r=R*b.k+extra,x=bx(b)+dx,y=by(b)+dy;h.moveTo(x+r,y);h.arc(x,y,r,0,7)}h.fill();
  };
  // drop shadow on the gravel
  body(ink,'rgba(22,18,15,.3)',sh*.7,sh);
  // grass tufts sticking out of the bushes; drawn first so the bush outline covers their roots
  const blade=(x,y,a,len,lw,col)=>{h.strokeStyle=col;h.lineWidth=lw;h.lineCap='round';h.beginPath();h.moveTo(x,y);h.quadraticCurveTo(x+Math.cos(a)*len*.6+Math.cos(a+1.4)*len*.15,y+Math.sin(a)*len*.6+Math.sin(a+1.4)*len*.15,x+Math.cos(a)*len,y+Math.sin(a)*len);h.stroke()};
  for(const pass of[0,1])for(const b of m.blobs){
    if(!b.gr)continue;
    const base=Math.atan2(b.ny*b.gr,b.nx*b.gr)+b.ga,r=R*b.k,len=r*.7+S*.12;
    for(const da of[-.45,0,.45]){
      const a=base+da,x=bx(b)+Math.cos(a)*r*.6,y=by(b)+Math.sin(a)*r*.6,l=len*(da?0.8:1);
      if(pass===0)blade(x,y,a,l,ink*2.3,C.ink);else blade(x,y,a,l,ink*.9,C.leaf);
    }
  }
  body(ink,C.ink,0,0);
  body(0,hedgePat,0,0);
  // leafy highlights and little leaf marks
  h.fillStyle=C.leaf;h.beginPath();
  for(const b of m.blobs){if(!b.hl)continue;const r=R*b.k,x=bx(b)-r*.3,y=by(b)-r*.32,rr=r*.42;h.moveTo(x+rr,y);h.arc(x,y,rr,0,7)}h.fill();
  h.strokeStyle='rgba(10,50,20,.55)';h.lineWidth=Math.max(1,ink*.55);h.lineCap='round';h.beginPath();
  for(const b of m.blobs){if(b.hl||R<S*.12)continue;const r=R*b.k,x=bx(b)+r*.15,y=by(b)+r*.2;h.moveTo(x-r*.28,y-r*.12);h.quadraticCurveTo(x,y+r*.12,x+r*.28,y-r*.12)}h.stroke();
  // flowers open up as the bushes grow
  for(const b of m.blobs){
    if(!b.fl)continue;const r=R*b.k,fr=Math.min(S*.09,r*.32);if(fr<1.5)continue;
    const x=bx(b)+Math.cos(b.fa)*r*.45,y=by(b)+Math.sin(b.fa)*r*.45;
    h.fillStyle=b.fl;h.strokeStyle=C.ink;h.lineWidth=Math.max(1,ink*.45);
    for(let i=0;i<5;i++){const a=b.fa+i/5*Math.PI*2;h.beginPath();h.arc(x+Math.cos(a)*fr*.75,y+Math.sin(a)*fr*.75,fr*.55,0,7);h.fill();h.stroke()}
    h.beginPath();h.arc(x,y,fr*.4,0,7);h.fillStyle=b.fl===C.paper?C.pop:C.paper;h.fill();h.stroke();
  }
  drawnT=st.t;hedgeDirty=false;
}
function drawTele(){
  if(!st.tele)return;const now=performance.now()/1000,r=S*.34,lw=Math.max(2,S*.05);
  st.tele.forEach((q,i)=>{
    const x=X(q.x),y=Y(q.y),locked=i===st.tpLock;
    ctx.save();ctx.translate(x,y);
    ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle='#5B3FC4';ctx.fill();
    ctx.save();ctx.clip();ctx.rotate((i?-1:1)*now*3);
    for(let k=0;k<3;k++){ctx.rotate(Math.PI*2/3);ctx.beginPath();
      for(let t=0;t<=1.001;t+=.05){const rr=r*1.05*t,an=t*3.4;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}
      ctx.lineWidth=r*.28;ctx.lineCap='round';ctx.strokeStyle=k%2?C.soda:'#B9A6FF';ctx.stroke()}
    ctx.restore();
    ctx.beginPath();ctx.arc(0,0,r*.22,0,7);ctx.fillStyle=locked?C.white:C.ink;ctx.fill();
    ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.stroke();
    const pulse=r*(1.12+.08*Math.sin(now*5+i*3));
    ctx.beginPath();ctx.arc(0,0,pulse,0,7);ctx.setLineDash([S*.08,S*.07]);ctx.lineWidth=lw*.8;ctx.strokeStyle=C.soda;ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  });
}
function drawWasp(x,y,sz,ph,ang){
  const now=performance.now()/1000,lw=Math.max(1.2,sz*.035);
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const fl=Math.sin(now*60+ph)*.5+.5;
  ctx.fillStyle='rgba(255,253,246,.8)';ctx.strokeStyle=C.ink;ctx.lineWidth=lw;
  for(const sd of[-1,1]){ctx.beginPath();ctx.ellipse(-sz*.02,sd*sz*.13,sz*.13,sz*(.05+.05*fl),sd*.5,0,7);ctx.fill();ctx.stroke()}
  ctx.beginPath();ctx.ellipse(0,0,sz*.2,sz*.11,0,0,7);ctx.fillStyle=C.paper;ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle=C.ink;for(const sx of[-.1,0,.1].map(v=>v*sz))ctx.fillRect(sx-sz*.025,-sz,sz*.05,sz*2);ctx.restore();
  ctx.stroke();
  ctx.beginPath();ctx.moveTo(-sz*.2,0);ctx.lineTo(-sz*.28,0);ctx.stroke();
  ctx.beginPath();ctx.arc(sz*.2,0,sz*.07,0,7);ctx.fillStyle=C.ink;ctx.fill();
  ctx.restore();
}
function drawNest(){
  const ne=st.nest;if(!ne)return;const now=performance.now()/1000,x=X(ne.x),y=Y(ne.y),r=S*.3,lw=Math.max(2,S*.05);
  ctx.beginPath();ctx.ellipse(x+S*.05,y+S*.12,r*.9,r*.35,0,0,7);ctx.fillStyle='rgba(22,18,15,.25)';ctx.fill();
  const sh=ne.stirred?Math.sin(now*50)*S*.05:0;
  ctx.save();ctx.translate(x+sh,y+Math.sin(now*2)*S*.02);
  ctx.beginPath();ctx.ellipse(0,0,r*.85,r,0,0,7);ctx.fillStyle='#D9B98A';ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle='#A9875A';ctx.lineWidth=lw;
  for(let k=-3;k<=3;k++){ctx.beginPath();ctx.ellipse(0,k*r*.3,r,r*.12,0,0,Math.PI);ctx.stroke()}ctx.restore();
  ctx.beginPath();ctx.ellipse(0,0,r*.85,r,0,0,7);ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,r*.45,r*.22,r*.16,0,0,7);ctx.fillStyle=C.ink;ctx.fill();
  ctx.restore();
  if(!st.wasps.length&&ne.cool<=0){   // one guard circling the nest
    const a=now*2.2;drawWasp(x+Math.cos(a)*S*.42,y+Math.sin(a)*S*.3,S*.9,0,a+Math.PI/2);
  }
}
function drawHole(){
  const x=X(st.hole.x),y=Y(st.hole.y),r=HOLE_R*S;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=C.ink;ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  ctx.beginPath();ctx.arc(x+r*.25,y+r*.3,r*.95,0,7);ctx.fillStyle='#4a3a2a';ctx.fill();   // lit inner wall
  ctx.beginPath();ctx.arc(x+r*.08,y+r*.12,r*.78,0,7);ctx.fillStyle=C.ink;ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=Math.max(2.5,S*.06);ctx.strokeStyle=C.ink;ctx.stroke();
}
function drawFlag(){
  const x=X(st.hole.x),y=Y(st.hole.y),len=S*.95,tx=x+S*.12,ty=y-len,now=performance.now()/1000;
  const lw=Math.max(2,S*.05);
  ctx.lineCap='round';ctx.strokeStyle=C.ink;ctx.lineWidth=lw+3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.strokeStyle=C.white;ctx.lineWidth=lw;ctx.stroke();
  const fw=S*.55,fh=S*.32,wv=Math.sin(now*6)*S*.05;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+fw*.5,ty+wv,tx+fw,ty+fh*.5+wv*.5);ctx.quadraticCurveTo(tx+fw*.5,ty+fh*.5-wv,tx+lw*.2,ty+fh);ctx.closePath();
  ctx.fillStyle=C.pop;ctx.fill();ctx.lineWidth=Math.max(2,S*.045);ctx.lineJoin='round';ctx.strokeStyle=C.ink;ctx.stroke();
}
function drawShears(){
  const now=performance.now()/1000;
  for(const sh of st.shears){
    if(sh.taken)continue;
    const x=X(sh.x),y=Y(sh.y)+Math.sin(now*3+sh.ph)*S*.04,L=S*.44,w=S*.13,a=.22+.14*Math.max(0,Math.sin(now*7+sh.ph));
    const lw=Math.max(1.5,S*.04);
    ctx.save();ctx.translate(x,y);
    ctx.save();ctx.rotate(now*.8);star(0,0,S*.48,S*.32,9);ctx.fillStyle=C.paper;ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.lineJoin='round';ctx.stroke();ctx.restore();
    ctx.rotate(Math.sin(now*2+sh.ph)*.15);ctx.lineJoin='round';
    for(const sd of[-1,1]){
      ctx.save();ctx.rotate(sd*a);
      // blade up, handle loop down
      ctx.beginPath();ctx.moveTo(-sd*w*.55,w*.3);ctx.lineTo(-sd*w*.15,-L);ctx.lineTo(sd*w*.55,-L*.25);ctx.lineTo(sd*w*.45,w*.3);ctx.closePath();
      ctx.fillStyle='#DCE6EC';ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.stroke();
      ctx.beginPath();ctx.moveTo(-sd*w*.05,-L*.85);ctx.lineTo(sd*w*.25,-L*.3);ctx.strokeStyle=C.white;ctx.lineWidth=lw*.8;ctx.stroke();
      ctx.beginPath();ctx.ellipse(sd*w*.9,L*.55,w*.85,w*1.1,sd*.3,0,7);ctx.ellipse(sd*w*.9,L*.55,w*.4,w*.6,sd*.3,0,7,true);
      ctx.fillStyle=C.pop;ctx.fill('evenodd');ctx.strokeStyle=C.ink;ctx.lineWidth=lw;ctx.stroke();
      ctx.beginPath();ctx.moveTo(sd*w*.3,w*.2);ctx.lineTo(sd*w*.6,L*.2);ctx.lineWidth=w*.7;ctx.strokeStyle=C.ink;ctx.stroke();ctx.lineWidth=w*.35;ctx.strokeStyle=C.pop;ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(0,0,w*.32,0,7);ctx.fillStyle=C.paper;ctx.fill();ctx.lineWidth=lw*.8;ctx.strokeStyle=C.ink;ctx.stroke();
    ctx.restore();
  }
}
function caterpillar(x,y,sz,ph,munch){
  const now=performance.now()/1000,r=sz*.13,lw=Math.max(sz<S*.5?.8:1.3,sz*.05);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(ph)*.6);
  const seg=[];for(let i=0;i<5;i++){const wave=Math.sin(now*(munch?9:5)+ph-i*.9);seg.push([(i-2)*r*1.35+(munch?0:wave*r*.25),wave*r*.45-(i===0?r*.25:0)])}
  for(let i=4;i>=0;i--){const[sx,sy]=seg[i],rr=i===0?r*1.15:r;
    ctx.beginPath();ctx.arc(sx,sy,rr,0,7);ctx.fillStyle=i===0?'#F28C28':(i%2?'#C8E84A':'#A8D838');ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=C.ink;ctx.stroke();
    if(i){ctx.beginPath();ctx.arc(sx-rr*.2,sy-rr*.25,rr*.28,0,7);ctx.fillStyle='rgba(255,253,246,.7)';ctx.fill()}}
  const[hx,hy]=seg[0],hr=r*1.15;
  ctx.strokeStyle=C.ink;ctx.lineWidth=lw;ctx.lineCap='round';
  for(const sd of[-1,1]){ctx.beginPath();ctx.moveTo(hx-hr*.3,hy-hr*.8);ctx.lineTo(hx-hr*.9+sd*hr*.35,hy-hr*1.7);ctx.stroke();
    ctx.beginPath();ctx.arc(hx-hr*.9+sd*hr*.35,hy-hr*1.7,lw*1.1,0,7);ctx.fillStyle=C.ink;ctx.fill()}
  ctx.beginPath();ctx.arc(hx-hr*.35,hy-hr*.15,hr*.32,0,7);ctx.fillStyle=C.white;ctx.fill();ctx.lineWidth=lw*.7;ctx.stroke();
  ctx.beginPath();ctx.arc(hx-hr*.45,hy-hr*.15,hr*.14,0,7);ctx.fillStyle=C.ink;ctx.fill();
  const mo=munch?Math.abs(Math.sin(now*9+ph)):.3;
  ctx.beginPath();ctx.ellipse(hx-hr*.6,hy+hr*.4,hr*.22,hr*.1+hr*.2*mo,0,0,7);ctx.fillStyle=C.ink;ctx.fill();
  ctx.restore();
}
function drawCaters(){
  const now=performance.now()/1000;
  for(const ca of st.caters){if(ca.taken)continue;
    const x=X(ca.x)+Math.sin(now*.9+ca.ph)*S*.08,y=Y(ca.y);
    ctx.beginPath();ctx.ellipse(x+S*.03,y+S*.1,S*.3,S*.08,0,0,7);ctx.fillStyle='rgba(22,18,15,.2)';ctx.fill();
    caterpillar(x,y,S,ca.ph*0+Math.sin(now*.9+ca.ph)*.3,false)}
  for(const mu of st.munchers)if(!(mu.delay>0))caterpillar(X(mu.x),Y(mu.y),S*mu.sz,mu.ph,true);
}
function drawBall(){
  const b=st.ball,x=X(b.x),y=Y(b.y),r=BALL_R*S*b.scale;if(r<.5)return;
  if(st.mode!=='sink'){ctx.beginPath();ctx.ellipse(x+r*.3,y+r*.45,r*.95,r*.8,0,0,7);ctx.fillStyle='rgba(22,18,15,.3)';ctx.fill()}
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=C.pop;ctx.fill();ctx.clip();
  // white spots on the marble roll along with it
  for(const[ou,ov]of[[0,0],[Math.PI,Math.PI*.6]]){
    const u=b.ru+ou,v=b.rv+ov,cu=Math.cos(u),cvv=Math.cos(v);
    if(cu<=0||cvv<=0)continue;
    ctx.beginPath();ctx.ellipse(x+Math.sin(u)*r*.75,y+Math.sin(v)*r*.75,r*.32*cu,r*.32*cvv,0,0,7);ctx.fillStyle=C.white;ctx.fill();
  }
  ctx.beginPath();ctx.arc(x+r*.35,y+r*.4,r*.9,0,7);ctx.arc(x+r*1.6,y+r*1.6,r*2.2,0,7,true);ctx.fillStyle='rgba(22,18,15,.25)';ctx.fill('evenodd');
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=Math.max(2,S*.055)*Math.max(.4,b.scale);ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.beginPath();ctx.ellipse(x-r*.38,y-r*.4,r*.24,r*.16,-.7,0,7);ctx.fillStyle=C.white;ctx.fill();
}
function draw(){
  ctx.fillStyle=lawnPat;ctx.fillRect(0,0,W,H);
  if(!st||!st.maze)return;
  const m=st.maze,w=m.cols*S,hh=m.rows*S;
  ctx.fillStyle='rgba(22,18,15,.25)';ctx.fillRect(mx+5,my+7,w,hh);
  ctx.fillStyle=pathPat;ctx.fillRect(mx,my,w,hh);
  drawHole();drawTele();
  if(hedgeDirty||Math.abs(st.t-drawnT)*S>.5)renderHedges();
  // the bushes rustle when time is nearly up
  let jx=0,jy=0;
  if(st.mode==='play'&&st.p>.8){const a=(st.p-.8)*5*1.2;jx=(Math.random()-.5)*a;jy=(Math.random()-.5)*a}
  if(st.mode==='sink')drawBall();
  ctx.drawImage(hcv,jx,jy,W,H);
  drawShears();drawCaters();drawNest();
  if(st.mode!=='sink')drawBall();
  drawFlag();
  for(const w of st.wasps)if(!w.gone)drawWasp(X(w.x),Y(w.y),S*1.05,w.ph,Math.atan2(w.vy,w.vx));
  for(const p of st.parts){
    const k=p.t/p.life,py=Y(p.y);let px=X(p.x);
    if(p.type==='leaf'){
      ctx.save();ctx.translate(px,py);ctx.rotate(p.rot);ctx.globalAlpha=1-Math.max(0,k-.6)/.4;
      ctx.beginPath();ctx.ellipse(0,0,S*.09,S*.045,0,0,7);ctx.fillStyle=C.leaf;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=C.ink;ctx.stroke();ctx.restore();continue;
    }
    if(p.type==='spark'){ctx.strokeStyle=C.soda;ctx.lineWidth=3;ctx.lineCap='round';ctx.globalAlpha=1-k;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-p.vx*S*.06,py-p.vy*S*.06);ctx.stroke();ctx.globalAlpha=1;continue}
    if(p.type==='gain'){ctx.save();ctx.globalAlpha=1-Math.max(0,k-.7)/.3;inkText(p.text,px,py-S*.6-k*S*.8,Math.max(16,S*.5),C.paper,.05);ctx.restore();continue}
    const sc=Math.min(1,k*5)*(1-k*.3),R=Math.max(22,S*.8)*sc,yy=py-S*.4-k*S*.4;
    px=Math.max(R*1.3,Math.min(W-R*1.3,px));
    ctx.save();ctx.globalAlpha=1-Math.max(0,k-.7)/.3;
    star(px,yy,R,R*.62,10);ctx.fillStyle=p.col===C.white?C.paper:C.white;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.stroke();
    inkText(p.text,px,yy,R*.5+1,p.col===C.white?C.pop:C.hedge,p.rot);ctx.restore();
  }
  if(st.banner){
    const bn=st.banner,k=Math.min(1,(bn.max-bn.t)*6),sz=Math.min(54,W*.12);
    inkText(bn.text,W/2,H*.4,sz*k+1,bn.text===T.hurry?C.pop:C.paper,-.06);
    if(bn.sub)inkText(bn.sub,W/2+8,H*.4+sz*.85,sz*.5*k+1,C.white,.04);
  }
  if(joy.on){
    ctx.beginPath();ctx.arc(joy.ox,joy.oy,60,0,7);ctx.lineWidth=3;ctx.strokeStyle='rgba(22,18,15,.5)';ctx.stroke();
    ctx.beginPath();ctx.arc(joy.px,joy.py,18,0,7);ctx.fillStyle='rgba(255,253,246,.85)';ctx.fill();ctx.strokeStyle=C.ink;ctx.stroke();
  }
}

// ---------- HUD ----------
const lvlEl=$('lvl'),scoreEl=$('score'),fillEl=$('fill');let hudCache='';
function hud(){
  if(!st)return;const p=st.mode==='start'?0:st.mode==='over'?1:st.p||0;
  const s=st.level+'|'+st.score+'|'+Math.round(p*200);if(s===hudCache)return;hudCache=s;
  lvlEl.textContent=T.lvl(st.level);scoreEl.textContent=T.pts(st.score);
  fillEl.style.width=(p*100).toFixed(1)+'%';fillEl.classList.toggle('danger',p>=.8&&st.mode==='play');
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&!menuOpen)update(dt);draw();hud();requestAnimationFrame(loop);
}

async function begin(){
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r==='granted')addEventListener('deviceorientation',onOri)}}catch(_){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
  needCal=true;
  setTimeout(()=>{if(!sensor){$('hint').hidden=false;layout();hedgeDirty=true}},1200);
  st=fresh();bag=[];tbag=[];wbag=[];newLevel(startLvl||1);lastResult=null;$('startOv').hidden=true;$('overOv').hidden=true;$('lvlOv').hidden=true;menuOpen=false;$('restartBtn').hidden=false;
}
function showResult(){const r=lastResult;$('overTitle').textContent=r.stung?T.stungT:T.over;$('overText').textContent=r.stung?T.stungP:T.stuck;$('final').textContent=T.diff[r.diff]+' · '+T.final(T.pts(r.score),r.level);$('best').textContent=T.best(r.best)}
function gameOver(stung){
  st.mode='over';st.banner=null;st.stung=!!stung;if(!stung)leaves(st.ball.x,st.ball.y,14,2.5);
  let best=0;
  try{best=+localStorage.getItem(bestKey())||0;if(st.score>best){best=st.score;localStorage.setItem(bestKey(),best)}}catch(_){best=Math.max(best,st.score)}
  lastResult={score:st.score,level:st.level,best,diff:st.diff,stung:!!st.stung};showResult();startLvl=st.level;paintLevels();
  setTimeout(()=>{$('overOv').hidden=false;fitTitles();$('againBtn').focus()},900);
}
$('startBtn').addEventListener('click',begin);
function openMenu(){
  if(st&&st.mode==='play'&&st.maze)startLvl=st.level;
  menuOpen=true;joyOff();paintDiffs();
  $('resumeBtn').hidden=!(st&&(st.mode==='play'||st.mode==='sink'));
  $('lvlOv').hidden=false;fitTitles();$('goBtn').focus();
}
function closeMenu(){menuOpen=false;$('lvlOv').hidden=true;last=performance.now()}
$('lvlBtn').addEventListener('click',e=>{e.currentTarget.blur();$('lvlOv').hidden?openMenu():closeMenu()});
$('resumeBtn').addEventListener('click',closeMenu);
$('goBtn').addEventListener('click',()=>{closeMenu();begin()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lvlOv').hidden&&!$('resumeBtn').hidden)closeMenu()});
$('againBtn').addEventListener('click',begin);
$('restartBtn').addEventListener('click',e=>{e.currentTarget.blur();if(st&&st.maze&&st.mode!=='start')startLvl=st.level;begin()});

// idle backdrop behind the start card: a half-grown maze
st=fresh();st.mode='start';
applyLang(lang,false);
resize();newLevel(1);st.banner=null;st.t=T0+.12;
requestAnimationFrame(loop);
// test hook
window.__irr={get st(){return st},keys,get g(){return gdev},ori:onOri,recal(){needCal=true}};
})();
</script>
