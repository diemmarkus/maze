<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E5BD9">
<title>Jonas' Spiele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap">
<style>
/* Game picker: comic panel cards on the halftone yellow, same look as the games. */
:root{
  --paper:#8E5BD9;--dot:#7A45C7;--ink:#16120F;--lawn:#6CC24A;--hedge:#2E9A4B;--leaf:#8FDB6A;
  --path:#F4D9A0;--pop:#E8322E;--snow:#EAF6FF;--sky:#7FC8F0;--white:#FFFDF6;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --hand:"Kalam","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
html{background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--hand);
  background:var(--paper) radial-gradient(var(--dot) 1.6px,transparent 2px) 0 0/14px 14px;
  -webkit-tap-highlight-color:transparent}
main{box-sizing:border-box;max-width:460px;margin:0 auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-size:clamp(46px,14vw,68px);line-height:.9;letter-spacing:.03em;margin:4px 0 4px;text-align:center;
  color:var(--pop);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.sub{text-align:center;font-size:20px;font-weight:700;margin:10px 0 22px;color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.games{display:grid;gap:20px}
.game{display:flex;align-items:center;gap:14px;background:var(--white);border:4px solid var(--ink);border-radius:10px;
  box-shadow:7px 7px 0 var(--ink);padding:14px;color:inherit;text-decoration:none;transform:rotate(-1deg)}
.game:nth-child(even){transform:rotate(1deg)}
a.game:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
a.game:focus-visible{outline:3px dashed var(--pop);outline-offset:5px}
.pic{flex:none;width:92px;height:92px;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.pic svg{display:block;width:100%;height:100%}
.txt{min-width:0;flex:1}
.txt h2{font-family:var(--display);font-size:34px;line-height:.95;letter-spacing:.03em;margin:0 0 4px;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.maze h2{color:var(--hedge)}
.ski h2{color:var(--sky)}
.txt p{margin:0;font-size:15px;line-height:1.3}
.tag{display:inline-block;margin-top:8px;font-family:var(--display);letter-spacing:.06em;font-size:17px;background:var(--leaf);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);padding:1px 10px}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:30px}
.langs button{font-family:var(--display);font-size:15px;letter-spacing:.06em;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--pop);color:var(--white)}
.langs button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 data-i18n="title">JONAS' SPIELE</h1>
  <p class="sub" data-i18n="sub">Such dir ein Spiel aus!</p>
  <div class="games">
    <a class="game maze" href="irrgarten/">
      <div class="pic" aria-hidden="true">
        <svg viewBox="0 0 92 92">
          <rect width="92" height="92" fill="#6CC24A"/>
          <rect x="10" y="10" width="72" height="72" fill="#F4D9A0"/>
          <g fill="none" stroke="#2E9A4B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 10H82V82H10Z"/><path d="M28 10V46H46"/><path d="M64 28V64H28"/><path d="M46 28H64"/>
          </g>
          <g fill="none" stroke="#16120F" stroke-width="1.5" opacity=".35"><path d="M10 10H82V82H10Z"/></g>
          <circle cx="19" cy="73" r="6" fill="#E8322E" stroke="#16120F" stroke-width="2"/>
          <circle cx="73" cy="19" r="6" fill="#16120F"/>
          <path d="M73 19V5" stroke="#16120F" stroke-width="2"/><path d="M73 5l10 3-10 3Z" fill="#E8322E" stroke="#16120F" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="txt">
        <h2>IRRGARTEN</h2>
        <p data-i18n="mazeT">Kipp das Handy und roll die Kugel ins Loch, bevor die Hecken zuwachsen.</p>
        <span class="tag" data-i18n="play">SPIELEN!</span>
      </div>
    </a>
    <a class="game ski" href="skiing/">
      <div class="pic" aria-hidden="true">
        <svg viewBox="0 0 92 92">
          <rect width="92" height="92" fill="#7FC8F0"/>
          <path d="M0 58L30 22 46 40 62 18 92 54V92H0Z" fill="#EAF6FF" stroke="#16120F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M22 32l8-10 6 7-5 2-3-3Z M56 26l6-8 7 9-5-1-3 3Z" fill="#FFFDF6"/>
          <g stroke="#16120F" stroke-width="2" fill="#2E9A4B" stroke-linejoin="round">
            <path d="M14 82l7-16 7 16Z"/><path d="M70 76l6-14 6 14Z"/>
          </g>
          <path d="M40 76c8 2 14-4 22-2" fill="none" stroke="#9BB8CC" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
          <g transform="rotate(-18 54 66)">
            <path d="M40 74H70" stroke="#E8322E" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M52 72l3-12 6 2-2 10" fill="#E8322E" stroke="#16120F" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="58" cy="55" r="4.5" fill="#FFD93B" stroke="#16120F" stroke-width="2"/>
          </g>
        </svg>
      </div>
      <div class="txt">
        <h2>SKIING</h2>
        <p data-i18n="skiT">Tippe zur richtigen Zeit auf der Buckelpiste, spring über Schanzen und schlag den Computer.</p>
        <span class="tag" data-i18n="play">SPIELEN!</span>
      </div>
    </a>
  </div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</main>
<script>
const L={
  de:{doc:"Jonas' Spiele",title:"JONAS' SPIELE",sub:'Such dir ein Spiel aus!',mazeT:'Kipp das Handy und roll die Kugel ins Loch, bevor die Hecken zuwachsen.',skiT:'Tippe zur richtigen Zeit auf der Buckelpiste, spring über Schanzen und schlag den Computer.',play:'SPIELEN!',soon:'KOMMT BALD'},
  en:{doc:"Jonas's Games",title:"JONAS'S GAMES",sub:'Pick a game!',mazeT:'Tilt the phone and roll the ball into the hole before the hedges grow shut.',skiT:'Tap at the right moment on the bumps, fly off ramps and beat the computer.',play:'PLAY!',soon:'COMING SOON'},
  fr:{doc:"Les jeux de Jonas",title:'LES JEUX DE JONAS',sub:'Choisis un jeu !',mazeT:'Incline le téléphone et fais rouler la bille dans le trou avant que les haies ne se referment.',skiT:'Tape au bon moment sur les bosses, saute des tremplins et bats l’ordinateur.',play:'JOUER !',soon:'BIENTÔT'},
  es:{doc:"Los juegos de Jonas",title:'LOS JUEGOS DE JONAS',sub:'¡Elige un juego!',mazeT:'Inclina el móvil y mete la bola en el hoyo antes de que los setos lo cierren.',skiT:'Toca en el momento justo en los baches, salta en los trampolines y gana al ordenador.',play:'¡JUGAR!',soon:'MUY PRONTO'},
  it:{doc:"I giochi di Jonas",title:'I GIOCHI DI JONAS',sub:'Scegli un gioco!',mazeT:'Inclina il telefono e porta la pallina nella buca prima che le siepi chiudano i sentieri.',skiT:'Tocca al momento giusto sulle gobbe, salta dai trampolini e batti il computer.',play:'GIOCA!',soon:'IN ARRIVO'},
  pt:{doc:"Os jogos do Jonas",title:'OS JOGOS DO JONAS',sub:'Escolha um jogo!',mazeT:'Incline o celular e leve a bola até o buraco antes que as sebes fechem os caminhos.',skiT:'Toque na hora certa nas lombadas, salte das rampas e vença o computador.',play:'JOGAR!',soon:'EM BREVE'}
};
// Shares the language choice with Irrgarten (same origin, same key).
const KEY='irrgarten.lang';
function apply(k){
  const T=L[k];document.documentElement.lang=k;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[el.dataset.i18n]);
  document.title=T.doc;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
let cur='de';
try{const s=localStorage.getItem(KEY);if(L[s])cur=s;else{const n=(navigator.language||'de').slice(0,2);if(L[n])cur=n}}catch(_){}
const box=document.getElementById('langs');
Object.keys(L).forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=k.toUpperCase();
  b.onclick=()=>{try{localStorage.setItem(KEY,k)}catch(_){}apply(k)};box.append(b)});
apply(cur);
</script>
</body>
</html>
