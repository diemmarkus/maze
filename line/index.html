<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1E3440">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Line</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap">
<style>
/* One colour per level: a dark background and the line, a lighter shade of the same colour. Everything else is drawn with the line colour too. */
:root{--bg:#1E3440;--fg:#9ED6F2;--font:"Comfortaa",ui-rounded,"Trebuchet MS",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
/* The stage is always landscape. In a portrait window it is turned by 90°, so the game plays sideways. */
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
#stage.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:20px;padding:calc(12px + var(--st)) max(18px,var(--sr)) 0 max(18px,var(--sl));font-size:13px;font-weight:700;letter-spacing:.16em;pointer-events:none}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--fg);box-sizing:border-box;opacity:.55}
.dots i.on{background:var(--fg);opacity:1}
.hud .falls{opacity:.7}
#sndBtn{margin-left:auto}
#pauseBtn,#sndBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
#pauseBtn svg{width:14px;height:14px}#sndBtn svg{width:18px;height:18px}
#sndBtn[aria-pressed="false"] .wv{display:none}#sndBtn[aria-pressed="true"] .x{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(10px + var(--st)) max(14px,var(--sr)) calc(10px + var(--sb)) max(14px,var(--sl));background:color-mix(in srgb,var(--bg) 78%,transparent)}
.card{box-sizing:border-box;width:min(560px,100%);max-height:100%;overflow-y:auto;text-align:center;padding:14px 22px 16px;border:2px solid var(--fg);border-radius:22px;background:var(--bg)}
.logo{display:block;width:min(300px,80%);height:auto;margin:2px auto 4px}
h1{font-size:30px;font-weight:700;letter-spacing:.22em;margin:4px 0 8px}
.card p{margin:4px 0;font-size:14px;line-height:1.4;font-weight:500}
.lvl{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:11px;letter-spacing:.16em;font-weight:700}
.lv{display:flex;gap:6px;max-width:100%;overflow-x:auto;padding:3px}
.lv button{flex:none;font:inherit;font-size:13px;letter-spacing:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);cursor:pointer;padding:0}
.lv button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{font:inherit;font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--bg);background:var(--fg);border:2px solid var(--fg);border-radius:999px;padding:11px 28px;cursor:pointer}
.btn.alt{background:none;color:var(--fg)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.lv button:focus-visible,#pauseBtn:focus-visible,.home:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
.home{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--fg);text-decoration:none;opacity:.8}
.stats{display:flex;justify-content:center;gap:26px;margin:6px 0 4px;font-size:12px;letter-spacing:.14em;font-weight:700}
.stats b{display:block;font-size:22px;letter-spacing:.04em;margin-top:3px}
.stats .dots{justify-content:center;margin-top:8px}
.stats .dots i{width:14px;height:14px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="The Line"></canvas>
  <div class="hud" id="hud" hidden>
    <span id="lvChip">LEVEL 1</span>
    <span class="dots" id="dots"><i></i><i></i><i></i></span>
    <span class="falls" id="fallChip"></span>
    <button type="button" id="sndBtn" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-3.5v11L5 11H2Z" fill="currentColor"/><path class="wv" d="M12 6.5a3.5 3.5 0 0 1 0 5M14 4.5a6.5 6.5 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="x" d="M12 7l4 4M16 7l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button type="button" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1.5" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1.5" fill="currentColor"/></svg></button>
  </div>

  <div class="overlay" id="startOv">
    <div class="card">
      <svg class="logo" viewBox="0 0 300 70" aria-label="THE LINE" role="img">
        <text x="150" y="30" text-anchor="middle" font-family="Comfortaa,ui-rounded,sans-serif" font-weight="700" font-size="30" letter-spacing="9" fill="currentColor">THE LINE</text>
        <path d="M6 56H128C134 56 136 45 145 45C153 45 155 56 161 56H200M222 56H294" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="152" cy="49.5" r="1.8" fill="var(--bg)"/>
      </svg>
      <div class="lvl" id="lvlRow"><span data-i18n="level">LEVEL</span><div class="lv" id="lv" role="group"></div></div>
      <div class="btns"><button type="button" class="btn" id="playBtn" data-i18n="play">SPIELEN</button></div>
      <a class="home" href="../" data-i18n="home">← ALLE SPIELE</a>
    </div>
  </div>

  <div class="overlay" id="pauseOv" hidden>
    <div class="card">
      <h1 data-i18n="paused">PAUSE</h1>
      <div class="btns"><button type="button" class="btn" id="resumeBtn" data-i18n="resume">WEITER</button><button type="button" class="btn alt" id="restartBtn" data-i18n="restart">NEU STARTEN</button></div>
      <div class="btns"><button type="button" class="btn alt" id="menuBtn" data-i18n="menu">MENÜ</button></div>
    </div>
  </div>

  <div class="overlay" id="doneOv" hidden>
    <div class="card">
      <h1 id="doneTitle">LEVEL 1</h1>
      <p data-i18n="done"></p>
      <div class="stats">
        <div><span data-i18n="dotsL">PUNKTE</span><div class="dots" id="doneDots"><i></i><i></i><i></i></div></div>
        <div><span data-i18n="time">ZEIT</span><b id="doneTime">0:00</b></div>
        <div><span data-i18n="falls">STÜRZE</span><b id="doneFalls">0</b></div>
      </div>
      <div class="btns"><button type="button" class="btn" id="nextBtn" data-i18n="next">WEITER</button><button type="button" class="btn alt" id="againBtn" data-i18n="again">NOCHMAL</button></div>
      <a class="home" href="../" data-i18n="home">← ALLE SPIELE</a>
    </div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);

/* ---------- languages (shared with the other games) ---------- */
const LANG={
  de:{level:'LEVEL',play:'SPIELEN',paused:'PAUSE',resume:'WEITER',restart:'NEU STARTEN',menu:'MENÜ',done:'Geschafft!',dotsL:'PUNKTE',time:'ZEIT',falls:'STÜRZE',next:'WEITER',again:'NOCHMAL',home:'← ALLE SPIELE',fall:'✕'},
  en:{level:'LEVEL',play:'PLAY',paused:'PAUSED',resume:'RESUME',restart:'RESTART',menu:'MENU',done:'Done!',dotsL:'DOTS',time:'TIME',falls:'FALLS',next:'NEXT',again:'AGAIN',home:'← ALL GAMES',fall:'✕'},
  fr:{level:'NIVEAU',play:'JOUER',paused:'PAUSE',resume:'REPRENDRE',restart:'RECOMMENCER',menu:'MENU',done:'Réussi !',dotsL:'POINTS',time:'TEMPS',falls:'CHUTES',next:'SUIVANT',again:'ENCORE',home:'← TOUS LES JEUX',fall:'✕'},
  es:{level:'NIVEL',play:'JUGAR',paused:'PAUSA',resume:'SEGUIR',restart:'REINICIAR',menu:'MENÚ',done:'¡Lo lograste!',dotsL:'PUNTOS',time:'TIEMPO',falls:'CAÍDAS',next:'SIGUIENTE',again:'OTRA VEZ',home:'← TODOS LOS JUEGOS',fall:'✕'},
  it:{level:'LIVELLO',play:'GIOCA',paused:'PAUSA',resume:'RIPRENDI',restart:'RICOMINCIA',menu:'MENU',done:'Fatto!',dotsL:'PUNTI',time:'TEMPO',falls:'CADUTE',next:'AVANTI',again:'ANCORA',home:'← TUTTI I GIOCHI',fall:'✕'},
  pt:{level:'NÍVEL',play:'JOGAR',paused:'PAUSA',resume:'CONTINUAR',restart:'REINICIAR',menu:'MENU',done:'Conseguiu!',dotsL:'PONTOS',time:'TEMPO',falls:'QUEDAS',next:'PRÓXIMO',again:'DE NOVO',home:'← TODOS OS JOGOS',fall:'✕'}
};
let lang='de',T=LANG.de;
function setLang(k){lang=LANG[k]?k:'en';T=LANG[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T[el.dataset.i18n]})}

/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let unlocked=Math.max(1,store.get('line.unlocked',1)|0);
let bestDots=store.get('line.dots',{});

/* ---------- sound: Commodore-64-style blips (pulse wave like the SID chip) ---------- */
let AC=null,PW=null,soundOn=store.get('line.sound',true)!==false;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){return null}
    const n=32,re=new Float32Array(n),im=new Float32Array(n),d=.25;
    for(let k=1;k<n;k++){re[k]=2/(k*Math.PI)*Math.sin(2*Math.PI*k*d);im[k]=2/(k*Math.PI)*(1-Math.cos(2*Math.PI*k*d))}
    PW=AC.createPeriodicWave(re,im)}
  if(AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
function tone(f0,f1,dur,vol,at,shape){
  if(!soundOn)return;const a=audio();if(!a)return;
  const t0=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();
  if(!shape||shape==='pulse')o.setPeriodicWave(PW);else o.type=shape;
  o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.004);g.gain.setValueAtTime(vol,t0+dur*.55);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.03);
}
const sfx={
  jump(){tone(180,760,.15,.1);tone(360,1520,.15,.03,0,'square')},
  flip(){tone(880,220,.12,.08);tone(220,880,.12,.08,.1)},
  jump2(){tone(392,1568,.13,.09);tone(1568,1568,.05,.05,.13);tone(2093,2093,.06,.04,.18)},
  land(){tone(140,70,.06,.07,0,'triangle')},
  dot(){tone(1047,1047,.06,.08);tone(1568,1568,.1,.08,.065)},
  fall(){tone(640,60,.5,.1,0,'sawtooth');tone(320,40,.5,.06,.04)},
  check(){tone(784,784,.07,.07);tone(1175,1175,.1,.07,.075)},
  door(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.09,.08,i*.075));tone(1047,2093,.45,.05,.38,'triangle')}
};

/* ---------- landscape stage ---------- */
const stage=$('stage'),cv=$('c'),ctx=cv.getContext('2d');
const VIEW_H=300;               // world units that fit the screen height
let SW=640,SH=360,rot=false,DPR=1,K=1,viewW=640;
function layout(){
  const vw=innerWidth,vh=innerHeight;rot=vh>vw;
  SW=rot?vh:vw;SH=rot?vw:vh;
  stage.style.width=SW+'px';stage.style.height=SH+'px';
  stage.style.transform=rot?`translate(${vw}px,0) rotate(90deg)`:'none';
  stage.classList.toggle('rot',rot);
  DPR=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  K=SH/VIEW_H;viewW=SW/K;
}
addEventListener('resize',layout);
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',()=>setTimeout(layout,50));
layout();
// screen point → stage point (undo the 90° turn)
function toStage(e){return rot?{x:e.clientY,y:innerWidth-e.clientX}:{x:e.clientX,y:e.clientY}}
// Android: go full screen and lock to landscape. iOS can't, there the turned stage does the job.
function goLandscape(){
  const d=document.documentElement;
  try{
    if(!document.fullscreenElement&&d.requestFullscreen){
      d.requestFullscreen({navigationUI:'hide'}).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).then(()=>setTimeout(layout,60)).catch(()=>{});
    }else if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
  }catch(_){}
}

/* ---------- colours ---------- */
let BG='#1E3440',FG='#9ED6F2';
function hslHex(h,s,l){s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,c=l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function setTheme(n){
  const h=(200+(n-1)*47)%360;
  BG=hslHex(h,36,19);FG=hslHex(h,72,77);
  const r=document.documentElement.style;r.setProperty('--bg',BG);r.setProperty('--fg',FG);
  document.querySelector('meta[name=theme-color]').setAttribute('content',BG);
}

/* ---------- level generator ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let plats=[],spikes=[],sparks=[],cps=[],goal=null,killY=400,levelN=1;
function mkPlat(pts,solid,mv){return{pts,solid,mv:mv||null,ox:0,oy:0,dx:0,dy:0}}
function gen(n){
  const R=rng(n*7919+13),ri=(a,b)=>a+R()*(b-a);
  const d=Math.min(1,(n-1)/12);
  const target=Math.min(7200,1900+n*380);
  plats=[];spikes=[];sparks=[];cps=[];flips=[];sharks=[];
  let cx=0,cy=0,cur=[[-500,0]],g=1;   // g: which side of the line you're on (1 = on top, -1 = underneath)
  const cands=[],flats=[];
  const end=()=>{if(cur.length>1)plats.push(mkPlat(cur,true))};
  const flat=L=>{if(L>=70)flats.push([cx+L/2,cy,g,cur]);cx+=L;cur.push([cx,cy])};
  const flip=()=>{flat(70);flips.push({x:cx,y:cy,used:0,p:{pts:cur,ox:0,oy:0}});g=-g;flat(ri(110,150))};
  flat(380);
  const W={flat:1.5,slope:3,step:2.2,stairs:1,gap:3,spikes:n>=2?2.2:0,flip:n>=3?1.3:0,shark:n>=2?1.4:0,floats:n>=3?1.4:0,mover:n>=4?1.2:0};
  const pick=last=>{let tot=0;for(const k in W)if(k!==last)tot+=W[k];let r=R()*tot;for(const k in W){if(k===last)continue;if((r-=W[k])<0)return k}return 'flat'};
  let last='';
  // everything is built in "gravity frame": -g*… is away from the line on your side
  while(cx<target){
    const k=pick(last);last=k;
    if(k==='flat')flat(ri(90,200));
    else if(k==='flip')flip();
    else if(k==='shark'){flat(50);const L=ri(170,240+60*d);sharks.push({p:{pts:cur,ox:0,oy:0},x0:cx,x1:cx+L,y:cy,g,pos:cx+L*R(),dir:R()<.5?-1:1,sp:ri(45,70+45*d),rise:0});cands.push([cx+L/2,cy-g*75]);cx+=L;cur.push([cx,cy]);flat(ri(70,110))}
    else if(k==='slope'){const L=ri(120,260),dy=ri(25,Math.min(110,L*.55))*(R()<.5?-1:1);cx+=L;cy+=dy;cur.push([cx,cy]);flat(ri(50,100))}
    else if(k==='step'){const up=R()<.55,dy=g*(up?-ri(18,28+34*d):ri(25,60+40*d));cur.push([cx,cy+dy]);cy+=dy;flat(ri(80,150))}
    else if(k==='stairs'){const up=R()<.5,m=3+(R()<.5?1:0);for(let i=0;i<m;i++){const dy=ri(14,22)*(up?-1:1);cur.push([cx,cy+dy]);cy+=dy;flat(ri(44,64))}flat(70)}
    else if(k==='gap'){
      const dy=ri(-30-22*d,50),up=Math.max(0,-dy),w=ri(48,Math.min(130,72+58*d)-up*.6);
      end();cands.push([cx+w/2,cy+g*(Math.min(0,dy)-58)]);cx+=w;cy+=g*dy;cur=[[cx,cy]];flat(ri(100,160));
    }
    else if(k==='spikes'){flat(60);const t=Math.round(ri(2,3.4+4*d)),w=t*12;spikes.push({x0:cx,x1:cx+w,y:cy,n:t,g});cands.push([cx+w/2,cy-g*62]);cx+=w;cur.push([cx,cy]);flat(ri(80,130))}
    else if(k==='floats'){
      end();const m=1+(R()<.3+.4*d?1:0);let x=cx;let fy=cy;
      for(let i=0;i<m;i++){const sub=ri(58,82+22*d),pw=ri(55,85);x+=sub;fy=cy-g*ri(8,44);plats.push(mkPlat([[x,fy],[x+pw,fy]],false));cands.push([x+pw/2,fy-g*42]);x+=pw}
      x+=ri(58,80+20*d);cx=x;cy=fy+g*ri(-20,35);cur=[[cx,cy]];flat(ri(100,150));
    }
    else if(k==='mover'){
      end();const G=ri(250,330+60*d),pw=72,c=cx+G/2,amp=G/2-pw/2-2;
      plats.push(mkPlat([[c-pw/2,cy],[c+pw/2,cy]],false,{amp,per:ri(3.9,3.1-.5*d),ph:R()*6.283}));
      cands.push([c,cy-g*48]);cx+=G;cur=[[cx,cy]];flat(ri(110,160));
    }
  }
  // the last stretch: a small ring on the line puts you back on top (if you're upside down), then the door
  flat(60);endFlip={x:cx,y:cy,p:{pts:cur,ox:0,oy:0}};flat(170);goal={x:cx,y:cy};flat(170);end();
  // checkpoints: one in the middle, two on long levels
  const cpN=target>4200?2:1;
  for(let i=1;i<=cpN;i++){const want=target*i/(cpN+1);let b=null;for(const f of flats)if(f[0]>300&&(!b||Math.abs(f[0]-want)<Math.abs(b[0]-want)))b=f;if(b&&!cps.some(c=>c.x===b[0]))cps.push({x:b[0],y:b[1],g:b[2],p:{pts:b[3],ox:0,oy:0},on:false})}
  cps.sort((a,b)=>a.x-b.x);
  // three dots, spread out over the level
  cands.sort((a,b)=>a[0]-b[0]);
  const idx=cands.length>=3?[.15,.5,.85].map(f=>Math.floor(f*(cands.length-1))):cands.map((_,i)=>i);
  [...new Set(idx)].forEach(i=>sparks.push({x:cands[i][0],y:cands[i][1],got:false,pop:0}));
  while(sparks.length<3){const f=flats[(sparks.length*7+3)%flats.length];sparks.push({x:f[0],y:f[1]-f[2]*60,got:false,pop:0})}
  let maxY=-1e9,minY=1e9;for(const p of plats)for(const q of p.pts){maxY=Math.max(maxY,q[1]);minY=Math.min(minY,q[1])}killY=maxY+300;killTop=minY-300;
}

/* ---------- physics ----------
   Gravity can point down (P.g=1, you run on top of the line) or up (P.g=-1, you hang underneath).
   "Above" always means on your side of the line: g*(y-f)>0. */
const SPEED=205,ACC_G=1700,ACC_A=950,G=1500,JV=545,STEP=7,SNAP=10,CL=26;
function floorAt(p,x){
  const q=p.pts,lx=x-p.ox;
  if(lx<q[0][0]||lx>q[q.length-1][0])return null;
  for(let i=0;i<q.length-1;i++){const a=q[i],b=q[i+1];if(b[0]===a[0])continue;
    if(lx>=a[0]&&lx<=b[0])return a[1]+(b[1]-a[1])*(lx-a[0])/(b[0]-a[0])+p.oy}
  return null;
}
function support(x,y,g){g=g||P.g;let best=null;for(const p of plats){const f=floorAt(p,x);if(f===null)continue;const h=g*(y-f);if(h>=-SNAP&&h<=STEP&&(!best||g*f<g*best.y))best={y:f,p}}return best}
function ledgeAt(x,y){const g=P.g;let b=null;for(const p of plats){if(!p.solid)continue;const f=floorAt(p,x);if(f===null)continue;const h=g*(y-f);if(h>STEP&&h<=18&&(b===null||g*f<g*b))b=f}return b}

const P={x:0,y:0,vx:0,vy:0,ground:true,on:null,coy:0,buf:0,face:1,walk:0,squash:0,dead:0,win:0,air:0,dj:true,split:0,g:1,flipT:0};

function placeAt(x,y,g){P.g=g||1;const s=support(x,y)||support(x,y-P.g*60);P.x=x;P.y=s?s.y:y;P.on=s?s.p:null;P.ground=!!s;P.vx=P.vy=0;P.coy=P.buf=0;P.dead=0;P.squash=0;P.dj=true;P.split=0;P.flipT=0;drops=[]}
function startLevel(n){
  ripples=[];levelN=n;setTheme(n);gen(n);t=0;lvTime=0;falls=0;holes=[];shards=[];pops=[];curtain=null;shake=0;
  for(const p of plats)if(p.mv){p.ox=p.mv.amp*Math.sin(p.mv.ph);p.dx=0}
  spawn={x:40,y:0,g:1};placeAt(40,0,1);P.face=1;P.win=0;
  camX=P.x-viewW*.35;camY=P.y-VIEW_H*.6;

}
function die(){
  if(state!=='play')return;
  state='dead';P.dead=0;falls++;updateHud();buzz([70,50,140]);sfx.fall();
  const y0=P.g>0?Math.min(P.y,killY-40):Math.max(P.y,killTop+40);
  const yc=Math.max(camY+30,Math.min(camY+VIEW_H-30,y0-P.g*8));
  P.dx0=P.x;P.dy0=yc;P.vx=0;

    shards.push({x:P.x,y:yc,vx:Math.cos(a)*v+P.vx*.2,vy:Math.sin(a)*v-P.g*120,r:1.6+Math.random()*3.2,stuck:0,g:P.g,d:.12+Math.random()*.05})}
  curtain={t:0,drips:[],ph:Math.random()*9};
  for(let x=Math.random()*10;x<SW+20;){const w=5+Math.random()*Math.random()*22,full=Math.random()<.38;
    curtain.drips.push({x,w,full,max:full?SH+80:SH*(.12+Math.random()*.6),sp:full?250+Math.random()*350:0,acc:full?700+Math.random()*1600:0,k:2+Math.random()*3,dl:Math.random()*.3,
      drops:full&&Math.random()<.6?[{off:20+Math.random()*60,r:w*.35+1.5,v:0}]:[]});

function flipNow(x,y,f){

function respawn(){
  shards=[];holes=[];

  for(const f of flips)f.used=0;

function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}

/* ---------- input ---------- */
const joy={id:null,ox:0,oy:0,x:0,y:0};const keys={l:0,r:0};
const JR=44;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state!=='play'&&state!=='dead')return;
  if(lvTime<1.2)touchedEarly=true;
  const p=toStage(e);
  if(joy.id===null&&p.x<SW*.5){joy.id=e.pointerId;joy.ox=joy.x=p.x;joy.oy=joy.y=p.y}
  else{P.buf=.14;hintJumped=true}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==joy.id)return;const p=toStage(e);joy.x=p.x;joy.y=p.y;
  // the ring follows a finger that went too far, so turning around is quick
  const dx=joy.x-joy.ox;if(dx>JR*1.4)joy.ox=joy.x-JR*1.4;else if(dx<-JR*1.4)joy.ox=joy.x+JR*1.4;
});
const up=e=>{if(e.pointerId===joy.id)joy.id=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function joyDir(){if(joy.id===null)return 0;const dx=joy.x-joy.ox;if(Math.abs(dx)<6)return 0;return Math.max(-1,Math.min(1,(dx-Math.sign(dx)*6)/(JR-10)))}
addEventListener('keydown',e=>{
  const c=e.code;
  if(state==='play'&&lvTime<1.2)touchedEarly=true;
  if(c==='ArrowLeft'||c==='KeyA')keys.l=1;
  else if(c==='ArrowRight'||c==='KeyD')keys.r=1;
  else if(c==='Space'||c==='ArrowUp'||c==='KeyW'){if(!e.repeat&&state==='play'){P.buf=.14;hintJumped=true}}
  else if(c==='Escape'||c==='KeyP'){if(state==='play')pause();else if(state==='paused')resume()}
  else if(c==='Enter'){const ov=[...document.querySelectorAll('.overlay')].find(o=>!o.hidden);if(ov){const b=ov.querySelector('.btn');b&&b.click()}return}
  else return;
  e.preventDefault();
});
addEventListener('keyup',e=>{const c=e.code;if(c==='ArrowLeft'||c==='KeyA')keys.l=0;if(c==='ArrowRight'||c==='KeyD')keys.r=0});

/* ---------- update ---------- */
function update(dt){
  t+=dt;
  for(const p of plats)if(p.mv){const nx=p.mv.amp*Math.sin(t*6.2832/p.mv.per+p.mv.ph);p.dx=nx-p.ox;p.ox=nx}
  for(const h of holes)h.t+=dt;holes=holes.filter(h=>h.t<.5);
  for(const r of ripples)r.t+=dt;ripples=ripples.filter(r=>r.t<.6);
  for(const s of sparks)if(s.pop>0)s.pop+=dt;
  for(const q of pops)q.t+=dt;pops=pops.filter(q=>q.t<.6);
  for(const f of flips)if(f.used>0)f.used=Math.max(0,f.used-dt);
  // sharks swim along under the line, only the fin sticks out; they jump up with open mouth when you fly over them
  for(const k of sharks){
    k.pos+=k.dir*k.sp*dt;if(k.pos<k.x0+14){k.pos=k.x0+14;k.dir=1}if(k.pos>k.x1-14){k.pos=k.x1-14;k.dir=-1}
    const above=state==='play'&&!P.ground&&P.g===k.g&&Math.abs(P.x-k.pos)<75&&k.g*(k.y-P.y)>8;
    k.rise+=((above?1:0)-k.rise)*Math.min(1,dt*(above?9:4));
  }
  if(state==='dead'){
    P.dead+=dt;
    for(const s of shards){if(P.dead<s.d||s.stuck)continue;s.vy+=s.g*G*.9*dt;const py=s.y;s.x+=s.vx*dt;s.y+=s.vy*dt;
      for(const p of plats){const f=floorAt(p,s.x);if(f!==null&&s.g*(py-f)<=0&&s.g*(s.y-f)>=0){s.y=f-s.g*s.r*.5;s.stuck=1;break}}}
    if(P.dead>.9)respawn();return;
  }
  if(state==='win'){P.win+=dt;P.x+=(goal.x-P.x)*Math.min(1,dt*7);if(P.win>1.25)levelDone();return}
  if(state!=='play')return;
  lvTime+=dt;
  const g=P.g;
  const dir=joy.id!==null?joyDir():keys.r-keys.l;
  if(dir!==0){P.face=dir>0?1:-1;hintMoved=true}
  const tgt=dir*SPEED,acc=P.ground?ACC_G:ACC_A;
  P.vx+=Math.max(-acc*dt,Math.min(acc*dt,tgt-P.vx));
  if(!P.ground)P.air+=dt;
  if(P.buf>0)P.buf-=dt;if(P.coy>0)P.coy-=dt;if(P.squash>0)P.squash-=dt;if(P.flipT>0)P.flipT-=dt;
  // ride along on moving bits
  if(P.ground&&P.on&&P.on.mv)P.x+=P.on.dx;
  // horizontal move, walls are just higher ground (on your side of the line)
  const px0=P.x,nx=P.x+P.vx*dt,probe=nx+Math.sign(P.vx)*(P.ground?9:4);
  if(Math.abs(P.vx)>1&&wallAt(probe,P.y)){
    // just short of an edge in the air: pop up onto it instead of sliding down the wall
    const lf=P.ground?null:ledgeAt(probe,P.y);
    if(lf!==null&&g*P.vy>-80&&!wallAt(probe,lf)){P.x=nx;P.y=lf;P.vy=0;P.ground=true;P.on=support(P.x,P.y+g)?.p||null;P.squash=.18;if(!P.on)P.ground=false}
    else P.vx=0;
  }else P.x=nx;
  if(P.ground){
    P.walk+=Math.abs(P.vx)*dt*.09;
    const s=support(P.x,P.y);
    if(s){P.y=s.y;P.on=s.p}else{P.ground=false;P.on=null;P.coy=.1;P.vy=0}
  }else{
    const py=P.y;P.vy+=g*G*dt;if(g*P.vy>1100)P.vy=g*1100;P.y+=P.vy*dt;
    if(g*P.vy>=0){let best=null;
      for(const p of plats){const f=floorAt(p,P.x);if(f===null)continue;if(g*(py-(f-p.dy))>=-STEP&&g*(f-P.y)<=0&&(!best||g*f<g*best.y))best={y:f,p}}
      if(best){P.y=best.y;P.on=best.p;P.ground=true;P.squash=.18;P.dj=true;P.split=0;if(g*P.vy>250){sfx.land();ripples.push({p:best.p,x:P.x-best.p.ox,t:0,g,a:Math.min(5,g*P.vy/160)})}P.vy=0}}
  }
  // jump: the piece lifts out of the line and leaves a hole that closes again
  if(P.buf>0&&(P.ground||P.coy>0)){
    if(P.ground&&P.on){const sp=lineSpan(P.on,P.x,CL/2+1);holes.push({p:P.on,x:P.x-P.on.ox,l:sp.el-P.on.ox,r:sp.er-P.on.ox,t:0})}
    if(P.on)ripples.push({p:P.on,x:P.x-P.on.ox,t:0,g,a:2.5});
    P.vy=-g*JV;P.ground=false;P.on=null;P.coy=0;P.buf=0;P.air=0;sfx.jump();
  }else if(P.buf>0&&!P.ground&&P.dj&&P.air>.06){
    // second jump in the air: higher, but a little drop splits off the blob
    P.vy=-g*JV*.92;P.dj=false;P.split=1;P.buf=0;sfx.jump2();buzz(10);
    drops.push({x:P.x-P.face*4,y:P.y-g*4,vx:-P.face*70+P.vx*.25,vy:g*160,r:3.3,t:0,g});
  }
  for(const d of drops){d.t+=dt;d.vy+=d.g*G*dt;const py=d.y;d.x+=d.vx*dt;d.y+=d.vy*dt;
    for(const p of plats){const f=floorAt(p,d.x);if(f!==null&&d.g*(py-f)<=0&&d.g*(d.y-f)>=0){d.dead=1;pops.push({x:d.x,y:f,t:.3,s:1});break}}
    if(d.y>killY||d.y<killTop)d.dead=1}
  drops=drops.filter(d=>!d.dead);
  // gravity switch: walk through it and you're on the other side of the line
  for(const f of flips){
    if(f.used>0)continue;
    // only when you walk through it on the line - jumping over it does nothing
    if(P.ground&&Math.abs(P.y-f.y)<4&&((px0<f.x&&P.x>=f.x)||(px0>f.x&&P.x<=f.x)))flipNow(f.x,f.y,f);
  }
  // the ring before the door always puts you back on top
  if(endFlip&&P.g<0&&P.ground&&Math.abs(P.y-endFlip.y)<4&&px0<endFlip.x&&P.x>=endFlip.x)flipNow(endFlip.x,endFlip.y,null);
  // spikes, sharks, falling, dots, checkpoints, goal
  for(const s of spikes)if(s.g===P.g&&P.x+8>s.x0&&P.x-8<s.x1){const h=s.g*(s.y-P.y);if(h<11&&h>-30){die();return}}
  for(const k of sharks){if(k.g!==P.g)continue;const h=k.g*(k.y-P.y),dx=Math.abs(P.x-k.pos);
    if(dx<11&&h<14&&h>-6){die();return}                     // the fin
    if(k.rise>.2&&dx<22&&h>-6&&h<k.rise*52+4){die();return}  // the mouth
  }
  if(P.y>killY||P.y<killTop){die();return}
  for(const s of sparks)if(!s.got&&Math.hypot(P.x-s.x,P.y-P.g*9-s.y)<20){s.got=true;s.pop=.001;buzz(12);sfx.dot();updateHud()}
  for(const c of cps)if(!c.on&&P.x>=c.x&&P.ground&&P.g===c.g){c.on=true;spawn={x:c.x,y:c.y,g:c.g};sfx.check();pops.push({x:c.x,y:c.y-c.g*22,t:0})}
  if(P.ground&&P.g>0&&P.x>=goal.x-6){state='win';P.win=0;P.vx=0;buzz([20,40,20]);sfx.door()}
}

/* ---------- drawing ---------- */
const LW=4;
function strokeAlong(p,x0,x1,col,w){
  if(x1<=x0)return;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='butt';ctx.beginPath();let first=true;
  for(let x=x0;x<=x1+.01;x+=3){const f=floorAt(p,Math.min(x,x1));if(f===null){first=true;continue}if(first){ctx.moveTo(x,f);first=false}else ctx.lineTo(x,f)}
  ctx.stroke();
  ctx.lineCap='round';
}
// the character: a hump in the line (on your side of it), peak a little to the front, one small eye
function lineSpan(p,x,half){
  const g=P.g,f0=floorAt(p,x),r={el:x,er:x,wl:x-half,wr:x+half};if(f0===null)return r;
  for(const s of[-1,1]){let prev=f0,ok=true;
    for(let d=1;d<=half;d++){const f=floorAt(p,x+s*d);
      if(f!==null&&g*(prev-f)>2){if(s<0)r.wl=x-d+1;else r.wr=x+d-1;break}   // a step up on your side: a wall
      if(f===null||Math.abs(f-prev)>2)ok=false;
      if(ok){prev=f;if(s<0)r.el=x-d;else r.er=x+d}}}
  return r;
}
function humpPts(x0,x1,baseFn,h,face){
  const pts=[],n=12,len=x1-x0;
  for(let i=0;i<=n;i++){let s=i/n;const u=face>0?Math.pow(s,.85):1-Math.pow(1-s,.85);
    const px=x0+s*len;pts.push([px,baseFn(px)-h*Math.pow(Math.sin(Math.PI*u),1.4)])}
  return pts;
}
function strokePts(pts,close){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath();ctx.stroke()}
// in the air the piece of line curls up: both ends swing round and meet, and it's a round outline (a blob)
function drawBlob(){
  const g=P.g,k0=Math.min(1,P.air/.16),k=1-Math.pow(1-k0,2.2);
  const sz=P.split?.82:1,Rf=8.5*sz;
  ctx.strokeStyle=FG;ctx.lineWidth=LW;
  if(k<1){
    // an arc of a circle: its length grows from the hump to the full ring, the opening closes towards your side of the line
    const A=.7+k*(6.2832-.7),Lc=CL+(6.2832*Rf-CL)*k,R=Lc/A;
    const top=P.y-g*(10+(2*Rf-9)*k),cy=top+g*R,a0=-g*Math.PI/2,pts=[];
    for(let i=0;i<=20;i++){const a=a0+(i/20-.5)*A;pts.push([P.x+Math.cos(a)*R,cy+Math.sin(a)*R])}
    strokePts(pts,false);return;
  }
  const st=Math.max(-.3,Math.min(.3,-g*P.vy/1500)),wob=Math.min(1,(P.air-.16)/.15);
  const ry=Rf*(1+st),rx=Rf*(1-st*.7),cx=P.x,cy=P.y-g*(ry+1),pts=[];
  for(let i=0;i<24;i++){const a=i/24*6.2832,w=1+wob*(.07*Math.sin(3*a+t*15)+.05*Math.sin(5*a-t*11));pts.push([cx+Math.cos(a)*rx*w,cy+Math.sin(a)*ry*w])}
  strokePts(pts,true);
  ctx.fillStyle=FG;ctx.beginPath();ctx.arc(cx+P.face*rx*.38,cy-g*ry*.2,1.9,0,6.2832);ctx.fill();
}
function drawChar(){
  if(state==='dead'){
    const d=P.dead;
    if(d<.12){   // swells up, trembling, then pops
      const r=9+d/.12*7,j=1.5*Math.sin(d*180);ctx.strokeStyle=FG;ctx.lineWidth=LW;
      ctx.beginPath();ctx.ellipse(P.dx0+j,P.dy0,r*1.1,r*.9,0,0,6.2832);ctx.stroke();
      ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P.dx0-4+j,P.dy0-4);ctx.lineTo(P.dx0-1+j,P.dy0-1);ctx.moveTo(P.dx0-1+j,P.dy0-4);ctx.lineTo(P.dx0-4+j,P.dy0-1);
      ctx.moveTo(P.dx0+1+j,P.dy0-4);ctx.lineTo(P.dx0+4+j,P.dy0-1);ctx.moveTo(P.dx0+4+j,P.dy0-4);ctx.lineTo(P.dx0+1+j,P.dy0-1);ctx.stroke();
      return}
    const k=Math.min(1,(d-.12)/.25);
    ctx.strokeStyle=FG;ctx.lineWidth=3*(1-k);if(k<1){ctx.beginPath();ctx.arc(P.dx0,P.dy0,16+k*40,0,6.2832);ctx.stroke()}
    ctx.fillStyle=FG;

      if(s.stuck)ctx.ellipse(s.x,s.y,s.r*1.5,s.r*.6,0,0,6.2832);else ctx.ellipse(s.x,s.y,s.r,s.r*(1+Math.min(.8,Math.abs(s.vy)/900)),0,0,6.2832);ctx.fill()}
    return;
  }

  const moving=Math.abs(P.vx)>15;
  if(state==='win'){const k=Math.min(1,P.win/.3);h=9*(1-k);len=CL*(1-k*.9);if(k>=1)return}
  else if(P.ground){
    h=moving?8+1.3*Math.sin(P.walk*6.2832):8+.6*Math.sin(t*3);
    if(P.squash>0)h*=1-P.squash*2.2;
    len=CL+(8-h)*.7;
  }else{drawBlob();return}
  // after a gravity switch the hump swings through the line to the other side
  const side=P.flipT>0?P.g*(1-2*P.flipT/.25):P.g;
  h*=side;

    const sp=lineSpan(on,P.x,Math.ceil(len/2)+1);x0=Math.max(x0,sp.wl);x1=Math.min(x1,sp.wr);
    base=px=>{const f=floorAt(on,Math.max(sp.el,Math.min(sp.er,px)));return f===null?P.y:f};
    strokeAlong(on,Math.max(x0,sp.el),Math.min(x1,sp.er),BG,LW+3);
  }else base=()=>P.y;
  const pts=humpPts(x0,x1,base,h,P.face);
  ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false);
  if(Math.abs(h)>4){const e=pts[P.face>0?8:4],bl=(t%3.3)<.13;ctx.fillStyle=BG;ctx.beginPath();if(bl)ctx.ellipse(e[0],e[1]+3*Math.sign(h),1.9,.5,0,0,6.2832);else ctx.arc(e[0],e[1]+3*Math.sign(h),1.7,0,6.2832);ctx.fill()}
}
// a shark under the line: just the fin, or (when you fly over it) its head with the jaws wide open
function drawShark(k){
  const g=k.g,x=k.pos,y=k.y,r=k.rise;
  if(r<.15){
    const b=k.dir;   // the fin: curved front edge, sweeps back to a point, steep back edge
    strokeAlong(k.p,Math.min(x-b*7,x+b*12),Math.max(x-b*7,x+b*12),BG,LW+3);
    ctx.strokeStyle=FG;ctx.lineWidth=LW;
    const fh=g*(1+.14*Math.sin(t*4.5+k.x0)),lean=Math.sin(t*3+k.x0)*1.2;
    strokePts([[x+b*12,y],[x+b*6,y-fh*5],[x+b*1+lean,y-fh*10],[x-b*3+lean,y-fh*14],[x-b*6+lean*1.4,y-fh*17],[x-b*5+lean,y-fh*11],[x-b*5,y-fh*5],[x-b*7,y]],false);
    return;
  }
  // the line rears up into a shark's head seen from the side: pointed snout, jaw dropped wide open, triangle teeth, eye and gills
  const sd=k.dir,H=r*54,op=r,Q=(u,v)=>[x+sd*u*1.4,y-g*v];
  strokeAlong(k.p,x-22,x+22,BG,LW+3);

  const teeth=(a,b,n,sz)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;let nx=-dy/l,ny=dx/l;
    if(nx*(mc[0]-a[0])+ny*(mc[1]-a[1])<0){nx=-nx;ny=-ny}const o=[],step=1/n;
    for(let i=0;i<n;i++){const u0=i*step,um=u0+step*.5;o.push([a[0]+dx*u0,a[1]+dy*u0],[a[0]+dx*um+nx*sz,a[1]+dy*um+ny*sz])}
    o.push(b);return o};
  const pts=[Q(-15,0),Q(-16.5,H*.25),Q(-16.5,H*.5),Q(-14,H*.72),Q(-9,H*.88),Q(-3,H*.97),Q(4,H*1.01),Q(10,H*1),Q(14,H*.95),   // back of the head up to the pointed snout
    ...teeth(Q(10,H*.86),Q(0,H*.5),3,7*op),corner,                                              // upper jaw with teeth
    ...teeth(Q(2,H*.4),Q(20,H*(.32+.12*(1-op))),3,6.5*op),                          // dropped lower jaw with teeth
    Q(18,H*.2),Q(15,H*.07),Q(14,0)];
  ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.lineJoin='miter';ctx.miterLimit=10;strokePts(pts,false);ctx.lineJoin='round';
  ctx.fillStyle=FG;const ey=Q(-3,H*.8);ctx.beginPath();ctx.arc(ey[0],ey[1],2.2,0,6.2832);ctx.fill();
  ctx.lineWidth=2;for(let i=0;i<3;i++){const a=Q(-12+i*2.6,H*.12),b2=Q(-11+i*2.6,H*.3);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke()}
}
function render(){
  const k=DPR*K;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width,cv.height);
  if(!goal)return;
  if(state==='done'){ctx.fillStyle=FG;ctx.fillRect(0,0,cv.width,cv.height);return}
  // camera: a bit ahead of where you run
  if(state==='play'||state==='win'){
    const tx=P.x-viewW*.38+P.vx*.35,ty=P.y-VIEW_H*(P.g>0?.6:.4);
    camX+=(tx-camX)*.08;camY+=(ty-camY)*.06;
  }
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake*30;sy=(Math.random()-.5)*shake*30}
  ctx.setTransform(k,0,0,k,-(camX+sx)*k,-(camY+sy)*k);
  ctx.lineCap='round';ctx.lineJoin='round';
  const vx0=camX-40,vx1=camX+viewW+40;
  // the line
  ctx.strokeStyle=FG;ctx.lineWidth=LW;
  for(const p of plats){const q=p.pts;if(q[q.length-1][0]+p.ox<vx0||q[0][0]+p.ox>vx1)continue;
    ctx.beginPath();q.forEach(([x,y],i)=>i?ctx.lineTo(x+p.ox,y+p.oy):ctx.moveTo(x+p.ox,y+p.oy));ctx.stroke()}
  // spikes: zig-zags cut into the line
  for(const s of spikes){if(s.x1<vx0||s.x0>vx1)continue;
    ctx.strokeStyle=BG;ctx.lineWidth=LW+3;ctx.beginPath();ctx.moveTo(s.x0+1,s.y);ctx.lineTo(s.x1-1,s.y);ctx.stroke();
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.moveTo(s.x0,s.y);
    for(let i=0;i<s.n;i++){ctx.lineTo(s.x0+i*12+6,s.y-s.g*12*(1+.14*Math.sin(t*5+i*1.3+s.x0)));ctx.lineTo(s.x0+i*12+12,s.y)}ctx.stroke()}
  // gravity switches: the line twists into a figure eight whose loops keep flipping from one side to the other
  for(const f of flips){if(f.x<vx0||f.x>vx1)continue;const a=15,sy=2.3*Math.cos(t*2.6),pts=[];
    strokeAlong(f.p,f.x-a,f.x+a,BG,LW+3);
    for(let i=0;i<=40;i++){const u=Math.PI+i/40*6.2832,d=1+Math.sin(u)**2;pts.push([f.x+a*Math.cos(u)/d,f.y+sy*a*Math.sin(u)*Math.cos(u)/d])}
    ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false)}
  if(endFlip&&endFlip.x>vx0&&endFlip.x<vx1){const f=endFlip,r=5.5+.6*Math.sin(t*4);
    strokeAlong(f.p,f.x-r,f.x+r,BG,LW+3);ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.2832);ctx.stroke()}
  for(const k of sharks)if(k.x1>vx0&&k.x0<vx1)drawShark(k);
  // ripples running along the line away from where you landed
  for(const r of ripples){const amp=r.a*(1-r.t/.6),w=16;if(amp<.3)continue;
    for(const s of[-1,1]){const xc=r.x+r.p.ox+s*(18+r.t*170),x0=xc-w/2,x1=xc+w/2,f0=floorAt(r.p,x0),f1=floorAt(r.p,x1),fm=floorAt(r.p,xc);
      if(f0===null||f1===null||fm===null||Math.abs(fm-(f0+f1)/2)>1.5)continue;
      strokeAlong(r.p,x0,x1,BG,LW+3);const pts=[];for(let i=0;i<=8;i++){const u=i/8,x=x0+u*w;pts.push([x,f0+(f1-f0)*u-r.g*amp*Math.sin(Math.PI*u)**2])}
      ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false)}}
  // holes left behind by a jump, closing up
  for(const h of holes){const w=CL*(1-Math.pow(h.t/.5,2));if(w<1)continue;const o=h.p.ox,x=h.x+o;strokeAlong(h.p,Math.max(x-w/2,h.l+o),Math.min(x+w/2,h.r+o),BG,LW+3)}
  // checkpoints: the line runs up into a little lollipop; its head fills when you pass
  for(const c of cps){if(c.x<vx0||c.x>vx1)continue;const g=c.g,x=c.x,y=c.y,r=6.5,hy=y-g*24.5,sw=Math.sin(t*2.2+c.x*.01)*2.2;
    strokeAlong(c.p,x-3,x+3,BG,LW+3);
    const pts=[[x-3,y],[x-3+sw*.3,y-g*9],[x-3+sw,y-g*17.5]];
    const a0=Math.atan2(-g*17.5-(hy-y),-3),a1=Math.atan2(-g*17.5-(hy-y),3);   // where the stem meets the head
    let st=a0,en=a1;if(g>0){if(en<st)en+=6.2832}else{if(en>st)en-=6.2832}
    for(let i=0;i<=24;i++){const u=st+(en-st)*i/24;pts.push([x+sw+Math.cos(u)*r,hy+Math.sin(u)*r])}
    pts.push([x+3+sw,y-g*17.5],[x+3+sw*.3,y-g*9],[x+3,y]);
    ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false);
    if(c.on){ctx.fillStyle=FG;ctx.beginPath();ctx.arc(x+sw,hy,r,0,6.2832);ctx.fill()}}
  // the door at the end: when you walk in it lights up and its colour floods the screen
  {const gx=goal.x,gy=goal.y,dw=13,dh=42,lit=state==='win'?Math.min(1,P.win/.3):0;
    if(lit>0){ctx.fillStyle=FG;ctx.fillRect(gx-dw,gy-dh*lit,dw*2,dh*lit)}
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.moveTo(gx-dw,gy);ctx.lineTo(gx-dw,gy-dh);ctx.lineTo(gx+dw,gy-dh);ctx.lineTo(gx+dw,gy);ctx.stroke();
    if(lit<1){ctx.fillStyle=FG;ctx.beginPath();ctx.arc(gx+dw-5,gy-dh*.45,2,0,6.2832);ctx.fill()}
    if(state==='win'&&P.win>.3){const k=Math.min(1,(P.win-.3)/.8),e=k*k*(3-2*k);
      ctx.fillStyle=FG;ctx.beginPath();ctx.arc(gx,gy-dh/2,8+e*(viewW+VIEW_H)*1.3,0,6.2832);ctx.fill()}}
  for(const q of pops){ctx.strokeStyle=FG;ctx.lineWidth=2;ctx.globalAlpha=1-q.t/.6;ctx.beginPath();ctx.arc(q.x,q.y,q.s?2+(q.t-.3)*30:8+q.t*70,0,6.2832);ctx.stroke();ctx.globalAlpha=1}
  ctx.strokeStyle=FG;ctx.lineWidth=2;for(const d of drops){ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*.85,d.r*(1+Math.min(.5,Math.abs(d.vy)/1600)),0,0,6.2832);ctx.stroke()}
  if(state!=='menu')drawChar();
  // screen space: joystick and first-level hints
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // blood running down the whole screen, in the line colour
  if(curtain){const c=curtain,a=c.t<1?1:Math.max(0,1-(c.t-1)/.7);
    ctx.globalAlpha=a;ctx.fillStyle=FG;
    // the band at the top with a wobbly lower edge
    const B=Math.min(1,c.t/.18)*(14+SH*.02),edge=x=>B+3*Math.sin(x*.045+c.ph)+2*Math.sin(x*.13+c.ph*2);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(SW,0);for(let x=SW;x>=0;x-=6)ctx.lineTo(x,edge(x));ctx.closePath();ctx.fill();
    for(const d of c.drips){const tt=c.t-d.dl;if(tt<=0)continue;
      const L=d.full?Math.min(d.max,B+d.sp*tt+d.acc*tt*tt):B+(d.max-B)*(1-Math.exp(-d.k*tt)),w=d.w,cx=d.x,hw=w/2,fl=w*.9,top=edge(cx)-1;
      if(L<top+w*2.2){ctx.beginPath();ctx.ellipse(cx,top,hw+fl*.5,Math.max(1,L-top),0,0,Math.PI);ctx.fill();continue}
      // a stream that runs out of the band, thins a little and ends in a heavy drop
      ctx.beginPath();ctx.moveTo(cx-hw-fl,top);ctx.quadraticCurveTo(cx-hw,top,cx-hw,top+fl);
      ctx.lineTo(cx-hw*.8,L-w*1.7);
      ctx.bezierCurveTo(cx-hw*.8,L-w*1.2,cx-w*.66,L-w*1.15,cx-w*.66,L-w*.6);
      ctx.bezierCurveTo(cx-w*.66,L-w*.12,cx-w*.32,L,cx,L);
      ctx.bezierCurveTo(cx+w*.32,L,cx+w*.66,L-w*.12,cx+w*.66,L-w*.6);
      ctx.bezierCurveTo(cx+w*.66,L-w*1.15,cx+hw*.8,L-w*1.2,cx+hw*.8,L-w*1.7);
      ctx.lineTo(cx+hw,top+fl);ctx.quadraticCurveTo(cx+hw,top,cx+hw+fl,top);ctx.closePath();ctx.fill();
      // loose drops falling off the fast ones
      for(const q of d.drops){if(tt<.25)continue;q.v+=dtFrame*1400;q.off+=q.v*dtFrame;const y=L+q.off;if(y>SH+20)continue;
        ctx.beginPath();ctx.moveTo(cx,y-q.r*2.6);ctx.bezierCurveTo(cx+q.r*.3,y-q.r*1.4,cx+q.r,y-q.r*.9,cx+q.r,y);ctx.arc(cx,y,q.r,0,Math.PI);ctx.bezierCurveTo(cx-q.r,y-q.r*.9,cx-q.r*.3,y-q.r*1.4,cx,y-q.r*2.6);ctx.fill()}}
    ctx.globalAlpha=1}
  if(joy.id!==null&&state==='play'){
    ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2;ctx.globalAlpha=.35;
    ctx.beginPath();ctx.arc(joy.ox,joy.oy,JR,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.moveTo(joy.ox-JR-10,joy.oy);ctx.lineTo(joy.ox-JR-4,joy.oy-5);ctx.lineTo(joy.ox-JR-4,joy.oy+5);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(joy.ox+JR+10,joy.oy);ctx.lineTo(joy.ox+JR+4,joy.oy-5);ctx.lineTo(joy.ox+JR+4,joy.oy+5);ctx.closePath();ctx.fill();
    ctx.globalAlpha=.6;const kx=Math.max(-JR,Math.min(JR,joy.x-joy.ox));ctx.beginPath();ctx.arc(joy.ox+kx,joy.oy,17,0,6.2832);ctx.fill();ctx.globalAlpha=1;
  }
  // nobody touched the screen at the start: show the controls (a joystick moving left/right, a tap button)
  if(state==='play'&&!touchedEarly&&lvTime>1.2&&(!hintMoved||!hintJumped)){
    const fade=Math.min(1,(lvTime-1.2)/.4),y=SH*.72;
    ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2;
    if(!hintMoved&&joy.id===null){const x=Math.max(90,SW*.18),kx=Math.sin(t*2.6)*JR*.75;
      ctx.globalAlpha=.35*fade;ctx.beginPath();ctx.arc(x,y,JR,0,6.2832);ctx.stroke();
      for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(x+s*(JR+10),y);ctx.lineTo(x+s*(JR+4),y-5);ctx.lineTo(x+s*(JR+4),y+5);ctx.closePath();ctx.fill()}
      ctx.globalAlpha=.6*fade;ctx.beginPath();ctx.arc(x+kx,y,17,0,6.2832);ctx.fill()}
    if(!hintJumped){const x=Math.min(SW-90,SW*.82),ph=(t*1.1)%1;
      ctx.globalAlpha=.35*fade;ctx.beginPath();ctx.arc(x,y,24,0,6.2832);ctx.stroke();
      ctx.globalAlpha=.6*fade*(ph<.15?1:.55);ctx.beginPath();ctx.arc(x,y,ph<.15?13:11,0,6.2832);ctx.fill();
      ctx.globalAlpha=.45*fade*(1-ph);ctx.beginPath();ctx.arc(x,y,24+ph*26,0,6.2832);ctx.stroke()}
    ctx.globalAlpha=1;
  }
}

/* ---------- loop ---------- */
let lastT=performance.now(),accT=0;
function frame(now){
  let dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(state==='menu'){t+=dt;for(const p of plats)if(p.mv)p.ox=p.mv.amp*Math.sin(t*6.2832/p.mv.per+p.mv.ph);camX+=dt*30;if(goal&&camX>goal.x)camX=-viewW*.3;}
  else if(state!=='paused'&&state!=='done'){accT+=dt;while(accT>=1/120){update(1/120);accT-=1/120}}
  dtFrame=state==='paused'?0:dt;
  if(curtain&&state!=='paused'){curtain.t+=dt;if(curtain.t>1.75)curtain=null}
  if(shake>0)shake=Math.max(0,shake-dt);
  render();requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
const startOv=$('startOv'),pauseOv=$('pauseOv'),doneOv=$('doneOv'),hud=$('hud');
let sel=Math.min(unlocked,store.get('line.last',unlocked)|0||1);
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function updateHud(){
  $('lvChip').textContent=T.level+' '+levelN;
  [...$('dots').children].forEach((el,i)=>el.classList.toggle('on',!!(sparks[i]&&sparks[i].got)));
  $('fallChip').textContent=falls?T.fall+' '+falls:'';
}
function buildLevels(){
  const box=$('lv');box.innerHTML='';
  $('lvlRow').hidden=unlocked<2;
  for(let i=1;i<=unlocked;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.setAttribute('aria-pressed',i===sel);
    b.onclick=()=>{sel=i;buildLevels();preview()};box.append(b)}
  const on=box.querySelector('[aria-pressed="true"]');if(on)box.scrollLeft=on.offsetLeft-box.clientWidth/2;
}
function preview(){setTheme(sel);gen(sel);levelN=sel;camX=-viewW*.3;camY=-VIEW_H*.6;t=0}
function showMenu(){state='menu';hud.hidden=true;pauseOv.hidden=doneOv.hidden=true;startOv.hidden=false;buildLevels();preview()}
function play(n){goLandscape();audio();store.set('line.last',n);startOv.hidden=doneOv.hidden=pauseOv.hidden=true;hud.hidden=false;joy.id=null;startLevel(n);state='play';lastT=performance.now();accT=0}
function pause(){if(state!=='play'&&state!=='dead')return;state='paused';joy.id=null;pauseOv.hidden=false}
function resume(){pauseOv.hidden=true;state='play';lastT=performance.now();accT=0}
function levelDone(){
  if(state!=='win')return;state='done';
  const r=document.documentElement.style;r.setProperty('--bg',FG);r.setProperty('--fg',BG);
  document.querySelector('meta[name=theme-color]').setAttribute('content',FG);
  const got=sparks.filter(s=>s.got).length;
  if(levelN+1>unlocked){unlocked=levelN+1;store.set('line.unlocked',unlocked)}
  if(got>(bestDots[levelN]||0)){bestDots[levelN]=got;store.set('line.dots',bestDots)}
  $('doneTitle').textContent=T.level+' '+levelN;
  [...$('doneDots').children].forEach((el,i)=>el.classList.toggle('on',i<got));
  $('doneTime').textContent=fmt(lvTime);$('doneFalls').textContent=falls;
  hud.hidden=true;doneOv.hidden=false;$('nextBtn').focus({preventScroll:true});
}
$('playBtn').onclick=()=>play(sel);
$('pauseBtn').onclick=pause;
function paintSnd(){$('sndBtn').setAttribute('aria-pressed',soundOn)}
$('sndBtn').onclick=()=>{soundOn=!soundOn;store.set('line.sound',soundOn);paintSnd();if(soundOn)sfx.dot()};
paintSnd();
$('resumeBtn').onclick=resume;
$('restartBtn').onclick=()=>play(levelN);
$('menuBtn').onclick=()=>{sel=levelN;showMenu()};
$('nextBtn').onclick=()=>{sel=levelN+1;play(sel)};
$('againBtn').onclick=()=>play(levelN);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

{let want='de';try{const s=localStorage.getItem('irrgarten.lang');if(LANG[s])want=s;else{const n=(navigator.language||'de').slice(0,2);if(LANG[n])want=n}}catch(_){}setLang(want)}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
