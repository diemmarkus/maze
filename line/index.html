<style>
/* One colour per level: a dark background and the line, a lighter shade of the same colour. Everything else is drawn with the line colour too. */
:root{--bg:#1E3440;--fg:#9ED6F2;--font:"Comfortaa",ui-rounded,"Trebuchet MS",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
/* The stage is always landscape. In a portrait window it is turned by 90°, so the game plays sideways. */
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
#stage.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:20px;padding:calc(12px + var(--st)) max(18px,var(--sr)) 0 max(18px,var(--sl));font-size:13px;font-weight:700;letter-spacing:.16em;pointer-events:none}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--fg);box-sizing:border-box;opacity:.55}
.dots i.on{background:var(--fg);opacity:1}
.hud .falls{opacity:.7}
#musBtn{margin-left:auto}
#pauseBtn,#sndBtn,#musBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
#pauseBtn svg{width:14px;height:14px}#sndBtn svg{width:18px;height:18px}
#sndBtn[aria-pressed="false"] .wv{display:none}#sndBtn[aria-pressed="true"] .x{display:none}
#musBtn svg{width:18px;height:18px}#musBtn[aria-pressed="false"]{opacity:.45}#musBtn[aria-pressed="true"] .x{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(10px + var(--st)) max(14px,var(--sr)) calc(10px + var(--sb)) max(14px,var(--sl));background:color-mix(in srgb,var(--bg) 78%,transparent)}
.card{box-sizing:border-box;width:min(560px,100%);max-height:100%;overflow-y:auto;text-align:center;padding:14px 22px 16px;border:2px solid var(--fg);border-radius:22px;background:var(--bg)}
.logo{display:block;width:min(300px,80%);height:auto;margin:2px auto 4px}
h1{font-size:30px;font-weight:700;letter-spacing:.22em;margin:4px 0 8px}
.card p{margin:4px 0;font-size:14px;line-height:1.4;font-weight:500}
/* stars: an outline, filled when earned */
.st{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.st.on{fill:currentColor}
.stars{display:flex;justify-content:center;gap:3px}
.sw{position:relative;display:inline-block;line-height:0}
.sf{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.sf .st{fill:currentColor}
.big .st{width:46px;height:46px;stroke-width:1.8}
.big .sw.got{animation:pop .45s cubic-bezier(.3,1.8,.5,1) both}
.big .sw:nth-child(2){animation-delay:.25s}.big .sw:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.ibtns{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 4px}
.ib{width:54px;height:54px;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib .f{fill:currentColor}
.ib.sm{width:44px;height:44px;align-self:center}
.ib[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
a.ib{text-decoration:none}
.head{display:flex;align-items:center;gap:14px;margin-bottom:2px}.head h1{margin:0;flex:1;text-align:left}.head .total{margin:0}
#startOv .ibtns{margin-top:6px}.ib.sm svg{width:20px;height:20px}
.ib.main{width:76px;height:76px;background:var(--fg);color:var(--bg)}.ib.main svg{width:34px;height:34px}
.ib:active{transform:scale(.94)}.ib:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
#pauseOv .card{width:auto;padding:16px 22px}
.iosHint{font-size:12px;opacity:.8;margin:8px 0 0}
.total{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.1em;margin:2px 0 4px}
.total .st{width:15px;height:15px}
/* level overview: every level in its own colour */
#levelsOv .card{width:min(680px,100%);display:flex;flex-direction:column}
.grid{min-height:0;flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;overflow-y:auto;padding:6px 4px 8px;margin:6px 0}
.tile{font:inherit;color:var(--tf);background:var(--tb);border:2px solid var(--tf);border-radius:16px;padding:8px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.tile b{font-size:22px;line-height:1}
.tile .st{width:13px;height:13px}
.tile:disabled{opacity:.35;cursor:default}
.tile.cur{box-shadow:0 0 0 3px var(--fg)}
.tile:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
.lives{display:flex;gap:5px}
.lives svg{width:17px;height:15px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.lives svg.lost{fill:none;opacity:.35}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:14px;font-weight:700;letter-spacing:.08em;padding:8px 16px;border:2px solid var(--fg);border-radius:999px;background:var(--bg);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
.lvl{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:11px;letter-spacing:.16em;font-weight:700}
.lv{display:flex;gap:6px;max-width:100%;overflow-x:auto;padding:3px}
.lv button{flex:none;font:inherit;font-size:13px;letter-spacing:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--fg);background:none;color:var(--fg);cursor:pointer;padding:0}
.lv button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{font:inherit;font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--bg);background:var(--fg);border:2px solid var(--fg);border-radius:999px;padding:11px 28px;cursor:pointer}
.btn.alt{background:none;color:var(--fg)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.lv button:focus-visible,#pauseBtn:focus-visible,.home:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
.home{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--fg);text-decoration:none;opacity:.8}
.stats{display:flex;justify-content:center;gap:26px;margin:6px 0 4px;font-size:12px;letter-spacing:.14em;font-weight:700}
.stats b{display:block;font-size:22px;letter-spacing:.04em;margin-top:3px}
.stats .dots{justify-content:center;margin-top:8px}
.stats .dots i{width:14px;height:14px}
</style>
</head>

// sand: the line made of grains (packed tight on top, looser below), with gaps where it has given way

  const a=p.pts[0][0]+p.ox,b=p.pts[1][0]+p.ox,y=p.pts[0][1],sd=p.sand;ctx.fillStyle=FG;
  let i=0;for(let x=a;x<=b;x+=2.2,i++){if(floorAt(p,x)===null)continue;
    const h1=Math.sin(i*12.9898+sd.seed)*43758.5453,r1=h1-Math.floor(h1),h2=Math.sin(i*78.233+sd.seed)*12345.678,r2=h2-Math.floor(h2);
    // a thick packed layer at the line (about as thick as the line), looser grains hanging below it
    ctx.fillRect(x-1.2,y-2.6+r1*1.0,2.4,4.6+r2*1.2);if(r2>.45)ctx.fillRect(x-.9+r1,y+2.4+r2*2,1.8,1.8);if(r1>.7)ctx.fillRect(x-.7,y+5+r2*3,1.4,1.4)}
}
// a ghost: a dome with a wavy hem; hunting it shows its eyes and an open mouth, watched it goes shy and see-through
function drawGhost(k){
  // below the line (upside-down sections) the ghost hangs upside down too
  const sh=k.eye<.5?Math.sin(t*60)*.6:0,bob=Math.sin(t*3+k.hx)*2.5,f=k.face,g=k.g||1;
  ctx.save();ctx.translate(k.x+sh,k.y+bob*g);ctx.scale(1,g);
  ctx.globalAlpha=.45+.55*k.eye;ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-12,11);ctx.lineTo(-12,-3);ctx.arc(0,-3,12,Math.PI,0);ctx.lineTo(12,11);
  for(let i=0;i<=12;i++){const u=i/12;ctx.lineTo(12-u*24,11+Math.sin(u*Math.PI*3+t*7)*2.6)}
  ctx.stroke();
  // eyes only while it's awake and hunting; watched, it closes them and they fade away
  if(k.eye>.02){ctx.globalAlpha=k.eye;ctx.fillStyle=FG;for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(f*2+s*4.6,-4,2,3.2,0,0,6.2832);ctx.fill()}}
  ctx.restore();
}

// two eyes watching you; the pupils follow the character
function drawEyes(ex,ey,g,sc,look,lid){
  // two tall eyes side by side, touching in the middle, with upright oval pupils (after the drawing)
  ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2.6;
  for(const s of[-1,1]){const cx=ex+s*6.6*sc,rx=6.6*sc,ry=8.6*sc;
    ctx.beginPath();ctx.ellipse(cx,ey,rx,ry,0,0,6.2832);ctx.stroke();
    if(lid>=1){ctx.beginPath();ctx.moveTo(cx-rx*.8,ey);ctx.lineTo(cx+rx*.8,ey);ctx.stroke();continue}
    const dx=look[0]-cx,dy=look[1]-ey,l=Math.hypot(dx,dy)||1;
    ctx.beginPath();ctx.ellipse(cx+dx/l*rx*.4,ey+dy/l*ry*.3,1.9*sc,3.6*sc,0,0,6.2832);ctx.fill()}
}

// eaten: the eyes stare, a head pops up round them, the mouth gapes and sucks you in, SNAP, chew chew chew, gulp, burp, gone
function drawMonster(d){
  // after the drawing: a big round head arching over the two eyes, a wide snout with two nostrils, two fangs below,
  // and little shock lines above. Story: stare – head pops up – snout gapes and sucks you in – SNAP – chew – gulp – burp – wink.
  const ex=P.ex,ey=P.ey,g=P.g,cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)};
  const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
  const out=EAT_CURTAIN+.15,grow=d<out?back((d-.08)/.22):1-ease((d-out)/.25);
  const open=d<.12?0:d<.24?ease((d-.12)/.12):d<.3?1:d<.34?1-ease((d-.3)/.04):0;
  const ch=d>.36&&d<.9?Math.sin((d-.36)/.54*3*6.2832)*(1-(d-.36)/.54*.4):0,gulp=d>.9&&d<1.02?Math.sin((d-.9)/.12*Math.PI):0;
  const S=grow,sx=1-.08*ch+.05*open-.06*gulp,sy=1+.1*ch+.04*open+.12*gulp;
  const Y=v=>ey+g*v*S*sy,X=u=>ex+u*S*sx;   // local coordinates, scaled and squashed
  ctx.save();ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=LW;ctx.lineCap='round';ctx.lineJoin='round';
  // shock lines above the head while it stares
  if(d<.45){const a=Math.min(1,d/.06)*(1-cl((d-.3)/.15));ctx.globalAlpha=a;ctx.lineWidth=3;
    for(let i=0;i<5;i++){const an=-Math.PI/2+(i-2)*.42,r0=(S>.05?30*S:14)+4,r1=r0+6;ctx.beginPath();ctx.moveTo(ex+Math.cos(an)*r0,ey+g*(Math.sin(an)*r0-(S>.05?6*S:0)));ctx.lineTo(ex+Math.cos(an)*r1,ey+g*(Math.sin(an)*r1-(S>.05?6*S:0)));ctx.stroke()}
    ctx.globalAlpha=1;ctx.lineWidth=LW}
  if(S>.03){
    // the head: a dome over the eyes, coming down the sides to the snout
    ctx.beginPath();ctx.moveTo(X(-21),Y(12));ctx.bezierCurveTo(X(-25),Y(-8),X(-18),Y(-27),X(0),Y(-27));ctx.bezierCurveTo(X(18),Y(-27),X(25),Y(-8),X(21),Y(12));ctx.stroke();
    // the snout: a wide oval; when it gapes the lower half drops away as a jaw
    const sy0=Y(22),rx=27*S*sx,ry=11*S*sy,drop=open*24*S;
    if(open>.03){
      ctx.fillStyle=BG;ctx.beginPath();ctx.ellipse(ex,sy0,rx,ry,0,Math.PI,0,g<0);ctx.lineTo(ex+rx,sy0+g*drop);ctx.ellipse(ex,sy0+g*drop,rx,ry,0,0,Math.PI,g<0);ctx.closePath();ctx.fill();ctx.fillStyle=FG;
      ctx.beginPath();ctx.ellipse(ex,sy0,rx,ry,0,Math.PI,0,g<0);ctx.stroke();                       // upper lip with the nostrils
      ctx.beginPath();ctx.ellipse(ex,sy0+g*drop,rx,ry,0,0,Math.PI,g<0);ctx.stroke();                // lower jaw
      ctx.beginPath();ctx.moveTo(ex-rx,sy0);ctx.lineTo(ex-rx,sy0+g*drop);ctx.moveTo(ex+rx,sy0);ctx.lineTo(ex+rx,sy0+g*drop);ctx.stroke();
      // the two fangs hang from the upper lip into the open mouth
      for(const s2 of[-1,1]){const fx=ex+s2*10*S*sx;ctx.beginPath();ctx.moveTo(fx-4*S,sy0);ctx.lineTo(fx+s2*1.5*S,sy0+g*11*S*open);ctx.lineTo(fx+4*S,sy0);ctx.closePath();ctx.fill()}
    }else{
      ctx.beginPath();ctx.ellipse(ex,sy0+g*(ch?1.5*Math.sin(d*40):0),rx,ry,0,0,6.2832);ctx.stroke();
      // fangs poking out below the closed snout, wiggling while it chews
      for(const s2 of[-1,1]){const fx=ex+s2*10*S*sx,fy=sy0+g*ry;ctx.beginPath();ctx.moveTo(fx-s2*5*S,fy-g*1);ctx.lineTo(fx+s2*(1+Math.abs(ch)*2)*S,fy+g*10*S);ctx.lineTo(fx+s2*5*S,fy-g*2);ctx.stroke()}
    }
    // nostrils
    for(const s2 of[-1,1]){ctx.beginPath();ctx.arc(ex+s2*4*S,sy0-g*ry*.45,1.9*S,0,6.2832);ctx.fill()}
  }
  // you: frozen, then sucked into the mouth, stretched
  if(d<.32){const my=Y(22)+g*open*10*S,k=ease((d-.1)/.2),cx=P.ax+(ex-P.ax)*k,cy=(P.ay-g*9)+(my-(P.ay-g*9))*k,r=8.5*(1-.5*k),tr=d<.1?Math.sin(d*160)*1.4:0;
    const ang=Math.atan2(my-cy,ex-cx);ctx.save();ctx.translate(cx+tr,cy);ctx.rotate(ang);ctx.beginPath();ctx.ellipse(0,0,r*(1+.7*k),r*(1-.35*k),0,0,6.2832);ctx.stroke();ctx.restore()}
  // burp bubble
  if(d>.95&&d<1.4){const k=(d-.95)/.45;ctx.lineWidth=2;ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(ex+16*S,Y(18)-g*k*36,3+k*5,0,6.2832);ctx.stroke();ctx.globalAlpha=1}
  // the eyes: wide with shock, happy arcs while chewing, a wink at the end
  const es=(d<.1?1+.4*ease(d/.1):1.4-.15*ease((d-.3)/.2))*Math.max(.75,S||.75),eyY=Y(-6)+(S<.05?0:0);
  if(d>.36&&d<.95){ctx.lineWidth=2.6;for(const s2 of[-1,1]){const cx=ex+s2*6.6*es;ctx.beginPath();ctx.ellipse(cx,eyY,6.6*es,8.6*es,0,0,6.2832);ctx.stroke();
      ctx.beginPath();ctx.arc(cx,eyY+g*2*es,3.4*es,g>0?Math.PI*1.1:Math.PI*.1,g>0?Math.PI*1.9:Math.PI*.9);ctx.stroke()}}
  else drawEyes(ex,eyY,g,es,d<.36?[P.ax,P.ay]:[ex+P.face*30,eyY],d>1.05&&d<1.2?1:0);
  ctx.restore();
}

// fried: lifted off the line and shaking, flickering between outline-with-bolts and a lit-up x-ray;
// then it smokes, chars, and crumbles into ash that blows away
function drawZap(d){
  const g=P.g,lift=Math.min(1,d/.08)*7*(d<.6?1:Math.max(0,1-(d-.6)/.2)),cx=P.ax+(d<.55?(Math.random()-.5)*3:0),cy=P.ay-g*(10+lift);
  const rnd=(i)=>{const h=Math.sin(i*91.7+Math.floor(d*30)*13.1)*43758.5;return h-Math.floor(h)};
  ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineJoin='miter';
  if(d<.55){
    if(Math.floor(d/.06)%2===0){
      ctx.lineWidth=LW;ctx.beginPath();ctx.ellipse(cx,cy,9,9.5,0,0,6.2832);ctx.stroke();
      ctx.lineWidth=2;for(let b=0;b<4;b++){const a=rnd(b)*6.2832,ex=P.ax+(rnd(b+9)-.5)*60,ey=P.ay;let x=cx+Math.cos(a)*9,y=cy+Math.sin(a)*9;
        ctx.beginPath();ctx.moveTo(x,y);for(let i=1;i<=4;i++){const u=i/4;ctx.lineTo(x+(ex-x)*u+(i<4?(rnd(b*7+i)-.5)*10:0),y+(ey-y)*u+(i<4?(rnd(b*5+i)-.5)*8:0))}ctx.stroke()}
    }else{   // the x-ray: lit up solid, a zigzag spine and crossed-out eyes showing through
      ctx.beginPath();ctx.ellipse(cx,cy,10,10.5,0,0,6.2832);ctx.fill();
      ctx.strokeStyle=BG;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(cx-1,cy-g*1);for(let i=1;i<=4;i++)ctx.lineTo(cx+(i%2?2.5:-2.5),cy+g*(i*2.2-1));ctx.stroke();
      for(const s of[-1,1]){const ex=cx+s*4,ey=cy-g*4;ctx.beginPath();ctx.moveTo(ex-1.6,ey-1.6);ctx.lineTo(ex+1.6,ey+1.6);ctx.moveTo(ex+1.6,ey-1.6);ctx.lineTo(ex-1.6,ey+1.6);ctx.stroke()}
      ctx.strokeStyle=FG}
  }else if(d<.82){   // charred: a broken, shrinking outline
    const k=(d-.55)/.27;ctx.lineWidth=LW*.8;ctx.setLineDash([3,3.5]);ctx.beginPath();ctx.ellipse(cx,cy+g*k*4,9*(1-k*.25),9.5*(1-k*.45),0,0,6.2832);ctx.stroke();ctx.setLineDash([])
  }else{   // a little heap of ash on the line, blowing away
    const k=Math.min(1,(d-.82)/.5);ctx.globalAlpha=1-k;
    for(let i=0;i<9;i++){const u=(i/8-.5),x=P.ax+u*16+k*(18+i*5)*(i%2?1:.6),y=P.ay-g*(2+Math.abs(u)*-3+k*i*1.5);ctx.beginPath();ctx.arc(x,y,1.4+(i%3)*.4,0,6.2832);ctx.fill()}
    ctx.globalAlpha=1}
  // smoke curling up once it's fried
  if(d>.5){ctx.lineWidth=2;for(let i=0;i<3;i++){const tt=d-.5-i*.12;if(tt<0||tt>.9)continue;ctx.globalAlpha=Math.max(0,.7-tt*.8);
    ctx.beginPath();ctx.arc(P.ax+Math.sin(tt*6+i*2)*5+i*3,P.ay-g*(16+tt*55),3+tt*9,0,6.2832);ctx.stroke()}ctx.globalAlpha=1}
  ctx.lineJoin='round';
}
// a little bird: round body, head with a beak, a tail; sitting it bobs and pecks, flying it flaps its wings
function drawBird(b){
  const f=b.face,x=b.x,y=b.by;ctx.save();ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  if(!b.fly){const peck=Math.max(0,Math.sin(t*1.7+b.seed*3))**12,bob=Math.sin(t*5+b.seed)*.6;
    ctx.beginPath();ctx.moveTo(x-1.5,y);ctx.lineTo(x-2,y-3);ctx.moveTo(x+1.5,y);ctx.lineTo(x+1,y-3);ctx.stroke();           // legs on the line
    ctx.beginPath();ctx.ellipse(x,y-7+bob,5.5,4.2,0,0,6.2832);ctx.stroke();                                                  // body
    ctx.beginPath();ctx.moveTo(x-f*5,y-8+bob);ctx.lineTo(x-f*10,y-11+bob);ctx.stroke();                                       // tail
    const hx=x+f*(5+peck*2),hy=y-12+bob+peck*5;ctx.beginPath();ctx.arc(hx,hy,2.8,0,6.2832);ctx.stroke();                     // head
    ctx.beginPath();ctx.moveTo(hx+f*2.6,hy-.8);ctx.lineTo(hx+f*5.5,hy+.4);ctx.lineTo(hx+f*2.6,hy+1.4);ctx.fill()}            // beak
  else{const fl=Math.sin(b.fly*28);
    ctx.beginPath();ctx.ellipse(x,y,5,3.5,0,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-6,y-1-fl*6);ctx.quadraticCurveTo(x-3,y-2,x,y-1);ctx.quadraticCurveTo(x+3,y-2,x+6,y-1-fl*6);ctx.stroke();   // wings
    ctx.beginPath();ctx.arc(x+f*5.5,y-2,2.4,0,6.2832);ctx.stroke();ctx.beginPath();ctx.moveTo(x+f*7.6,y-2.6);ctx.lineTo(x+f*10,y-1.6);ctx.lineTo(x+f*7.6,y-.8);ctx.fill()}
  ctx.restore();
}
function drawChar(){
  if(P.inv>0&&state==='play'&&Math.floor(P.inv*14)%2)return;   // blinking after a hit
  if(state==='dead'){
    const d=P.dead;
    if(P.kind==='eaten'){drawMonster(d);return}
    if(P.kind==='drown'){   // sinks away, the last bubbles go up
      const y=P.ay+d*28,a=Math.max(0,1-d/1.1);ctx.globalAlpha=a;ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.ellipse(P.ax,y-8,7.5,8.5,0,0,6.2832);ctx.stroke();
      ctx.lineWidth=2;for(let i=0;i<4;i++){const by=P.ay-12-((d*60+i*14)%60);if(by>P.water.y){ctx.beginPath();ctx.arc(P.ax+Math.sin(d*8+i)*4,by,1.5+i*.5,0,6.2832);ctx.stroke()}}
      ctx.globalAlpha=1;return}
    if(P.kind==='zap'){drawZap(d);return}
    if(P.kind==='pop'){const b=P.bal;ctx.strokeStyle=FG;ctx.fillStyle=FG;
      for(const q of b.puffs){ctx.globalAlpha=1-q.t/.4;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,1.5+q.t*9,0,6.2832);ctx.stroke()}ctx.globalAlpha=1;
      if(d<.12){ctx.lineWidth=2;for(let i=0;i<6;i++){const a=i/6*6.2832;ctx.beginPath();ctx.moveTo(P.ax+Math.cos(a)*5,P.ay+Math.sin(a)*5);ctx.lineTo(P.ax+Math.cos(a)*(9+d*60),P.ay+Math.sin(a)*(9+d*60));ctx.stroke()}}   // pssst
      // the balloon: stretched along where it's flying, wobbling, with a little knot at the back where the air comes out
      const air=Math.max(0,1-d/1.25),sp=Math.hypot(b.vx,b.vy),a=Math.atan2(b.vy,b.vx),st=Math.min(.35,sp/1800),r=b.r;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.lineWidth=LW;ctx.beginPath();
      for(let i=0;i<=28;i++){const u=i/28*6.2832,w=1+(.06+.18*(1-air))*Math.sin(5*u+d*30)+.05*Math.sin(3*u-d*19);const px=Math.cos(u)*r*(1+st)*w,py=Math.sin(u)*r*(1-st*.6)*w*(air>0?1:.55);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
      ctx.closePath();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-r*(1+st)+1,0);ctx.lineTo(-r*(1+st)-4,-2.5);ctx.lineTo(-r*(1+st)-4,2.5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(r*.35,-r*.25,air>0?1.9:1.2,0,6.2832);ctx.fill();ctx.restore();return}
    if(P.kind==='line'){   // the hump sinks back into the line and is gone
      const k=Math.min(1,d/.14);if(k>=1)return;const p=P.lp,x=P.lx+p.ox,len=CL*(1+k*.6),h=P.g*9*(1-k)*(1-k);
      strokeAlong(p,x-len/2,x+len/2,BG,LW+3);const pts=humpPts(x-len/2,x+len/2,px=>{const f=floorAt(p,px);return f===null?P.dy0:f},h,P.face,.85);
      ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false);return}
    if(P.kind==='fall'){   // a splash at the edge of the screen
      const k=Math.min(1,d/.35);ctx.strokeStyle=FG;ctx.lineWidth=3*(1-k);
      if(k<1){ctx.beginPath();ctx.ellipse(P.dx0,P.dy0,10+k*60,6+k*30,0,0,6.2832);ctx.stroke()}
      ctx.fillStyle=FG;for(const s of shards){ctx.beginPath();ctx.ellipse(s.x,s.y,s.r,s.r*(1+Math.min(.9,Math.abs(s.vy)/700)),0,0,6.2832);ctx.fill()}
      return}
    if(d<.12){   // swells up, trembling, then pops
      const r=9+d/.12*7,j=1.5*Math.sin(d*180);ctx.strokeStyle=FG;ctx.lineWidth=LW;
      ctx.beginPath();ctx.ellipse(P.dx0+j,P.dy0,r*1.1,r*.9,0,0,6.2832);ctx.stroke();
      ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P.dx0-4+j,P.dy0-4);ctx.lineTo(P.dx0-1+j,P.dy0-1);ctx.moveTo(P.dx0-1+j,P.dy0-4);ctx.lineTo(P.dx0-4+j,P.dy0-1);
      ctx.moveTo(P.dx0+1+j,P.dy0-4);ctx.lineTo(P.dx0+4+j,P.dy0-1);ctx.moveTo(P.dx0+4+j,P.dy0-4);ctx.lineTo(P.dx0+1+j,P.dy0-1);ctx.stroke();
      return}
    const k=Math.min(1,(d-.12)/.25);
    ctx.strokeStyle=FG;ctx.lineWidth=3*(1-k);if(k<1){ctx.beginPath();ctx.arc(P.dx0,P.dy0,16+k*40,0,6.2832);ctx.stroke()}
    ctx.fillStyle=FG;
    for(const s of shards){if(d<s.d)continue;ctx.beginPath();
      if(s.stuck)ctx.ellipse(s.x,s.y,s.r*1.5,s.r*.6,0,0,6.2832);else ctx.ellipse(s.x,s.y,s.r,s.r*(1+Math.min(.8,Math.abs(s.vy)/900)),0,0,6.2832);ctx.fill()}
    return;
  }
  if(P.rollT>0&&state==='play'){drawBlob(true);return}
  if(P.ride&&state==='play'){drawRide();return}
  let h,len=CL,base,sk=.85;
  const moving=Math.abs(P.vx)>15;
  if(state==='win'){const k=Math.min(1,P.win/.3);h=9*(1-k);len=CL*(1-k*.9);if(k>=1)return}
  else if(P.ground){
    // walking like an inchworm: the hump bunches up and stretches out, its peak rolls from back to front, leaning into the run
    const ph=P.walk*6.2832,sp=Math.min(1,Math.abs(P.vx)/SPEED);
    h=moving?8.5+2.4*Math.sin(ph):8+.6*Math.sin(t*3);
    sk=moving?Math.max(.65,1+.2*sp+.28*Math.cos(ph)):.85;
    if(P.squash>0)h*=1-P.squash*2.2;
    len=CL+(8-h)*.6+(moving?3.6*Math.cos(ph):0);
  }else{drawBlob();return}
  // after a gravity switch the hump swings through the line to the other side
  const side=P.flipT>0?P.g*(1-2*P.flipT/.25):P.g;
  h*=side;
  const on=P.ground&&P.on?P.on:null;
  let x0=P.x-len/2,x1=P.x+len/2;
  if(on){
    // keep the hump off vertical bits of the line: stop at a wall, only cut the line where it runs on smoothly
    const sp=lineSpan(on,P.x,Math.ceil(len/2)+1);x0=Math.max(x0,sp.wl);x1=Math.min(x1,sp.wr);
    const sk=on.sand?Math.min(1,P.sink||0)*6*P.g:0;   // sinking into sand
    base=px=>{const f=floorAt(on,Math.max(sp.el,Math.min(sp.er,px)));return (f===null?P.y:f)+sk*Math.sin(Math.PI*Math.max(0,Math.min(1,(px-x0)/(x1-x0))))};
    strokeAlong(on,Math.max(x0,sp.el),Math.min(x1,sp.er),BG,LW+3);
  }else base=()=>P.y;
  const pts=humpPts(x0,x1,base,h,P.face,sk);
  ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts,false);
  if(Math.abs(h)>4){const e=pts[P.face>0?8:4],bl=(t%3.3)<.13;ctx.fillStyle=BG;ctx.beginPath();if(bl)ctx.ellipse(e[0],e[1]+3*Math.sign(h),1.9,.5,0,0,6.2832);else ctx.arc(e[0],e[1]+3*Math.sign(h),1.7,0,6.2832);ctx.fill()}
}
// a shark under the line: just the fin, or (when you fly over it) its head with the jaws wide open
function drawShark(k){
  const g=k.g,x=k.pos,y=k.y,r=k.rise;
  if(r<.15){
    const b=k.dir;   // the fin: curved front edge, sweeps back to a point, steep back edge
    strokeAlong(k.p,Math.min(x-b*7,x+b*12),Math.max(x-b*7,x+b*12),BG,LW+3);
    ctx.strokeStyle=FG;ctx.lineWidth=LW;

    ctx.beginPath();ctx.ellipse(-12.8,V(21.5),1.5,1.5,0,0,6.2832);ctx.fill()}

}

// level 42's robot: a little stack of floating parts (three boxes and a round head) hovering over the line next to the door

// riding through a gravity switch: you become a little ring threaded on the line and run along the figure eight
const RIDE=.24;
function drawRide(){
  // you run along the figure eight as a thick little bump in the line itself, then pop out on the other side
  const r=P.ride,f=r.f,a=15,sy=2.3*Math.cos(t*2.6),k=r.t/RIDE,g=P.g,dir=r.dir;
  const path=u=>{const d=1+Math.sin(u)**2;return[f.x+a*Math.cos(u)/d,f.y+sy*a*Math.sin(u)*Math.cos(u)/d]};
  const u0=dir>0?Math.PI:2*Math.PI,q=Math.min(1,k),e=q*q*(3-2*q),u=u0+dir*Math.PI*e,L=.75*Math.sin(Math.PI*Math.min(1,k*1.3+.15))+.15;
  const pts=[];for(let i=0;i<=10;i++)pts.push(path(u+dir*L*(i/10-.6)));
  ctx.strokeStyle=FG;ctx.lineCap='round';ctx.lineWidth=LW+5;strokePts(pts,false);ctx.lineWidth=LW;
  const hd=pts[8];ctx.fillStyle=BG;ctx.beginPath();ctx.arc(hd[0],hd[1],1.6,0,6.2832);ctx.fill();
}
function drawArrows(){
  // moving screen: little arrows at the left edge, they pulse and get stronger when it's about to catch you
  if(scrollX!==null&&(state==='play'||state==='rescue')){const near=Math.max(0,Math.min(1,1-(P.x-camX)/(viewW*.35)));
    ctx.strokeStyle=FG;ctx.lineWidth=3;
    for(let i=0;i<3;i++){const y=camY+VIEW_H*(.3+.2*i),x=camX+12+((t*1.6+i*.33)%1)*8;
      ctx.globalAlpha=(.18+.5*near)*(.75+.25*Math.sin(t*(4+8*near)));ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x+7,y);ctx.lineTo(x,y+7);ctx.stroke()}
    ctx.globalAlpha=1}
}
// dark levels: everything is black except a small flickering light around you
const darkCv=document.createElement('canvas'),dctx=darkCv.getContext('2d');let lightX=0,lightY=0;
function drawDark(){
  if(state==='menu')return;
  if(state==='play'||state==='rescue'||state==='win'){lightX=P.x;lightY=P.y-P.g*10}
  if(darkCv.width!==cv.width||darkCv.height!==cv.height){darkCv.width=cv.width;darkCv.height=cv.height}
  const a=state==='win'?Math.max(0,1-P.win/.5):1;if(a<=0)return;
  dctx.setTransform(1,0,0,1,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,darkCv.width,darkCv.height);
  dctx.globalAlpha=a;dctx.fillStyle=BG;dctx.fillRect(0,0,darkCv.width,darkCv.height);dctx.globalAlpha=1;
  dctx.setTransform(ctx.getTransform());dctx.globalCompositeOperation='destination-out';
  const R=150*(1+.025*Math.sin(t*9)+.015*Math.sin(t*23)),gr=dctx.createRadialGradient(lightX,lightY,0,lightX,lightY,R);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.55,'rgba(0,0,0,.95)');gr.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=gr;dctx.fillRect(lightX-R,lightY-R,R*2,R*2);
  const m=ctx.getTransform();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(darkCv,0,0);ctx.setTransform(m);
}
function render(){
  const k=DPR*K;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width,cv.height);
  if(!goal)return;
  if(state==='done'){ctx.fillStyle=FG;ctx.fillRect(0,0,cv.width,cv.height);return}
  // camera: a bit ahead of where you run
  if(!NOCAM&&(state==='play'||state==='win'||state==='rescue')){
    const tx=P.x-viewW*.38+P.vx*.35,ty=P.y-VIEW_H*(P.g>0?.6:.4);
    camX+=(tx-camX)*.08;camY+=(ty-camY)*.06;
    if(scrollX!==null){scrollX=Math.max(scrollX,Math.min(camX,P.x-viewW*.38));camX=Math.max(camX,scrollX)}   // run ahead and it carries on from where you are
  }
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake*30;sy=(Math.random()-.5)*shake*30}

  ctx.lineCap='round';ctx.lineJoin='round';
  // building up: the line draws itself in from the left
  const building=state!=='menu'&&BT<BUILD_LINE;ctx.save();if(building){const q=Math.min(1,BT/BUILD_LINE),e=1-Math.pow(1-q,2.2);ctx.beginPath();ctx.rect(camX-60,camY-2000,(viewW+120)*e,4000);ctx.clip()}

  for(const p of plats){const q=p.pts;if(q[q.length-1][0]+p.ox<vx0||q[0][0]+p.ox>vx1)continue;
    if(p.sand){drawSand(p);continue}
    ctx.beginPath();q.forEach(([x,y],i)=>i?ctx.lineTo(x+p.ox,y+p.oy):ctx.moveTo(x+p.ox,y+p.oy));ctx.stroke()}

  for(const p of plats){if(!p.cr)continue;const [a,b]=p.pts,y=a[1]+p.oy;if(b[0]<vx0||a[0]>vx1)continue;
    ctx.beginPath();ctx.moveTo(a[0]+1,y);ctx.lineTo(a[0]+3,y+5);ctx.moveTo(b[0]-1,y);ctx.lineTo(b[0]-3,y+5);ctx.stroke();
    if(p.cr.t>.25){const m=(a[0]+b[0])/2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m-3,y+2);ctx.lineTo(m,y+7);ctx.lineTo(m+3,y+3);ctx.stroke();ctx.lineWidth=LW}}

    ctx.strokeStyle=BG;ctx.lineWidth=LW+3;ctx.lineCap="butt";ctx.beginPath();ctx.moveTo(s.x0,s.y);ctx.lineTo(s.x1,s.y);ctx.stroke();ctx.lineCap="round";
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.moveTo(s.x0,s.y);

    strokeAlong(f.p,f.x-a,f.x+a,BG,LW+3);

  if(endFlip&&endFlip.x>vx0&&endFlip.x<vx1){const f=endFlip,r=5+.6*Math.sin(t*4);   // the line ends in a little ring
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.arc(f.x+r,f.y,r,0,6.2832);ctx.stroke()}
  for(const b of birds){if(b.x<vx0-20||b.x>vx1+20||b.by<camY-60)continue;drawBird(b)}
  for(const z of zaps){if(z.x1<vx0||z.x0>vx1)continue;
    // the spark: the line goes jagged where it is, with little arcs jumping off
    const x=z.pos,w=12;strokeAlong(z.p,x-w,x+w,BG,LW+3);
    ctx.strokeStyle=FG;ctx.lineWidth=LW*.85;ctx.lineJoin='miter';ctx.beginPath();ctx.moveTo(x-w,z.y);
    for(let i=1;i<6;i++)ctx.lineTo(x-w+i*w/3,z.y+(i%2?-1:1)*(4+Math.random()*5));ctx.lineTo(x+w,z.y);ctx.stroke();ctx.lineJoin='round';
    ctx.lineWidth=1.8;for(let i=0;i<3;i++){const a=Math.random()*6.2832,r=8+Math.random()*9;ctx.beginPath();ctx.moveTo(x,z.y);ctx.lineTo(x+Math.cos(a)*r*.5+(Math.random()-.5)*4,z.y+Math.sin(a)*r*.5);ctx.lineTo(x+Math.cos(a)*r,z.y+Math.sin(a)*r);ctx.stroke()}}
  for(const k of sharks)if(k.x1>vx0&&k.x0<vx1)drawShark(k);
  for(const W of pools){if(W.x1<vx0||W.x0>vx1)continue;
    const wave=x=>W.y+1.6*Math.sin(x*.09+t*3+W.ph)*Math.min(1,(x-W.x0)/10,(W.x1-x)/10);
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();for(let x=W.x0;x<=W.x1;x+=3)x===W.x0?ctx.moveTo(x,wave(x)):ctx.lineTo(x,wave(x));ctx.lineTo(W.x1,W.y);ctx.stroke();
    ctx.lineWidth=2;for(const [dd,al] of[[26,.28],[52,.16],[78,.08]]){ctx.globalAlpha=al;ctx.beginPath();for(let x=W.x0+8;x<=W.x1-8;x+=4){const y=W.y+dd+1.5*Math.sin(x*.07-t*2+dd);x===W.x0+8?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=1}
  ctx.strokeStyle=FG;ctx.lineWidth=1.6;for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.2832);ctx.stroke()}
  for(const k of ghosts){if(k.x<vx0-30||k.x>vx1+30)continue;drawGhost(k)}
  for(const e of eyes){if(state==='dead'&&P.kind==='eaten'&&P.eat===e)continue;const [ex,ey]=eyePos(e);if(ex<vx0||ex>vx1)continue;
    drawEyes(ex,ey,e.g,1,[P.x,P.y-P.g*9],((t+e.blink)%4.1)<.12?1:0)}
  // ripples running along the line away from where you landed
  for(const r of ripples){const life=r.life||.6,amp=r.a*(1-r.t/life),w=r.w||16;if(amp<.3)continue;r.gone=r.gone||{};
    for(const sd of[-1,1]){if(r.gone[sd])continue;const xc=r.x+r.p.ox+sd*(18+r.t*(r.sp||170)),x0=xc-w/2,pts=[];let ok=true;
      for(let i=0;i<=10;i++){const u=i/10,x=x0+u*w,f=floorAt(r.p,x);if(f===null||(i&&Math.abs(f-pts[i-1][2])>4)){ok=false;break}pts.push([x,f-r.g*amp*Math.sin(Math.PI*u)**2,f])}
      if(!ok){r.gone[sd]=1;continue}   // a step, a corner or the end of the line: this side of the wave runs out there
      strokeAlong(r.p,x0,x0+w,BG,LW+3);ctx.strokeStyle=FG;ctx.lineWidth=LW;strokePts(pts.map(q=>[q[0],q[1]]),false)}}
  // holes left behind by a jump, closing up
  for(const h of holes){const w=CL*(1-Math.pow(h.t/.5,2));if(w<1)continue;const o=h.p.ox,x=h.x+o;strokeAlong(h.p,Math.max(x-w/2,h.l+o),Math.min(x+w/2,h.r+o),BG,LW+3)}

    let lift=0,lean=0;if(state==='play'&&P.ground&&P.g===g&&!(P.rollT>0)){const d=(x-P.x)/CL+.5;if(d>0&&d<1){lift=9*Math.pow(Math.sin(Math.PI*d),1.4);lean=-Math.cos(Math.PI*d)*.5}}

    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x,y-g*12,x+sw,y-g*(25-r));ctx.stroke();

  for(const s of sparks){if(s.x<vx0||s.x>vx1)continue;
    if(!s.got){ctx.fillStyle=FG;ctx.beginPath();ctx.arc(s.x,s.y+Math.sin(t*2.6+s.x)*3,5,0,6.2832);ctx.fill()}
    else if(s.pop<.5){ctx.strokeStyle=FG;ctx.lineWidth=2;ctx.globalAlpha=1-s.pop*2;ctx.beginPath();ctx.arc(s.x,s.y,5+s.pop*40,0,6.2832);ctx.stroke();ctx.globalAlpha=1}}
  if(robot&&robot.x>vx0-60&&robot.x<vx1+60)drawRobot(robot);
  // the door at the end (and the secret one down in the abyss): walk in, it lights up and its colour floods the screen
  for(const D of[goal,secret]){if(!D||D.x<vx0-40||D.x>vx1+40)continue;
    const gx=D.x,gy=D.y,dw=13,dh=42,mine=state==='win'&&(winDoor||goal)===D,lit=mine?Math.min(1,P.win/.3):0;
    strokeAlong(D.p,gx-dw,gx+dw,BG,LW+3);   // no line under the door: it's an opening
    if(lit>0){ctx.fillStyle=FG;ctx.fillRect(gx-dw,gy-dh*lit,dw*2,dh*lit)}
    ctx.strokeStyle=FG;ctx.lineWidth=LW;ctx.beginPath();ctx.moveTo(gx-dw,gy);ctx.lineTo(gx-dw,gy-dh);ctx.lineTo(gx+dw,gy-dh);ctx.lineTo(gx+dw,gy);ctx.stroke();
    if(lit<1){ctx.fillStyle=FG;ctx.beginPath();ctx.arc(gx+dw-5,gy-dh*.45,2,0,6.2832);ctx.fill()}
    if(mine&&P.win>.3){const k=Math.min(1,(P.win-.3)/.8),e=k*k*(3-2*k);
      ctx.fillStyle=FG;ctx.beginPath();ctx.arc(gx,gy-dh/2,8+e*(viewW+VIEW_H)*1.3,0,6.2832);ctx.fill()}}
  for(const q of pops){ctx.strokeStyle=FG;ctx.lineWidth=2;ctx.globalAlpha=1-q.t/.6;ctx.beginPath();if(q.ring)ctx.ellipse(q.x,q.y,6+q.t*55,1.5+q.t*9,0,0,6.2832);else ctx.arc(q.x,q.y,q.s?2+(q.t-.3)*30:8+q.t*70,0,6.2832);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle=FG;for(const q of sandParts){if(q.x<vx0||q.x>vx1)continue;ctx.globalAlpha=1-q.t/.7;ctx.fillRect(q.x-.9,q.y-.9,1.8,1.8)}ctx.globalAlpha=1;
  ctx.strokeStyle=FG;ctx.lineWidth=LW;for(const d of drops){ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*.85,d.r*(1+Math.min(.5,Math.abs(d.vy)/1600)),0,0,6.2832);ctx.stroke()}
  if(rescue){const r=rescue,a=r.t>2.3?Math.max(0,1-(r.t-2.3)/.3):1,gc=r.t>1.1?r.to.g:P.g;ctx.globalAlpha=a;ctx.strokeStyle=FG;ctx.lineJoin='round';ctx.lineCap='round';
    const x=r.cx,y=r.cy;
    // the fishing line with a hook at the end
    if(r.len>2){ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x,y+gc*6);ctx.quadraticCurveTo((x+r.hx)/2+3,(y+r.hy)/2,r.hx,r.hy);ctx.stroke();
      ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(r.hx,r.hy);ctx.lineTo(r.hx,r.hy+gc*7);ctx.arc(r.hx-3,r.hy+gc*7,3,0,Math.PI,gc<0);ctx.lineTo(r.hx-6,r.hy+gc*5);ctx.stroke()}
    // a little cloud: bumps on top, flat underneath
    ctx.lineWidth=LW;ctx.save();ctx.translate(x,y);ctx.scale(1,gc>0?1:-1);ctx.beginPath();ctx.moveTo(-22,6);ctx.arc(-14,0,8,Math.PI*.75,Math.PI*1.5);ctx.arc(-2,-5,10,Math.PI*1.15,Math.PI*1.9);ctx.arc(12,-1,8,Math.PI*1.4,Math.PI*.2);ctx.lineTo(20,6);ctx.closePath();ctx.stroke();ctx.restore();
    ctx.lineWidth=2;for(let i=0;i<3;i++){const px=x-(r.t<.5?1:(r.to.x>r.fx?1:-1))*(26+i*9),pa=(t*3+i)%1;ctx.globalAlpha=a*(1-pa)*.6;ctx.beginPath();ctx.arc(px,y+3,2+pa*3,0,6.2832);ctx.stroke()}ctx.globalAlpha=1}
  if(state!=='menu'&&state!=='build')drawChar();
  if(DARK){ctx.setTransform(k,0,0,k,-(camX+sx)*k,-(camY+sy)*k);drawDark();drawArrows()}   // the dark covers everything, the door too
  ctx.restore();
  // screen space: a white flash when you get zapped
  if(flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=Math.min(.85,flash*3);ctx.fillStyle=FG;ctx.fillRect(0,0,cv.width,cv.height);ctx.globalAlpha=1}
  // screen space: joystick and first-level hints
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // blood running down the whole screen, in the line colour
  if(curtain){const c=curtain,a=c.t<1.35?1:Math.max(0,1-(c.t-1.35)/.5);
    ctx.globalAlpha=a;ctx.fillStyle=FG;
    // the band at the top sinks until the whole screen is covered; the runs hang from it with round ends,
    // and where a run meets the band the corner is filled in smoothly, like a thick liquid
    const e=Math.max(0,Math.min(1,(c.t-.05)/1.1)),B=Math.min(1,c.t/.15)*SH*.09+(SH+80)*e*e*(1.35-.35*e);
    const len=d=>{const tt=Math.max(0,c.t-d.dl);return SH*d.v*(tt*1.4+tt*tt*1.2)};
    // the lower edge: each run hangs down with a round end; the gaps between runs are round arches (like in the drawing)
    const D=c.drips,Ls=D.map(len);
    const edge=x=>{
      for(let i=0;i<D.length;i++){const d=D[i],r=d.w/2,u=(x-d.x)/r;if(Math.abs(u)<1)return Ls[i]>r?B+Ls[i]-r*(1-Math.sqrt(1-u*u)):B+Ls[i]*Math.sqrt(1-u*u)}
      let i=0;while(i<D.length&&D[i].x<x)i++;
      const a=D[i-1],b=D[i],xl=a?a.x+a.w/2:-60,xr=b?b.x-b.w/2:SW+60,half=(xr-xl)/2;
      const R=Math.min(half,Math.max(0,Math.min(a?Ls[i-1]-a.w/2:1e9,b?Ls[i]-b.w/2:1e9)));
      const v=(x-(xl+xr)/2)/half;return B+R*(1-Math.sqrt(Math.max(0,1-v*v)))};
    ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(SW+5,0);for(let x=SW+5;x>=-5;x-=3)ctx.lineTo(x,edge(x));ctx.closePath();ctx.fill();
    // round drops that let go of the long runs and fall
    for(const d of c.drips){if(!d.drop)continue;const L=len(d);if(L<SH*.3)continue;const q=d.drop;q.v+=dtFrame*1500;q.off+=q.v*dtFrame;
      const y=B+L+d.w*.35+q.off;if(y<SH+d.w){ctx.beginPath();ctx.arc(d.x+d.w*.05,y,d.w*.28,0,6.2832);ctx.fill()}}
    ctx.globalAlpha=1}
  if(skullFx&&skullFx.t>0){const k=skullFx.t,pop=Math.min(1,k/.25),g=skullFx.gone||0,sc=(1.35-.35*pop)*Math.min(SH,SW)/300;
    // on the blood it's cut out in the background colour, once the blood is gone it's drawn in the line colour
    const ca=curtain?(curtain.t<1.35?1:Math.max(0,1-(curtain.t-1.35)/.5)):0;
    for(const [col,al] of[[BG,ca],[FG,1-ca]]){if(al<=.01)continue;
      ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.translate(SW/2,SH*.42-g*12);ctx.scale(sc*(1+g*.15),sc*(1+g*.15));
      ctx.globalAlpha=al*pop*(1-g);if(g>0)ctx.filter='blur('+(g*9).toFixed(1)+'px)';
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4.5;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(-20,22);ctx.bezierCurveTo(-36,14,-40,-6,-38,-18);ctx.bezierCurveTo(-35,-44,-14,-52,0,-52);ctx.bezierCurveTo(14,-52,35,-44,38,-18);ctx.bezierCurveTo(40,-6,36,14,20,22);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-20,22);ctx.lineTo(-18,36);ctx.lineTo(18,36);ctx.lineTo(20,22);ctx.stroke();
      for(const x of[-9,0,9]){ctx.beginPath();ctx.moveTo(x,26);ctx.lineTo(x,36);ctx.stroke()}
      for(const sx of[-1,1]){ctx.beginPath();ctx.ellipse(sx*15,-12,9,10.5,0,0,6.2832);ctx.fill()}
      for(const nx of[-3,3]){ctx.beginPath();ctx.ellipse(nx,6,2.2,3.6,nx*.06,0,6.2832);ctx.fill()}   // two nose holes
      ctx.restore()}}
  if(joy.id!==null&&state==='play'){
    ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2;ctx.globalAlpha=.35;
    ctx.beginPath();ctx.arc(joy.ox,joy.oy,JR,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.moveTo(joy.ox-JR-10,joy.oy);ctx.lineTo(joy.ox-JR-4,joy.oy-5);ctx.lineTo(joy.ox-JR-4,joy.oy+5);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(joy.ox+JR+10,joy.oy);ctx.lineTo(joy.ox+JR+4,joy.oy-5);ctx.lineTo(joy.ox+JR+4,joy.oy+5);ctx.closePath();ctx.fill();
    ctx.globalAlpha=.6;const kx=Math.max(-JR,Math.min(JR,joy.x-joy.ox));ctx.beginPath();ctx.arc(joy.ox+kx,joy.oy,17,0,6.2832);ctx.fill();ctx.globalAlpha=1;
  }
  // nobody touched the screen at the start: show the controls (a joystick moving left/right, a tap button)
  if(state==='play'&&!touchedEarly&&lvTime>1.2&&(!hintMoved||!hintJumped)){
    const fade=Math.min(1,(lvTime-1.2)/.4),y=SH*.72;
    ctx.strokeStyle=FG;ctx.fillStyle=FG;ctx.lineWidth=2;
    if(!hintMoved&&joy.id===null){const x=Math.max(90,SW*.18),kx=Math.sin(t*2.6)*JR*.75;
      ctx.globalAlpha=.35*fade;ctx.beginPath();ctx.arc(x,y,JR,0,6.2832);ctx.stroke();
      for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(x+s*(JR+10),y);ctx.lineTo(x+s*(JR+4),y-5);ctx.lineTo(x+s*(JR+4),y+5);ctx.closePath();ctx.fill()}
      ctx.globalAlpha=.6*fade;ctx.beginPath();ctx.arc(x+kx,y,17,0,6.2832);ctx.fill()}
    if(!hintJumped){const x=Math.min(SW-90,SW*.82),ph=(t*1.1)%1;
      ctx.globalAlpha=.35*fade;ctx.beginPath();ctx.arc(x,y,24,0,6.2832);ctx.stroke();
      ctx.globalAlpha=.6*fade*(ph<.15?1:.55);ctx.beginPath();ctx.arc(x,y,ph<.15?13:11,0,6.2832);ctx.fill();
      ctx.globalAlpha=.45*fade*(1-ph);ctx.beginPath();ctx.arc(x,y,24+ph*26,0,6.2832);ctx.stroke()}
    ctx.globalAlpha=1;
  }
}

/* ---------- loop ---------- */
// the same picture in swapped colours, laid over the normal one (fully after a death, fading out as you start moving)
const invCv=document.createElement('canvas'),ictx=invCv.getContext('2d');
function renderInverted(){
  if(invCv.width!==cv.width||invCv.height!==cv.height){invCv.width=cv.width;invCv.height=cv.height}
  const m=ctx,d=dtFrame,b=BG;ctx=ictx;BG=FG;FG=b;dtFrame=0;NOCAM=true;
  try{render()}finally{ctx=m;FG=BG;BG=b;dtFrame=d;NOCAM=false}
  const k=INV*INV*(3-2*INV);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=k;ctx.drawImage(invCv,0,0);ctx.restore();
}
let lastT=performance.now(),accT=0;
function frame(now){
  let dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(state==='menu'){t+=dt;for(const p of plats)if(p.mv)p.ox=p.mv.amp*Math.sin(t*6.2832/p.mv.per+p.mv.ph);camX+=dt*30;if(goal&&camX>goal.x)camX=-viewW*.3;}
  else if(state!=='paused'&&state!=='done'){accT+=dt;try{while(accT>=1/120){update(1/120);accT-=1/120}}catch(e){console.error(e);accT=0}}
  dtFrame=state==='paused'?0:dt;
  if(curtain&&state!=='paused'){curtain.t+=dt;if(curtain.t>1.9)curtain=null}
  if(shake>0)shake=Math.max(0,shake-dt);
  if(skullFx&&state!=='paused'){skullFx.t+=dt;
    if(state==='play'&&!P.intro&&skullFx.t>0&&(Math.abs(P.vx)>8||!P.ground))skullFx.go=1;   // you start moving: it blurs and fades
    if(skullFx.go){skullFx.gone+=dt/.9;if(skullFx.gone>=1)skullFx=null}}
  if(INV>0&&state!=='paused'){if(state==='play'&&!P.intro&&(Math.abs(P.vx)>8||!P.ground))INVgo=true;if(INVgo)INV=Math.max(0,INV-dt/.6)}
  if((INV>.5)!==invCss){invCss=INV>.5;const r=document.documentElement.style;r.setProperty('--bg',invCss?FG:BG);r.setProperty('--fg',invCss?BG:FG)}
  try{render();if(INV>0)renderInverted()}catch(e){console.error(e)}   // a drawing mistake must never freeze the game
  requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
const startOv=$('startOv'),pauseOv=$('pauseOv'),doneOv=$('doneOv'),hud=$('hud');
let sel=Math.min(unlocked,store.get('line.last',unlocked)|0||1);
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const HEART='M10 16.5C4 12.4 1.5 9.4 1.5 6.2 1.5 3.6 3.5 1.8 5.8 1.8c1.8 0 3.2 1 4.2 2.6 1-1.6 2.4-2.6 4.2-2.6 2.3 0 4.3 1.8 4.3 4.4 0 3.2-2.5 6.2-8.5 10.3Z';
const LIFE='<svg viewBox="0 0 20 18"><path d="'+HEART+'"/></svg>';
const HALF='<svg class="half" viewBox="0 0 20 18"><defs><clipPath id="hl"><rect width="10" height="18"/></clipPath></defs><path d="'+HEART+'" style="fill:none"/><path d="'+HEART+'" clip-path="url(#hl)"/></svg>';
function updateHud(){
  $('lvChip').textContent=T.level+' '+levelN;
  [...$('dots').children].forEach((el,i)=>el.classList.toggle('on',!!(sparks[i]&&sparks[i].got)));
  const left=3-falls;$('lives').innerHTML=[0,1,2].map(i=>i===left-1&&P.half?HALF:LIFE.replace('<svg','<svg class="'+(i<left?'':'lost')+'"')).join('');
}
// a generous time for the level: running it at a relaxed pace, plus time to wait for bridges and eyes
function parTime(){return goal.x/205*1.5+3*(plats.filter(p=>p.mv).length+eyes.length)+6}
function totalStars(){let s=0;for(const k in bestStars)s+=bestStars[k];return s}
function paintTotals(){const h=STAR.replace('class="st"','class="st on"')+' '+fmtStars(totalStars())+' / '+unlocked*3;$('totalStars').innerHTML=h;$('totalStars2').innerHTML=h}
function levelColours(n){const h=(200+(n-1)*47)%360,c=n%8===0&&n>=16?['#161616','#d2d2d2']:[hslHex(h,36,19),hslHex(h,72,77)];return n===42?c.reverse():c}
function showLevels(){
  state='menu';hud.hidden=true;startOv.hidden=pauseOv.hidden=doneOv.hidden=true;$('levelsOv').hidden=false;
  setTheme(levelN||1);paintTotals();
  const grid=$('grid');grid.innerHTML='';
  for(let i=1;i<=unlocked+3;i++){const b=document.createElement('button');b.type='button';b.className='tile'+(i===unlocked?' cur':'');
    const [bg,fg]=levelColours(i);b.style.setProperty('--tb',bg);b.style.setProperty('--tf',fg);
    b.innerHTML='<b>'+i+'</b><span class="stars">'+starsHtml(bestStars[i]||0)+'</span>';
    if(i>unlocked)b.disabled=true;else b.onclick=()=>{$('levelsOv').hidden=true;play(i)};grid.append(b)}
  const cur=grid.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});
}
function preview(){setTheme(sel);gen(sel);levelN=sel;camX=-viewW*.3;camY=-VIEW_H*.6;t=0}
function showMenu(){state='menu';hud.hidden=true;pauseOv.hidden=doneOv.hidden=true;$('levelsOv').hidden=true;startOv.hidden=false;sel=unlocked;paintTotals();preview()}
function play(n){goLandscape();audio();store.set('line.last',n);startOv.hidden=doneOv.hidden=pauseOv.hidden=true;$('levelsOv').hidden=true;hud.hidden=false;joy.id=null;startLevel(n);state='build';BT=0;lastT=performance.now();accT=0}
let toastT=0;function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function pause(){if(state!=='play'&&state!=='dead')return;state='paused';joy.id=null;pauseOv.hidden=false}
function resume(){pauseOv.hidden=true;state='play';lastT=performance.now();accT=0}
function levelDone(){
  if(state!=='win')return;state='done';
  const r=document.documentElement.style;r.setProperty('--bg',FG);r.setProperty('--fg',BG);
  document.querySelector('meta[name=theme-color]').setAttribute('content',FG);
  const got=sparks.filter(s=>s.got).length;
  if(levelN+1>unlocked){unlocked=levelN+1;store.set('line.unlocked',unlocked)}
  if(got>(bestDots[levelN]||0)){bestDots[levelN]=got;store.set('line.dots',bestDots)}
  // stars, in quarters: 1 for making it, up to 1 for the dots (all three = a full star),
  // up to 1 for not falling (one fall = half, two = a quarter), and a gentle cut if you were very slow
  const par=parTime(),slow=lvTime>par*2?.75:lvTime>par*1.5?.5:lvTime>par?.25:0;
  const stars=Math.max(.5,1+[0,.25,.5,1][got]+[1,.5,.25,0][Math.min(3,falls)]-slow);
  if(stars>(bestStars[levelN]||0)){bestStars[levelN]=stars;store.set('line.stars',bestStars)}
  $('doneStars').innerHTML=starsHtml(stars);
  $('doneWhy').textContent=stars>=3?T.s3:[got<3?T.sDots:'',falls>0?T.sFalls:'',slow?T.sTime:''].filter(Boolean).join(' · ');
  $('doneTitle').textContent=T.level+' '+levelN;
  [...$('doneDots').children].forEach((el,i)=>el.classList.toggle('on',i<got));
  $('doneTime').textContent=fmt(lvTime);$('doneFalls').textContent=falls;
  hud.hidden=true;doneOv.hidden=false;$('nextBtn').focus({preventScroll:true});
}
$('playBtn').onclick=()=>play(unlocked);
$('levelsBtn').onclick=$('levelsBtn2').onclick=$('levelsBtn3').onclick=showLevels;
$('backBtn').onclick=showMenu;
$('homeBtn2').onclick=showMenu;
$('pauseBtn').onclick=pause;
function paintSnd(){$('sndBtn').setAttribute('aria-pressed',soundOn);$('musBtn').setAttribute('aria-pressed',MUS.on)}
$('musBtn').onclick=()=>{MUS.on=!MUS.on;store.set('line.music',MUS.on);paintSnd();if(MUS.on)audio()};
$('sndBtn').onclick=()=>{soundOn=!soundOn;store.set('line.sound',soundOn);paintSnd();if(soundOn)sfx.dot()};
paintSnd();
$('resumeBtn').onclick=resume;
$('restartBtn').onclick=()=>play(levelN);
$('menuBtn').onclick=()=>{sel=levelN;showMenu()};
$('nextBtn').onclick=()=>{sel=levelN+1;play(sel)};
$('againBtn').onclick=()=>play(levelN);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('kidsBtn').setAttribute('aria-pressed',KIDS);
$('kidsBtn').onclick=()=>{KIDS=!KIDS;store.set('line.kids',KIDS);$('kidsBtn').setAttribute('aria-pressed',KIDS);toast(KIDS?T.kidsOn:T.kidsOff)};
/* ---------- share with friends: the phone's share sheet, otherwise copy the link ---------- */
const SHARE_URL='https://diemmarkus.github.io/maze/line/';
$('shareBtn').onclick=async()=>{
  const data={title:'The Line',text:T.shareText,url:SHARE_URL};
  if(navigator.share){try{await navigator.share(data)}catch(_){}return}
  try{await navigator.clipboard.writeText(T.shareText+' '+SHARE_URL);toast(T.copied)}
  catch(_){location.href='https://wa.me/?text='+encodeURIComponent(T.shareText+' '+SHARE_URL)}
};
/* ---------- install as an app ---------- */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let installEv=null;
const standalone=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;$('installBtn').hidden=false});
addEventListener('appinstalled',()=>{installEv=null;$('installBtn').hidden=true});
$('installBtn').onclick=async()=>{if(!installEv)return;installEv.prompt();try{await installEv.userChoice}catch(_){}installEv=null;$('installBtn').hidden=true};
// iPhone/iPad: no install button there, so a one-line hint (only in Safari, only if not installed yet)
if(!standalone&&/iP(hone|ad|od)/.test(navigator.userAgent)){$('iosHint').hidden=false;$('iosHint').textContent=T.ios}

{let want='de';try{const s=localStorage.getItem('irrgarten.lang');if(LANG[s])want=s;else{const n=(navigator.language||'de').slice(0,2);if(LANG[n])want=n}}catch(_){}setLang(want)}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
