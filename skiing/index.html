<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3E8EDE">
<title>Skiing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-screen pixel canvas (rendered at low resolution, scaled up crisp), pixel HUD on top, overlay cards for menu and results. */
:root{
  --ink:#1B1F3B; --sky:#3E8EDE; --snow:#F4FAFF; --pop:#E83B3B; --gold:#FFD23F; --orange:#FF9A2E;
  --cpu:#A9D4F5; --white:#FFFFFF;
  --pix:"Press Start 2P",ui-monospace,monospace;
  --body:"Pixelify Sans","Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.chip{font-family:var(--pix);font-size:11px;line-height:1;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.warn{background:var(--pop);color:var(--white);animation:blink .35s steps(2) infinite}
@keyframes blink{50%{background:var(--gold);color:var(--ink)}}
.track{position:relative;flex:1;height:12px;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;background:conic-gradient(var(--ink) 25%,var(--white) 0 50%,var(--ink) 0 75%,var(--white) 0) 0 0/6px 6px}
.dot{position:absolute;top:50%;width:10px;height:10px;margin:-7px 0 0 -7px;border:2px solid var(--ink);left:0}
#dotMe{background:var(--pop);z-index:2}
#dotAi{background:var(--cpu)}
.legend{display:flex;gap:12px;font-family:var(--pix);font-size:9px;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 7px;width:max-content}
.legend i{display:inline-block;width:8px;height:8px;border:2px solid var(--ink);margin-right:5px;vertical-align:-2px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(27,31,59,.28)}
.card{box-sizing:border-box;width:min(350px,100%);max-height:100%;overflow-y:auto;background:var(--white);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px 18px 16px;text-align:center}
.card h1{font-family:var(--pix);font-size:30px;line-height:1.15;margin:4px 0 12px;color:var(--pop);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
#winOv h1,.card h1.good{color:var(--gold)}
.card p{margin:6px 0;font-size:17px;line-height:1.3}
.card ul{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:15px;line-height:1.3;display:grid;gap:6px}
.card li{padding-left:18px;position:relative}
.card li::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.card li.g::before{background:var(--gold)} .card li.o::before{background:var(--orange)} .card li.r::before{background:var(--pop)} .card li.b::before{background:var(--cpu)} .card li.c::before{background:#5CC8EA}
.btn{font-family:var(--pix);font-size:15px;line-height:1.2;background:var(--gold);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px;cursor:pointer;margin-top:10px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.lv button:focus-visible,.langs button:focus-visible,.home:focus-visible{outline:3px dashed var(--pop);outline-offset:3px}
.btn.alt{background:var(--white);font-size:12px;padding:9px 12px;box-shadow:3px 3px 0 var(--ink)}
.lvls{margin:10px 0 2px}
.lvls>span{display:block;font-family:var(--pix);font-size:10px;margin-bottom:6px}
.lv{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-height:84px;overflow-y:auto;padding:2px 4px 4px 2px}
.lv button{font-family:var(--pix);font-size:11px;width:34px;height:30px;padding:0;background:var(--white);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--pop);color:var(--white)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
.modes button{font-family:var(--pix);font-size:11px;background:var(--white);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 4px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold)}
.modes button:focus-visible{outline:3px dashed var(--pop);outline-offset:2px}
#rules.two li.b{display:none}
.card p.mode2{font-size:15px;margin:8px 0 0}
body.two #dotAi{background:#2F7FE0}
body.two .legend .l1,body:not(.two) .legend .l2{display:none}
.stats{font-family:var(--pix);font-size:11px;line-height:1.8;margin:10px 0 4px}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.langs button{font-family:var(--pix);font-size:9px;background:var(--white);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:5px 6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold)}
.home{display:inline-block;margin-top:14px;font-family:var(--pix);font-size:10px;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--pop);padding-bottom:2px}
.count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--pix);font-size:64px;color:var(--gold);text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--pix);font-size:10px;line-height:1.4;text-align:center;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 8px;pointer-events:none;width:max-content;max-width:calc(100% - 40px)}
</style>
</head>
<body>
<canvas id="c" aria-label="Skiing"></canvas>
<div class="hud" id="hud" hidden>
  <div class="row">
    <div class="chip" id="lvlChip">LVL 1</div>
    <div class="chip" id="timeChip">0.0</div>
    <div class="chip warn" id="wobChip" hidden>WACKELIG!</div>
  </div>
  <div class="row"><div class="track"><div class="dot" id="dotAi"></div><div class="dot" id="dotMe"></div></div></div>
  <div class="legend"><span><i style="background:var(--pop)"></i><b class="l1" data-i18n="you">DU</b><b class="l2" data-i18n="red">ROT</b></span><span><i class="l1" style="background:var(--cpu)"></i><i class="l2" style="background:#2F7FE0"></i><b class="l1" data-i18n="cpu">CPU</b><b class="l2" data-i18n="blue">BLAU</b></span></div>
</div>
<div class="count" id="count" hidden>3</div>
<div class="hint" id="hint" hidden data-i18n="hint"></div>

<div class="overlay" id="startOv">
  <div class="card">
    <h1 class="good" data-i18n="title">SKIING!</h1>
    <p data-i18n="intro"></p>
    <ul id="rules"></ul>
    <div class="lvls" id="lvls" hidden><span data-i18n="from">LEVEL</span><div class="lv" id="lvRow" role="group"></div></div>
    <div class="modes" id="modes" role="group"><button type="button" data-m="1" data-i18n="p1">1 SPIELER</button><button type="button" data-m="2" data-i18n="p2">2 SPIELER</button></div>
    <p class="mode2" id="mode2" hidden data-i18n="rule2"></p>
    <button class="btn" id="startBtn" data-i18n="start">LOS!</button>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <a class="home" href="../" data-i18n="home">← ALLE SPIELE</a>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="card">
    <h1 id="endTitle">GEWONNEN!</h1>
    <p id="endText"></p>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">NOCHMAL</button><br>
    <button class="btn alt" id="menuBtn" data-i18n="menu">MENÜ</button>
  </div>
</div>

let lang='de',T=LANG.de;
const $=s=>document.querySelector(s);
function fitTitles(){document.querySelectorAll('.card h1').forEach(h=>{h.style.fontSize='';const ov=h.closest('.overlay'),hid=ov.hidden;ov.hidden=false;let fs=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+1&&fs>12){fs-=2;h.style.fontSize=fs+'px'}ov.hidden=hid})}
function setLang(k,save){
  lang=LANG[k]?k:'en';T=LANG[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T[el.dataset.i18n]});
  $('#rules').innerHTML='';T.rules.forEach(([c,t])=>{const li=document.createElement('li');li.className=c;li.textContent=t;$('#rules').append(li)});
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===lang));
  if(save)try{localStorage.setItem('irrgarten.lang',lang)}catch(_){}
  if(lastEnd)showEnd(lastEnd,true);

/* ---------- course ---------- */
const SLOPE=0.3, G=330, SPIN=620, VMIN=36;

const PROFILES={
  mix:{mog:2,ramp:1,hurd:1,gmin:4,gmax:7,A:[6,8.5]},

/* Looks: day, sunset, forest, night — cycling per level. */
const THEMES=[
  {sky:['#3E8EDE','#4F9CE6','#62ABEE','#7ABBF3','#94CAF6','#B2DAF9'],sun:'#FFF4B0',far:'#9CB8DA',cap:'#EEF5FC',mid:'#C9DDF0',pineFar:'#5E8FB5',trees:0.3,cloud:'#FFFFFF',cloud2:'#E3F1FC'},
  {sky:['#4B3B8F','#7A4A9E','#B45C93','#E3768A','#F59D7E','#FBC48A'],sun:'#FFE08A',far:'#8A6FA8',cap:'#F7D8E6',mid:'#C59AB8',pineFar:'#6F5A8C',trees:0.3,cloud:'#FFD6C9',cloud2:'#F2B5B0'},
  {sky:['#3F9BD6','#57AEDD','#74BFE3','#93CFE8','#B3DEEC','#CFEAEF'],sun:'#FFF4B0',far:'#7FA88F',cap:'#EAF4EE',mid:'#9CC3A4',pineFar:'#3F7A58',trees:0.8,cloud:'#FFFFFF',cloud2:'#E3F1FC'},
  {sky:['#0E1433','#15204A','#1D2D5E','#283C73','#344C86','#435C96'],sun:'#F4F1D0',moon:true,far:'#3D4F80',cap:'#C9D6EE',mid:'#566A9C',pineFar:'#2C3B66',trees:0.35,cloud:'#56688F',cloud2:'#43547A',stars:true}];
function build(lv){

  const N=goal+2400;
  TY_=new Float32Array(N);KIND=new Uint8Array(N);MID=new Int32Array(N).fill(-1);mogs=[];ramps=[];trees=[];hurdles=[];
  let x=0,y=0;
  const put=(yy,k,id)=>{if(x<N){TY_[x]=yy;KIND[x]=k;MID[x]=id==null?-1:id}x++};
  for(let i=0;i<90;i++)put(y+=0.12,0);
  const moguls=n=>{for(let j=0;j<n;j++){
    const P=Math.round(42+r()*10-Math.min(lv,6)),A=prof.A[0]+r()*(prof.A[1]-prof.A[0]),id=mogs.length,x0=x,y0=y;

    for(let i=0;i<26;i++)put(y+=0.22,0);
    const L=58,x0=x,y0=y;
    for(let i=0;i<L;i++){const t=i/L;put(y0+0.1*i-22*t*t,t<0.5?3:4)}

  const hurdleRun=()=>{
    const n=2+Math.floor(r()*(lv>=6?3:2));

    for(let h=0;h<n;h++){
      const types=['fence','snowman','logs','barrier'],type=types[Math.floor(r()*types.length)];

function TY(x){if(x<=0)return TY_[0]+x*0.12;const i=Math.floor(x);if(i>=LEN-1)return TY_[LEN-1]+(x-LEN+1)*0.2;const f=x-i;return TY_[i]*(1-f)+TY_[i+1]*f}

function mkRider(ai,back){return{ai,back:!!back,x:40,y:0,v:VMIN,vy:0,air:false,big:false,rot:0,spin:false,held:false,holdT:9,ang:0,wob:0,streak:0,lastM:-1,

function launch(r,big){

}

/* ---------- computer brain ---------- */

/* ---------- background layers ---------- */

}

    let top,top2;
    if(back){top=k===1?'#F3E3A0':k===4?'#F5CDA5':k===6?'#B9E3F0':'#F6FAFE';top2=top}
    else{top=k===1?'#FFD23F':k===4?'#FF9A2E':k===6?'#5CC8EA':'#FFFFFF';top2=k===1?'#FFF0A8':k===4?'#FFC98A':k===6?'#B5E8F6':'#FFFFFF'}
    rect(top,i,ty,1,2);rect(top2,i,ty+2,1,1);
    if(back){rect('#D6E6F4',i,ty+3,1,H-ty-3);continue}
    rect(k===2||k===3?'#D9EAF8':'#E6F2FC',i,ty+3,1,9);
    rect('#CFE2F3',i,ty+12,1,H-ty-12);
    if((Math.floor(wx)%11)===0)rect('#BBD3EA',i,ty+16+(Math.floor(wx/11)%5)*6,1,1);
    if(k===1&&((Math.floor(wx)+blink*3)%7===0))rect('#FFFFFF',i,ty-2,1,1);
  }
}
function drawHurdle(h,off){
  const sx=Math.round(h.x-camX);if(sx<-20||sx>W+20)return;const g=Math.round(TY(h.x+h.w/2)-camY-off),t=g-h.h;
  const K='#1B1F3B';
  if(h.type==='fence'){rect(K,sx,t,2,h.h);rect(K,sx+h.w-2,t,2,h.h);rect('#A0652F',sx,t+1,h.w,2);rect('#A0652F',sx,t+5,h.w,2);rect('#7A4A22',sx,t+3,h.w,1);rect('#7A4A22',sx,t+7,h.w,1)}
  else if(h.type==='snowman'){rect(K,sx,t+6,8,6);rect('#FFFFFF',sx+1,t+7,6,5);rect(K,sx+1,t+2,6,5);rect('#FFFFFF',sx+2,t+3,4,4);rect(K,sx+2,t-1,4,3);rect(K,sx+1,t+1,6,1);rect('#FF8C1A',sx+6,t+4,2,1);rect(K,sx+3,t+4,1,1);rect('#E83B3B',sx+1,t+6,6,1)}
  else if(h.type==='logs'){for(const[dx,dy]of[[0,3],[6,3],[3,0]]){rect(K,sx+dx,t+dy,6,4);rect('#A0652F',sx+dx+1,t+dy+1,4,2);rect('#E0B07A',sx+dx+2,t+dy+1,2,2)}}
  else{rect(K,sx+1,t+3,1,h.h-3);rect(K,sx+h.w-2,t+3,1,h.h-3);rect(K,sx,t,h.w,4);for(let i=1;i<h.w-1;i++)rect((i>>1)%2?'#FFFFFF':'#E83B3B',sx+i,t+1,1,2)}
}
function drawDeco(off,back){
  ramps.forEach(rp=>{const sx=Math.round(rp.lip-camX);if(sx<-20||sx>W+20)return;const y=Math.round(TY(rp.lip-1)-camY-off);
    const ly=Math.round(TY(rp.lip+1)-camY-off);rect(back?'#C9DCEE':'#BBD3EA',sx,y+3,2,Math.max(0,ly-y));
    if(back)return;
    for(let j=0;j<10;j++)rect(j%4<2?'#E83B3B':'#FFFFFF',sx-1,y-12+j,1,1);rect('#1B1F3B',sx,y-12,1,10);
    const ax=Math.round(rp.x0-camX);rect('#1B1F3B',ax,Math.round(TY(rp.x0)-camY)-12,1,12);rect('#FF9A2E',ax+1,Math.round(TY(rp.x0)-camY)-12,6,4);
  });
  if(back){ctx.save();ctx.globalAlpha=0.55;hurdles.forEach(h=>drawHurdle(h,off));ctx.restore();
    trees.forEach(t=>{const sx=Math.round(t-camX);if(sx<-10||sx>W+10)return;ctx.drawImage(SPR_PINE,sx-3,Math.round(TY(t)-camY-off)-9)});return}
  hurdles.forEach(h=>drawHurdle(h,0));
  gate(46,T.startT,'#62ABEE');gate(finishX,T.finish,'#1B1F3B',true);
}
function gate(x,label,col,checker){
  const sx=Math.round(x-camX);if(sx<-60||sx>W+60)return;const g=Math.round(TY(x)-camY);
  const ph=40+LANE;rect('#1B1F3B',sx-1,g-ph,2,ph);rect('#1B1F3B',sx+21,Math.round(TY(x+22)-camY)-ph,2,ph);
  const by=Math.min(g,Math.round(TY(x+22)-camY))-ph-4;
  for(let i=0;i<24;i++)for(let j=0;j<6;j++)rect(checker?(((i>>1)+(j>>1))%2?'#FFFFFF':'#1B1F3B'):(j<1||j>4?'#1B1F3B':col),sx-1+i,by+j,1,1);
  txt(label,sx+11,by-7,checker?'#FFD23F':'#FFFFFF',8);
  if(checker)for(let i=0;i<4;i++)rect(i%2?'#1B1F3B':'#FFFFFF',sx+i*6,g-1,6,2);
}
function drawRider(r){
  const off=r.back?LANE:0,sx=r.x-camX,sy=r.y-camY-off;if(sx<-20||sx>W+20)return;
  if(r.air){const gy=Math.round(TY(r.x)-camY-off);rect(r.back?'#C3D9EE':'#A9C6E0',Math.round(sx)-5,gy,10,1)}
  ctx.save();ctx.globalAlpha=r.ai?0.8:1;
  let ang=r.ang,rot=r.rot*Math.PI/180;
  if(r.wob&&!r.crashed&&!r.air)ang+=Math.sin(r.wobT*22)*0.16;
  if(r.crashed&&!r.ai){rot=Math.min(1,r.crashT*3)*1.6+(r.air?r.rot*Math.PI/180:0)}
  ctx.translate(Math.round(sx),Math.round(sy)+(r.push>0?1:0));ctx.rotate(ang);ctx.translate(0,-7);ctx.rotate(rot);
  ctx.drawImage(r.ai?SPR_AI:r.back?SPR_P2:SPR_ME,-8,-8);ctx.restore();
}
function drawFx(dt){
  parts=parts.filter(p=>(p.t-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.vy+=200*dt;p.y+=p.vy*dt;rect(p.ai?'#EAF4FD':'#FFFFFF',p.x-camX,p.y-camY-(p.ai?LANE:0),1,1)});
  pops=pops.filter(p=>(p.t+=dt)<0.9);pops.forEach(p=>{const s=T[p.key];txt(s,p.x-camX,p.y-camY-p.t*18,p.col,8)});
}
function drawAiMarker(){marker(A,P,two?T.blue:T.cpu,two?'#6FB3FF':'#A9D4F5');if(two)marker(P,A,T.red,'#FF7A7A')}
function marker(Q,O,label,col){
  const sx=Q.x-camX;if(sx>=-6&&sx<=W+6)return;
  const d=Math.round(Math.abs(Q.x-O.x)/10)+'m',right=sx>W,y=Math.max(30,Math.min(H-30,Math.round(TY(Math.max(camX,Math.min(camX+W,Q.x)))-camY)-24-(Q.back?LANE:0)));
  const x=right?W-16:16;txt(label,x,y-6,col,8);txt((right?'+':'-')+d,x,y+6,'#FFFFFF',8);
  for(let i=0;i<4;i++)rect('#1B1F3B',right?W-4+i-4:4-i+3,y-i,1,i*2+1);
}

/* ---------- game flow ---------- */
let state='menu',count=0,raceT=0,endT=0,endWhy=null,lastEnd=null,hintT=0;
let reached=1;try{reached=Math.max(1,+localStorage.getItem('skiing.reach')||1)}catch(_){}
let pick=Math.min(reached,(()=>{try{return +localStorage.getItem('skiing.level')||reached}catch(_){return reached}})());
function paintLevels(){
  const row=$('#lvRow');row.innerHTML='';$('#lvls').hidden=reached<2;
  for(let i=1;i<=reached;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.setAttribute('aria-pressed',i===pick);b.onclick=()=>{pick=i;paintLevels()};row.append(b)}
}
function startRace(lv){
  level=lv;try{localStorage.setItem('skiing.level',lv)}catch(_){}
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  if(AC&&AC.state==='suspended')AC.resume();
  build(lv);SK=aiSkill(lv);
  P=mkRider(false,false);A=mkRider(!two,true);P.y=A.y=TY(40);A.x=40;
  document.body.classList.toggle('two',two);
  parts=[];pops=[];raceT=0;hurdles.forEach(h=>{h.hit0=h.hit1=0});endWhy=null;lastEnd=null;
  camX=P.x-W*0.3;camY=P.y-H*0.6;
  $('#startOv').hidden=true;$('#endOv').hidden=true;$('#hud').hidden=false;
  $('#lvlChip').textContent='LVL '+lv;
  state='count';count=3.0;$('#count').hidden=false;$('#count').textContent='3';beep('tick');
  hintT=lv<=2?7:lv===3?7:3;$('#hint').textContent=two?T.hint2:lv===3?T.newH:T.hint;if(two)hintT=6;
}
function showEnd(why,refresh){
  lastEnd=why;state='end';$('#endOv').hidden=false;$('#hud').hidden=true;$('#hint').hidden=true;
  const win=why==='win';
  $('#endTitle').textContent=T[why==='hurdle'?'crash':why];$('#endTitle').className=win||why==='redWin'||why==='blueWin'?'good':'';
  $('#endText').textContent=T[why+'P'];
  if(two){
    const line=(r,n)=>`${n}: ${r.fin?r.finT.toFixed(1)+'s':r.crashed?'✗':'–'} · ${T.flips} ${r.flips}`;
    $('#endStats').innerHTML=line(P,T.red)+'<br>'+line(A,T.blue);
    $('#againBtn').textContent=T.retry;
    if(!refresh){beep(why==='bothOut'?'crash':'win');pick=level;fitTitles()}
    return;
  }
  $('#endStats').innerHTML=(P.fin?`${T.time}: ${P.finT.toFixed(1)}s<br>`:'')+`${T.flips}: ${P.flips}`;
  $('#againBtn').textContent=win?T.next:T.retry;
  if(!refresh){
    if(win){beep('win');if(level+1>reached){reached=level+1;try{localStorage.setItem('skiing.reach',reached)}catch(_){}}pick=level+1}else pick=level;
    fitTitles();
  }
}
try{two=localStorage.getItem('skiing.mode')==='2'}catch(_){}
function paintModes(){document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.m==='2')===two));$('#mode2').hidden=!two;$('#rules').classList.toggle('two',two);fitTitles()}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{two=b.dataset.m==='2';try{localStorage.setItem('skiing.mode',two?'2':'1')}catch(_){}paintModes()});
paintModes();
$('#startBtn').onclick=()=>startRace(pick);
$('#againBtn').onclick=()=>startRace(pick);
$('#menuBtn').onclick=()=>{lastEnd=null;state='menu';$('#endOv').hidden=true;$('#startOv').hidden=false;paintLevels();fitTitles()};

const touches=new Map();
function riderFor(clientX){return two&&clientX<innerWidth/2?A:P}
function pressR(r){if(state==='run'&&!r.crashed&&!r.fin)press(r)}
function down(e){if(e&&e.cancelable)e.preventDefault();const r=e&&e.clientX!=null?riderFor(e.clientX):P;if(e&&e.pointerId!=null)touches.set(e.pointerId,r);pressR(r)}
function up(e){const r=e&&touches.get(e.pointerId);if(r){touches.delete(e.pointerId);release(r)}else if(!e)release(P)}
cv.addEventListener('pointerdown',down);
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat||!two||state!=='run')return;if(e.code==='KeyA'||e.code==='ShiftLeft'){e.preventDefault();pressR(A)}else if(e.code==='KeyL'||e.code==='ArrowRight'){e.preventDefault();pressR(P)}});
addEventListener('keyup',e=>{if(e.code==='KeyA'||e.code==='ShiftLeft')release(A);else if(e.code==='KeyL'||e.code==='ArrowRight')release(P)});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='Enter'){if(state==='run'){e.preventDefault();pressR(P)}else if(e.code==='Enter'||e.code==='Space'){const b=!$('#startOv').hidden?$('#startBtn'):!$('#endOv').hidden?$('#againBtn'):null;if(b&&document.activeElement===document.body){e.preventDefault();b.click()}}}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='Enter')release(P)});

function step(dt){
  if(!two)aiThink(A);updRider(A,dt);updRider(P,dt);
  if(state==='run'&&two){
    raceT+=dt;
    const out=r=>r.crashed||r.fin;
    if(P.fin||A.fin){state='ending';endT=1.3;endWhy=P.fin&&(!A.fin||P.finT<=A.finT)?'redWin':'blueWin'}
    else if(P.crashed&&A.crashed){state='ending';endT=1.5;endWhy='bothOut'}
    return;
  }
  if(state==='run'){
    raceT+=dt;
    if(P.crashed){state='ending';endWhy=P.crashWhy;endT=1.5}
    else if(P.fin){state='ending';endWhy=(A.fin&&A.finT<P.finT)?'slow':'win';endT=1.3}
    else if(A.fin){state='ending';endWhy='slow';endT=1.0}
  }
}
let last=0;
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;clock+=dt;
  if(state==='count'){
    const before=Math.ceil(count);count-=dt;const now=Math.ceil(count);
    if(now!==before&&now>0){$('#count').textContent=now;beep('tick')}
    if(count<=0){state='run';$('#count').textContent=T.go;beep('go');setTimeout(()=>{if(state!=='count')$('#count').hidden=true},600)}
  }
  if(state==='run'||state==='ending'){
    const n=2;for(let i=0;i<n;i++)step(dt/n);
    if(state==='ending'){endT-=dt;if(endT<=0)showEnd(endWhy)}
    if(hintT>0){hintT-=dt;$('#hint').hidden=hintT<=0}
  }
  if(state!=='menu'){
    let fx=P.x,fy=P.y,air=P.air;
    if(two){const live=[P,A].filter(r=>!r.crashed),L=live.length?live:[P,A],lead=Math.max(...L.map(r=>r.x)),tail=Math.min(...L.map(r=>r.x));
      fx=Math.max(tail,lead-W*0.42);fy=(TY(fx)+(P.y-TY(P.x))*0.5+(A.y-TY(A.x))*0.5)-LANE*0.5;air=P.air||A.air}
    const tx=fx-W*0.3,ty=fy-H*0.56;
    camX+=(tx-camX)*Math.min(1,dt*10);camY+=(ty-camY)*Math.min(1,dt*(air?3:6));
  }else{camX+=dt*40;if(TY_)camY=TY(camX+W*0.3)-H*0.6}
  drawSky();drawBg();
  if(TY_){drawTerrain(LANE,true);drawDeco(LANE,true);drawRider(A);drawTerrain(0,false);drawDeco(0,false);drawRider(P);drawFx(dt);if(state!=='menu')drawAiMarker()}
  if(state==='run'||state==='ending'||state==='count'){
    const f=x=>Math.max(0,Math.min(100,(x-40)/(finishX-40)*100))+'%';
    $('#dotMe').style.left=f(P.x);$('#dotAi').style.left=f(A.x);
    $('#timeChip').textContent=raceT.toFixed(1);
    $('#wobChip').hidden=!P.wob||P.crashed||two;
  }
  requestAnimationFrame(frame);
}

/* menu backdrop: a demo course scrolling behind the card */
build(1);
(function init(){
  let want='de';try{const s=localStorage.getItem('irrgarten.lang');if(LANG[s])want=s;else{const n=(navigator.language||'de').slice(0,2);if(LANG[n])want=n}}catch(_){}
  setLang(want,false);paintLevels();
  if(document.fonts)document.fonts.ready.then(fitTitles);
  requestAnimationFrame(frame);
})();
window.__ski={get P(){return P},get A(){return A},get state(){return state},get finishX(){return finishX},press:()=>pressR(P),release:()=>release(P),pressR,releaseR:release,get two(){return two},kindAt,mogs:()=>mogs,ramps:()=>ramps,hurdles:()=>hurdles,lane:()=>LANE,start:startRace};
</script>
